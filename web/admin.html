      function renderNetwork() {
        const agentResponse = state.data.agents || {};
        const agents = responseRows(agentResponse, "agents");
        const agentOptions = state.data.agentOptions?.agents || agents;
        const directors = agentOptions.filter(agent => agent.role === "director");
        const bridgeResponse = state.data.bridges || {};
        const bridges = responseRows(bridgeResponse, "bridges");
        const status = state.data.status || {};
        const otherProjects = state.projects.filter(project => project.project_id !== state.projectId);
        return pageHead("Cross-workspace coordination", "AI Network", "Manage workspace authority relationships and room participation as separate controls.", `<button class="button" data-view="room">Open Room / Inbox</button>`) +
          (state.errors.bridges || state.errors.agents
            ? errorNotice([state.errors.bridges, state.errors.agents].filter(Boolean).join(" · ")) : "") +
          `<div class="notice"><span>i</span><div><strong>Relationship and participation answer different questions.</strong><br>Peer / Master / Advisor defines authority between workspaces. Participation defines which AIs may enter that one inter-project conversation. Changing participation never deletes the relationship; deleting the relationship disconnects the workspace rooms entirely. Roles still follow the workspace, not the app window.</div></div>
          <div class="grid two section-gap">
            <section class="card"><div class="card-head"><h2>Directors & workers</h2><span class="faint small">${h(responsePage(agentResponse, "agents", listPage("agents").offset).unfilteredTotal)} registered</span></div><div class="card-body"><div class="filterbar"><input id="agent-search" type="search" value="${h(state.agentSearch)}" placeholder="Search all registered identities…" aria-label="Search registered identities">${sortControl("agents")}</div>
              <form data-form="set-lead"><div class="field"><label for="lead-agent">Lead Director</label><select id="lead-agent" name="agent_id"><option value="">No lead director</option>${directors.map(agent => `<option value="${h(agent.agent_id)}" ${status.lead_director === agent.agent_id ? "selected" : ""}>${h(agentChoiceLabel(agent))}</option>`).join("")}</select><span class="help">Only registered Directors can lead. The choice persists across Claude, Codex, Kimi, and other clients in this workspace.</span></div><div class="form-actions"><button class="button primary" type="submit">Save lead</button></div></form>
              <div class="list section-gap">${agents.length ? agents.map(agent => `<div class="list-row"><div><div class="list-title">${h(agentFriendlyName(agent))}</div><div class="list-meta"><span>${h(agentShortName(agent) || "Compatibility record")}</span>${agentDisplayDescription(agent) && agentDisplayDescription(agent) !== agentFriendlyName(agent) ? `<span>${h(agentDisplayDescription(agent))}</span>` : ""}${ownerChip(agent.owner)}<span>${h(agent.role || "role not assigned")}</span><span>${h(agent.runtime || "runtime unknown")}</span><span>seen ${h(fmtTime(agent.last_seen_at || agent.registered_at))}</span></div></div>${agent.agent_id === status.lead_director ? `<span class="badge accepted">lead</span>` : statusBadge(agent.role || "unassigned")}</div>`).join("") : `<div class="muted">${h(state.agentSearch ? "No registered identities match this full-directory search." : listPage("agents").offset ? "No identities are available at this offset." : "No AIs registered yet. Guided setup asks for the first AI's role and recommends Director.")}</div>`}</div>${pageToolbar("agents", agentResponse, "agents", "registered identities")}
            </div></section>
            <section class="card"><div class="card-head"><h2>Create an AI identity or change its role</h2></div><div class="card-body"><form data-form="register-agent"><div class="form-grid"><div class="field"><label for="agent-pick">AI identity</label><select id="agent-pick" name="agent_id" data-agent-pick>${agentOptions.map(agent => `<option value="${h(agent.agent_id)}">${h(agentChoiceLabel(agent))}</option>`).join("")}<option value="__new__">+ Create a generated identity…</option></select><span class="help">Choose a friendly identity such as Gibbs, or ask the server to reserve the next never-before-used name. Canonical actor IDs remain internal.</span></div><div class="field"><label for="agent-name">Display description (optional)</label><input id="agent-name" name="display_name" placeholder="Recommendation engine Director"></div><div class="field"><label for="agent-role">Role</label><select id="agent-role" name="role"><option value="director">Director · governance + own handoff</option><option value="advisor">Advisor · own identity handoff</option><option value="worker">Worker · own identity handoff</option></select></div><div class="field" data-new-actor ${agentOptions.length ? "hidden" : ""}><label for="agent-runtime">Runtime</label><input id="agent-runtime" name="runtime" placeholder="codex" ${agentOptions.length ? "" : "required"}><span class="help">The server generates and transactionally reserves a server-unique name; the first available name is Gibbs. Temporary current-process identities are created only by guided setup through the live MCP proxy.</span></div></div><div class="form-actions"><button class="button primary" type="submit">Save AI identity</button></div></form></div></section>
            <section class="card" style="grid-column:1/-1"><div class="card-head"><h2>Connect workspace rooms</h2><span class="faint small">default relationship: master</span></div><div class="card-body"><form data-form="add-bridge"><div class="field"><label for="bridge-project">Connected workspace</label><select id="bridge-project" name="other_project" required ${otherProjects.length ? "" : "disabled"}><option value="">Choose workspace…</option>${otherProjects.map(project => `<option value="${h(project.project_id)}">${h(project.name)} · ${h(project.project_id)}</option>`).join("")}</select></div><div class="bridge-relationship section-gap"><div class="eyebrow">Authority relationship</div><div class="form-grid section-gap"><div class="field"><label for="bridge-relation">Relationship</label><select id="bridge-relation" name="relation"><option value="master">Master / subordinate (default)</option><option value="peer">Peer</option><option value="advisor">Advisor</option></select></div><div class="field"><label for="bridge-principal">Who is master/advisor?</label><select id="bridge-principal" name="principal_side"><option value="other">Connected workspace (default)</option><option value="current">This workspace</option></select></div></div></div><div class="bridge-relationship section-gap"><div class="eyebrow">Initial room participation</div><p class="muted small">Set access atomically when creating the relationship. This policy does not change which workspace is master, advisor, or peer.</p><div class="form-grid section-gap">${bridgeParticipationFields("new", "local", state.projectId)}${bridgeParticipationFields("new", "peer", "", "all", [], "Connected workspace")}</div></div><div class="form-actions"><button class="button primary" type="submit" ${otherProjects.length ? "" : "disabled"}>Create relationship</button></div></form><div class="notice section-gap"><span>i</span><div>Master directives are binding; advisor messages are advice; peers are equal. Participation independently limits who may read, send, or mutate the named inter-project conversation.</div></div></div></section>
            <section class="card" style="grid-column:1/-1"><div class="card-head"><h2>Connected rooms</h2><span class="faint small">${h(responsePage(bridgeResponse, "bridges", listPage("bridges").offset).unfilteredTotal)} relationship${responsePage(bridgeResponse, "bridges", listPage("bridges").offset).unfilteredTotal === 1 ? "" : "s"}</span></div><div class="card-body"><div class="filterbar"><input id="bridge-search" type="search" value="${h(state.bridgeSearch)}" placeholder="Search all workspace relationships…" aria-label="Search connected workspace rooms">${sortControl("bridges")}</div>${bridges.length ? bridges.map(bridge => `<article class="bridge-panel"><div class="bridge-panel-head"><div><h3>${h(projectName(state.projectId))} ↔ ${h(projectName(bridge.with))}</h3><div class="list-meta"><span>${h(bridge.relation)} relationship</span>${bridge.principal ? `<span>${h(projectName(bridge.principal))} is ${h(bridge.relation === "master" ? "master" : "advisor")}</span>` : `<span>equal authority</span>`}<span>${h(projectName(state.projectId))}: ${h(bridgeParticipationLabel(bridge.participation))}</span><span>${h(projectName(bridge.with))}: ${h(bridgeParticipationLabel(bridge.peer_participation))}</span></div></div><div class="cluster">${bridge.can_participate === false ? `<span class="badge error">panel identity denied</span>` : bridge.can_participate === true ? `<span class="badge accepted">panel identity allowed</span>` : ""}</div></div><div class="grid two section-gap"><div class="bridge-relationship"><div class="eyebrow">Authority relationship</div><p class="muted small"><strong>${h(identityPart(bridge.relation))}</strong> controls authority only. Delete this relationship only when the workspace rooms should be disconnected.</p><div class="cluster section-gap"><button class="button small" data-action="open-connected-room" data-project="${h(bridge.with)}">View conversation</button><button class="button danger small" data-action="remove-bridge" data-project="${h(bridge.with)}">Delete relationship</button></div></div><div class="bridge-relationship"><div class="eyebrow">Room participation</div><form data-form="update-bridge-participation" data-project="${h(bridge.with)}"><div class="form-grid section-gap">${bridgeParticipationFields(bridge.with, "local", state.projectId, bridge.participation, bridge.allowed_agents)}${bridgeParticipationFields(bridge.with, "peer", bridge.with, bridge.peer_participation, bridge.peer_allowed_agents)}</div><div class="form-actions"><button class="button primary small" type="submit">Save participation</button></div></form><span class="help">Saving here changes access only. It never removes or changes the ${h(bridge.relation)} relationship.</span></div></div></article>`).join("") : `<div class="muted">${h(state.bridgeSearch ? "No workspace relationships match this full-network search." : listPage("bridges").offset ? "No relationships are available at this offset." : "No connected workspace rooms yet.")}</div>`}${pageToolbar("bridges", bridgeResponse, "bridges", "workspace relationships")}</div></section>
          </div>`;
      }

      function credentialOwner(record, account) {
        return record?.human_owner || record?.owner_username || record?.username || record?.owner || account?.username || "not recorded";
      }

      function credentialStatus(record) {
        if (record?.revoked_at) return "revoked";
        if (record?.expires_at && new Date(record.expires_at).valueOf() <= Date.now()) return "expired";
        return "active";
      }

      function renderCredentialMemberships(record) {
        const memberships = credentialMemberships(record);
        return memberships.length
          ? memberships.map(projectId => `<span class="chip">${h(projectName(projectId))} · ${h(projectId)}</span>`).join("")
          : `<span class="chip">no workspace membership</span>`;
      }

      // D-17 client-install authorization is the sole Settings access surface.
      function renderClientKeyRow(key, account) {
        const status = credentialStatus(key);
        const memberships = credentialMemberships(key);
        const scope = memberships.length
          ? memberships.map(projectId => `<span class="chip">${h(projectName(projectId))} · ${h(projectId)}</span>`).join("")
          : `<span class="chip">all workspaces available to @${h(credentialOwner(key, account))}</span>`;
        const action = status === "active"
          ? `<button class="button danger small" type="button" data-action="revoke-client-key" data-key="${h(key.token_id)}">Revoke key</button>`
          : `<button class="button danger small" type="button" data-action="delete-client-key" data-key="${h(key.token_id)}">Delete permanently</button>`;
        return `<div class="list-row"><div><div class="cluster"><strong>${h(key.label || "Attacca client")}</strong>${statusBadge(status)}</div><div class="list-meta"><span>Human owner: @${h(credentialOwner(key, account))}</span><span>Client installation: ${h(key.client_instance || "not recorded")}</span><span>Prefix: ${h(key.token_prefix || "atkey_")}…</span><span>Last use: ${h(fmtTime(key.last_used_at))}</span><span>${key.expires_at ? `Expires: ${h(fmtTime(key.expires_at))}` : "No expiry"}</span></div><div class="cluster section-gap"><span class="faint small">Workspace scope</span>${scope}</div><p class="muted small section-gap">This key authenticates the client installation only. AI actor, role, runtime, and Run by user attribution are resolved separately on every request.</p></div>${action}</div>`;
      }

      function renderPendingClientAuthorization() {
        const authorizationRequest = state.clientAuthorization?.authorizationRequest || "";
        if (!authorizationRequest) return "";
        if (state.pendingClientAuthorizationError) {
          return `<div class="notice error"><span>!</span><div><strong>Client authorization request unavailable.</strong><br>${h(state.pendingClientAuthorizationError)}</div></div>`;
        }
        const request = state.pendingClientAuthorization;
        if (!request) return `<div class="notice"><span>…</span><div>Loading client authorization request…</div></div>`;
        const status = String(request.status || "pending");
        const scope = `<strong>All workspaces available to @${h(state.auth?.user?.username || "this account")}</strong>`;
        const actions = status === "pending"
          ? `<div class="form-actions"><button class="button primary" type="button" data-action="authorize-client-authorization">Authorize client</button><button class="button danger" type="button" data-action="deny-client-authorization">Deny</button></div>`
          : `<div class="notice ${status === "approved" ? "ok" : status === "denied" ? "error" : ""}"><span>i</span><div>This request is ${h(status)}. No further authorization action is available.</div></div>`;
        return `<section class="card" style="grid-column:1/-1"><div class="card-head"><div><h2>Authorize client installation</h2><span class="faint small">explicit human approval required</span></div>${statusBadge(status)}</div><div class="card-body"><div class="notice"><span>i</span><div><strong>Review before authorizing.</strong><br>This grants the client installation access as your human account. It does not select or bind an AI identity.</div></div><div class="list section-gap"><div class="list-row"><span class="muted">Client label</span><strong>${h(request.label || "Attacca client")}</strong></div><div class="list-row"><span class="muted">Client installation</span><code>${h(request.client_instance || "not recorded")}</code></div><div class="list-row"><span class="muted">Device</span><code>${h(request.device_id || "not recorded")}</code></div><div class="list-row"><span class="muted">Workspace scope</span>${scope}</div><div class="list-row"><span class="muted">Expires</span><span>${h(fmtTime(request.expires_at))}</span></div></div>${actions}</div></section>`;
      }

      function renderAuthenticatedSettings() {
        const settings = state.serverSettings || {};
        const account = state.auth?.user || {};
        const access = state.credentialAccess || emptyCredentialAccess();
        const eligibility = activationEligibility(access, account);
        const keys = access.client_keys || [];
        const keyPage = responsePage(access, "client_keys", listPage("clientKeys").offset);
        const keyRows = keys.length
          ? keys.map(key => renderClientKeyRow(key, account)).join("")
          : `<div class="muted">No client API keys yet.</div>`;
        const activationText = eligibility.enabled
          ? "Authentication is enforced. Browser sessions or a valid client-install API key are required."
          : "Authentication enforcement is off. Create keys for active client installations before enabling it.";
        const activationButton = eligibility.enabled
          ? "Disable authentication enforcement"
          : "Enable authentication enforcement";
        return pageHead("Account and access", "Settings", "Manage browser sign-in, human-owned API keys for installed clients, and server behavior. AI identities remain separate.") +
          `<div class="notice"><span>✓</span><div><strong>Signed in as @${h(account.username)}</strong><br>This immutable account name is used for login and audit attribution. It authorizes clients but never renames or replaces an AI identity.</div></div>
          <div class="grid two section-gap">
            ${renderPendingClientAuthorization()}
            <section class="card"><div class="card-head"><h2>Human account</h2><span class="badge accepted">${account.is_owner ? "server owner" : account.is_admin ? "admin" : "user"}</span></div><div class="card-body"><div class="list"><div class="list-row"><span class="muted">Account name</span><strong>@${h(account.username)}</strong></div><div class="list-row"><span class="muted">Authentication authority</span><strong>${account.is_owner ? "Owner toggle available" : "Read only · server owner required"}</strong></div></div><div class="form-actions"><button class="button danger" type="button" data-action="auth-logout">Sign out</button></div></div></section>
            <section class="card"><div class="card-head"><h2>Authentication enforcement</h2>${statusBadge(eligibility.enabled ? "enabled" : "off")}</div><div class="card-body"><p class="muted">${h(activationText)}</p>${eligibility.reasons.length ? `<div class="notice section-gap"><span>i</span><div>${h(eligibility.reasons.join(" "))}</div></div>` : ""}<div class="form-actions"><button class="button ${eligibility.enabled ? "danger" : "primary"}" type="button" data-action="toggle-authentication" ${eligibility.allowed ? "" : "disabled"} data-enabled="${eligibility.enabled ? "false" : "true"}">${h(activationButton)}</button></div></div></section>
            <section class="card" style="grid-column:1/-1"><div class="card-head"><div><h2>Client API keys</h2><span class="faint small">one human-owned key per authorized client</span></div><span class="badge">${h(keyPage.unfilteredTotal)} key${keyPage.unfilteredTotal === 1 ? "" : "s"}</span></div><div class="card-body"><div class="notice"><span>i</span><div><strong>Client authorization and AI identity are separate.</strong><br>New installations open a short-lived authorization request here. Review the client and scope, then explicitly authorize or deny it. The browser never displays or asks you to copy an API key.</div></div>${access.supported ? "" : `<div class="notice error section-gap"><span>!</span><div><strong>Client API key management is unavailable.</strong><br>Upgrade the hosted Attacca service before enabling authentication.</div></div>`}${state.errors.clientKeys ? errorNotice(state.errors.clientKeys) : ""}<div class="filterbar section-gap"><input id="client-key-search" type="search" value="${h(state.clientKeySearch)}" placeholder="Search all client keys by label, installation, owner, status, or scope…" aria-label="Search client API keys">${sortControl("clientKeys")}</div><div class="list section-gap">${keyRows}</div>${pageToolbar("clientKeys", access, "client_keys", "client API keys")}</div></section>
            <section class="card"><div class="card-head"><h2>Browser refresh</h2></div><div class="card-body"><form data-form="save-panel-behavior"><div class="form-grid"><div class="field"><label for="settings-refresh">Refresh interval</label><input id="settings-refresh" name="refreshSeconds" type="number" min="5" max="300" value="${h(state.prefs.refreshSeconds)}"></div><div class="field"><label for="settings-auto">Live refresh</label><select id="settings-auto" name="autoRefresh"><option value="true" ${state.prefs.autoRefresh ? "selected" : ""}>On</option><option value="false" ${!state.prefs.autoRefresh ? "selected" : ""}>Off</option></select></div></div><div class="form-actions"><button class="button primary" type="submit">Save browser settings</button></div></form></div></section>
            <section class="card"><div class="card-head"><h2>Server runtime</h2>${statusBadge(state.health?.ok ? "ok" : "error")}</div><div class="card-body"><form data-form="save-runtime"><div class="form-grid"><div class="field wide"><label for="runtime-default">Default workspace</label><select id="runtime-default" name="default_project"><option value="">No server default</option>${state.projects.map(project => `<option value="${h(project.project_id)}" ${settings.default_project === project.project_id ? "selected" : ""}>${h(project.name)} · ${h(project.project_id)}</option>`).join("")}</select></div><div class="field"><label for="runtime-update-interval">AI update checks</label><select id="runtime-update-interval" name="update_interval_seconds">${[[0,"Off"],[60,"Every minute (default)"],[300,"Every 5 minutes"],[600,"Every 10 minutes"],[1800,"Every 30 minutes"],[3600,"Every hour"]].map(([seconds,label]) => `<option value="${seconds}" ${Number(settings.update_interval_seconds) === seconds ? "selected" : ""}>${label}</option>`).join("")}</select></div><div class="field"><label for="runtime-verbose">Request logging</label><select id="runtime-verbose" name="verbose"><option value="false" ${!settings.verbose ? "selected" : ""}>Quiet</option><option value="true" ${settings.verbose ? "selected" : ""}>Verbose</option></select></div></div><div class="form-actions"><button class="button primary" type="submit">Save watcher settings</button></div></form><div class="notice section-gap"><span>↗</span><div><strong>Connection changes stay local to each client installation.</strong><br>The active AI opens sign-in and secure key collection itself; this panel never asks a human to run a shell command.</div></div></div></section>
            <section class="card" style="grid-column:1/-1"><div class="card-head"><h2>Download all workspace data</h2></div><div class="card-body"><p class="muted">Download a deterministic snapshot of the selected workspace, including the ledger and full logs. Authentication secrets are excluded. This is a private human backup, not the agent sync mirror; a failed download stays visible and no empty placeholder file is saved.</p><div class="form-actions" style="justify-content:flex-start"><button class="button primary" type="button" data-action="download-export" data-format="zip" ${state.projectId ? "" : "disabled"}>ZIP</button><button class="button" type="button" data-action="download-export" data-format="json" ${state.projectId ? "" : "disabled"}>Full JSON</button><button class="button" type="button" data-action="download-export" data-format="ledger.ndjson" ${state.projectId ? "" : "disabled"}>Ledger NDJSON</button><button class="button" data-action="download-export" data-format="full-log.txt" ${state.projectId ? "" : "disabled"}>Full log</button></div></div></section>
          </div>`;
      }

      async function reloadTaskPlan({ showLoading = true } = {}) {
        const selected = state.taskPlan;
        if (!selected.taskId) return;
        state.loadSerial += 1;
        const taskId = selected.taskId;
        const requestSerial = (Number(selected.requestSerial) || 0) + 1;
        selected.requestSerial = requestSerial;
        selected.error = "";
        if (showLoading) {
          selected.loading = true;
          render({ force: true });
        }
        try {
          const suffix = taskPlanRequestSuffix(selected);
          const result = await api(pathFor(
            `/tasks/${encodeURIComponent(taskId)}/plan${suffix}`));
          if (state.taskPlan.taskId !== taskId ||
              state.taskPlan.requestSerial !== requestSerial) return;
          state.taskPlan.data = result;
          state.taskPlan.edit = !result?.plan;
        } catch (error) {
          if (state.taskPlan.taskId !== taskId ||
              state.taskPlan.requestSerial !== requestSerial) return;
          state.taskPlan.data = null;
          state.taskPlan.error = error.message;
        } finally {
          if (state.taskPlan.taskId !== taskId ||
              state.taskPlan.requestSerial !== requestSerial) return;
          state.taskPlan.loading = false;
          render({ force: true });
        }
      }

      async function openTaskPlan(taskId, version = null) {
        const sameTask = state.taskPlan.taskId === taskId;
        if (!sameTask) {
          state.taskPlan = newTaskPlanState(taskId, {
            loading: true, selectedVersion: version
          });
        } else {
          const changedVersion = String(state.taskPlan.selectedVersion ?? "") !==
            String(version ?? "");
          state.taskPlan.selectedVersion = version;
          state.taskPlan.loading = true;
          state.taskPlan.edit = false;
          if (changedVersion) state.taskPlan.actionOffset = 0;
        }
        render({ force: true });
        await reloadTaskPlan({ showLoading: false });
      }

      async function navigateTaskPlanPage(kind, direction) {
        const selected = state.taskPlan;
        const page = taskPlanCollectionPage(selected.data || {}, kind);
        const offsetKey = `${kind}Offset`;
        selected[offsetKey] = Math.max(0,
          (Number(selected[offsetKey]) || 0) + Number(direction) * page.limit);
        await reloadTaskPlan({ showLoading: false });
      }

      function queueTaskPlanFilterRefresh(target, kind) {
        rememberControlFocus(target);
        const selected = state.taskPlan;
        selected[`${kind}Query`] = target.value;
        selected[`${kind}Offset`] = 0;
        selected.requestSerial = (Number(selected.requestSerial) || 0) + 1;
        state.loadSerial += 1;
        render({ force: true });
        clearTimeout(state.filterTimer);
        state.filterTimer = setTimeout(() => {
          state.filterTimer = null;
          reloadTaskPlan({ showLoading: false });
        }, FILTER_DEBOUNCE_MS);
      }

      async function mutate(label, operation) {
        busy(true);
        try {
          const result = await operation();
          toast(label);
          for (const warning of result?.warnings || []) toast(warning, "warning");
          await loadProjectData({ quiet: true });
          return result;
        } catch (error) {
          toast(error.message, "error");
          error.attaccaShown = true;
          throw error;
        } finally { busy(false); }
      }

      async function selectProject(projectId, roomConversation = "local") {
        clearTimeout(state.filterTimer);
        state.filterTimer = null;
        state.loadSerial += 1;
        invalidateStandaloneRequest("workspaces");
        invalidateStandaloneRequest("search");
        state.projectId = projectId;
        state.roomConversation = roomConversation;
        state.workspaceMembers = null;
        state.workspaceMembersError = "";
        resetProjectPages();
        resetFeed("room");
        resetFeed("activity");
        storageSet("attacca.admin.project", projectId);
        state.data = {};
        state.searchQuery = "";
        state.searchResults = null;
        state.handoffActor = "";
        state.roleScopeRole = "";
        state.taskPlan = newTaskPlanState();
        state.errors = {};
        render({ force: true });
        await loadProjectData();
      }

      document.addEventListener("click", async event => {
        const viewButton = event.target.closest("[data-view]");
        if (viewButton) {
          state.view = viewButton.dataset.view;
          history.replaceState(null, "", `#${state.view}`);
          render();
          content.focus({ preventScroll: true });
          return;
        }
        const button = event.target.closest("[data-action]");
        if (!button || button.disabled) return;
        const action = button.dataset.action;
        try {
          if (action === "list-previous") {
            await navigateList(button.dataset.listPage, -1);
          }
          if (action === "list-next") {
            await navigateList(button.dataset.listPage, 1);
          }
          if (action === "auth-logout") {
            await api("/v1/auth/logout", { method: "POST", body: {} });
            state.auth = null;
            state.credentialAccess = null;
            state.oneTimeCredential = null;
            state.authTokens = [];
            state.projects = [];
            state.workspaceAgents = {};
            state.workspaceAgentErrors = {};
            state.data = {};
            state.handoffActor = "";
            state.roleScopeRole = "";
            await bootstrap();
            toast("Signed out");
          }
          if (action === "revoke-auth-token") {
            if (!confirm("Revoke this legacy key? Any client still using it must complete a new terminal or service enrollment.")) return;
            await api(`/v1/auth/tokens/${encodeURIComponent(button.dataset.token)}`, { method: "DELETE", body: {} });
            state.authTokens = (await api("/v1/auth/tokens")).tokens || [];
            render({ force: true });
            toast("Legacy key revoked");
          }
          if (action === "copy-one-time-secret") {
            if (!state.oneTimeCredential?.secret) throw new Error("The one-time credential is no longer available.");
            await navigator.clipboard.writeText(state.oneTimeCredential.secret);
            toast(state.oneTimeCredential.kind === "invitation" ? "Invitation token copied" : "Credential copied");
          }
          if (action === "copy-one-time-link") {
            if (state.oneTimeCredential?.kind !== "invitation" || !state.oneTimeCredential.link) throw new Error("The one-time invitation link is no longer available.");
            await navigator.clipboard.writeText(state.oneTimeCredential.link);
            toast("Invitation acceptance link copied");
          }
          if (action === "dismiss-one-time-credential") {
            state.oneTimeCredential = null;
            render({ force: true });
          }
          if (action === "dismiss-invitation-acceptance") {
            state.pendingInvitationToken = "";
            state.invitationAcceptanceError = "";
            state.authMode = "sign-in";
            await bootstrap();
          }
          if (action === "show-account-registration") {
            if (state.auth?.self_registration !== "open") throw new Error("Account creation is closed on this server.");
            state.authMode = "register";
            renderAuth();
          }
          if (action === "dismiss-account-registration") {
            state.authMode = "sign-in";
            renderAuth();
          }
          if (action === "revoke-client-key") {
            if (state.credentialAccess?.capabilities?.client_keys !== true) throw new Error("Client API key management is unavailable on this server.");
            if (!button.dataset.key) throw new Error("The client API key has no identifier.");
            if (!confirm("Revoke this client-install API key? That installation will need a new key; its AI actors and audit history are unchanged.")) return;
            await api(`/v1/auth/client-keys/${encodeURIComponent(button.dataset.key)}`, { method: "DELETE", body: {} });
            await reloadCredentialAccess({ throwOnError: true });
            toast("Client API key revoked");
          }
          if (action === "delete-client-key") {
            if (state.credentialAccess?.capabilities?.client_keys !== true) throw new Error("Client API key management is unavailable on this server.");
            if (!button.dataset.key) throw new Error("The client API key has no identifier.");
            if (!confirm("Permanently delete this revoked client API key? Its credential and workspace bindings will be removed. Non-secret deletion audit evidence is retained.")) return;
            await api(`/v1/auth/client-keys/${encodeURIComponent(button.dataset.key)}/permanent`, { method: "DELETE", body: {} });
            await reloadCredentialAccess({ throwOnError: true });
            toast("Client API key permanently deleted");
          }
          if (action === "authorize-client-authorization" || action === "deny-client-authorization") {
            const authorizationRequest = state.clientAuthorization?.authorizationRequest || "";
            if (!authorizationRequest) throw new Error("The client authorization request changed; reopen it and review again.");
            const authorize = action === "authorize-client-authorization";
            if (!confirm(`${authorize ? "Authorize" : "Deny"} this client installation? Review its installation ID and workspace scope before continuing.`)) return;
            await api(`/v1/auth/client-authorizations/${authorize ? "authorize" : "deny"}`, { method: "POST", body: { authorization_request: authorizationRequest, ...(authorize ? { project_memberships: [] } : {}) } });
            await loadPendingClientAuthorization();
            await reloadCredentialAccess({ throwOnError: true });
            toast(`Client authorization ${authorize ? "approved" : "denied"}`);
          }
          if (action === "toggle-authentication") {
            const eligibility = activationEligibility(state.credentialAccess || emptyCredentialAccess(), state.auth?.user || {});
            if (!eligibility.allowed) throw new Error(eligibility.reasons[0] || "Only the server owner can change authentication enforcement.");
            const enabled = button.dataset.enabled === "true";
            const verb = enabled ? "enable" : "disable";
            if (!confirm(`${identityPart(verb)} authentication enforcement now? Existing client keys and AI identities are not changed.`)) return;
            await api("/v1/auth/activation", { method: "POST", body: { enabled, confirmed: true } });
            state.auth = await api("/v1/auth/status");
            await reloadCredentialAccess({ throwOnError: true });
            toast(`Authentication enforcement ${enabled ? "enabled" : "disabled"}`);
          }
          if (action === "select-project") await selectProject(button.dataset.project);
          if (action === "revoke-workspace-member") {
            const member = button.dataset.member;
            if (!confirm(`Remove @${member} from this workspace? Their clients lose access to it immediately.`)) return;
            await mutate("Account removed from the workspace", () => api(
              `${pathFor("/members")}/${encodeURIComponent(member)}`,
              { method: "DELETE", body: {} }));
          }
          if (action === "view-task-plan") await openTaskPlan(
            button.dataset.task,
            button.dataset.version ? Number(button.dataset.version) : null);
          if (action === "close-task-plan") {
            state.taskPlan = newTaskPlanState();
            render({ force: true });
          }
          if (action === "task-plan-page") {
            await navigateTaskPlanPage(
              button.dataset.taskPlanPage, Number(button.dataset.direction));
          }
          if (action === "edit-task-plan") {
            state.taskPlan.edit = true;
            render({ force: true });
          }
          if (action === "cancel-plan-edit") {
            state.taskPlan.edit = false;
            render({ force: true });
          }
          if (action === "submit-task-plan") {
            await mutate(`${button.dataset.task} plan submitted`, () => api(pathFor(`/tasks/${encodeURIComponent(button.dataset.task)}/plan/submit`), { method: "POST", body: { expected_version: Number(button.dataset.version) } }));
          }
          if (action === "approve-task-plan") {
            const target = button.dataset.section ? `section ${button.dataset.section}` : "the entire plan";
            const note = prompt(`Optional approval note for ${target}:`, "Reviewed and approved.");
            if (note === null) return;
            await mutate(`${button.dataset.task} plan approved`, () => api(pathFor(`/tasks/${encodeURIComponent(button.dataset.task)}/plan/review`), { method: "POST", body: { expected_version: Number(button.dataset.version), action: "approve", section_id: button.dataset.section || null, note: note.trim() || null } }));
          }
          if (action === "suggest-task-plan") {
            const target = button.dataset.section ? `section ${button.dataset.section}` : "the overall plan";
            const note = prompt(`Concrete edit suggestion for ${target}:`, "");
            if (note === null) return;
            if (!note.trim()) throw new Error("An edit suggestion needs a concrete note.");
            await mutate(`${button.dataset.task} edit suggested`, () => api(pathFor(`/tasks/${encodeURIComponent(button.dataset.task)}/plan/review`), { method: "POST", body: { expected_version: Number(button.dataset.version), action: "suggest_edit", section_id: button.dataset.section || null, note: note.trim() } }));
          }
          if (action === "comment-task-plan") {
            const target = button.dataset.section ? `section ${button.dataset.section}` : "the overall plan";
            const note = prompt(`Comment on ${target}:`, "");
            if (note === null) return;
            if (!note.trim()) throw new Error("A plan comment cannot be empty.");
            await mutate(`${button.dataset.task} plan comment added`, () => api(pathFor(`/tasks/${encodeURIComponent(button.dataset.task)}/plan/review`), { method: "POST", body: { expected_version: Number(button.dataset.version), action: "comment", section_id: button.dataset.section || null, note: note.trim() } }));
          }
          if (action === "claim-task") {
            const task = (state.data.tasks?.tasks || []).find(item => item.task_id === button.dataset.task);
            await mutate(`${button.dataset.task} claimed`, () => api(pathFor(`/tasks/${encodeURIComponent(button.dataset.task)}/claim`), { method: "POST", body: { expected_scope: task?.expected_scope || [], lease_minutes: 60 } }));
          }
          if (action === "release-task") {
            const reason = prompt("Why are you releasing this task?", "Returning it to the shared queue.");
            if (reason === null) return;
            await mutate(`${button.dataset.task} released`, () => api(pathFor(`/tasks/${encodeURIComponent(button.dataset.task)}/release`), { method: "POST", body: { reason } }));
          }
          if (action === "resolve-decision") {
            const rationale = prompt(`Rationale for marking ${button.dataset.decision} ${button.dataset.resolution}:`, "");
            if (rationale === null) return;
            await mutate(`${button.dataset.decision} ${button.dataset.resolution}`, () => api(pathFor(`/decisions/${encodeURIComponent(button.dataset.decision)}/resolve`), { method: "POST", body: { resolution: button.dataset.resolution, rationale } }));
          }
          if (action === "verify-ledger") {
            state.data.verify = await mutate("Ledger verified", () => api(pathFor("/verify")));
            render();
          }
          if (action === "mark-inbox-read") {
            await mutate("Inbox marked read", markInboxReadAll);
          }
          if (action === "download-export") {
            const originalLabel = button.textContent;
            button.disabled = true;
            button.textContent = "Preparing…";
            busy(true);
            try {
              const filename = await downloadProjectExport(button.dataset.format);
              toast(`${filename} downloaded`);
            } finally {
              busy(false);
              button.disabled = false;
              button.textContent = originalLabel;
            }
          }
          if (action === "remove-bridge") {
            if (!confirm(`Delete the workspace relationship with ${button.dataset.project}? This disconnects the inter-project room entirely. To change who can participate while keeping the relationship, Cancel and use Save participation.`)) return;
            await mutate(`Relationship with ${button.dataset.project} deleted`, () => api(pathFor(`/bridges/${encodeURIComponent(button.dataset.project)}`), { method: "DELETE" }));
          }
          if (action === "open-connected-room") {
            state.roomConversation = button.dataset.project;
            resetFeed("room");
            delete state.data.room;
            state.view = "room";
            history.replaceState(null, "", "#room");
            render({ force: true, feedTransition: "room" });
            await loadProjectData({ quiet: true, feedTransition: "room" });
            content.focus({ preventScroll: true });
          }
          if (action === "swap-room-workspace") {
            await selectProject(button.dataset.project,
                                button.dataset.conversation || "local");
          }
          if (action === "review-room-feed") {
            $("#room-conversation-feed")?.scrollIntoView({ behavior: "smooth", block: "start" });
          }
          if (action === "room-older") navigateFeed("room", -1);
          if (action === "room-newer") navigateFeed("room", 1);
          if (action === "room-newest") navigateFeed("room", "newest");
          if (action === "activity-older") navigateFeed("activity", -1);
          if (action === "activity-newer") navigateFeed("activity", 1);
          if (action === "activity-newest") navigateFeed("activity", "newest");
          if (action === "toggle-rule") {
            const enabled = button.dataset.enabled !== "true";
            await mutate(`${button.dataset.rule} ${enabled ? "enabled" : "disabled"}`, () => api(pathFor(`/rules/${encodeURIComponent(button.dataset.rule)}`), { method: "PUT", body: { enabled, expected_version: Number(button.dataset.version) } }));
          }
        } catch (error) {
          if (!error.attaccaShown) toast(error.message, "error");
        }
      });

      document.addEventListener("change", async event => {
        try {
          if (event.target.id === "project-select" && event.target.value) await selectProject(event.target.value);
          if (event.target.id === "room-workspace" && event.target.value) {
            const previousSource = state.projectId;
            const nextSource = event.target.value;
            const nextConversation = state.roomConversation !== "local" && state.roomConversation === nextSource
              ? previousSource
              : "local";
            await selectProject(nextSource, nextConversation);
          }
          if (event.target.id === "room-conversation") {
            state.roomConversation = event.target.value;
            resetFeed("room");
            delete state.data.room;
            render({ force: true, feedTransition: "room" });
            await loadProjectData({ quiet: true });
          }
          if (event.target.id === "handoff-identity" && event.target.value) {
            state.loadSerial += 1;
            state.handoffActor = event.target.value;
            resetListPage("handoff");
            delete state.data.identityHandoff;
            delete state.data.identityHandoffHistory;
            delete state.errors.identityHandoff;
            delete state.errors.identityHandoffHistory;
            render({ force: true });
            await loadProjectData({ quiet: true });
          }
          if (event.target.id === "role-scope-role" && event.target.value) {
            state.loadSerial += 1;
            state.roleScopeRole = event.target.value;
            resetListPage("roleScopeHistory");
            delete state.data.roleScopeHistory;
            delete state.errors.roleScopeHistory;
            render({ force: true });
            await loadProjectData({ quiet: true });
          }
          if (event.target.id === "bridge-project") {
            const form = event.target.closest("form");
            const peerAgents = form?.querySelector('[name="peer_selected_agents"]');
            if (peerAgents) {
              peerAgents.dataset.bridgeAgentWorkspace = event.target.value;
              peerAgents.innerHTML = bridgeAgentOptions(event.target.value, []);
            }
          }
          if (event.target.matches("[data-participation-select]")) {
            const form = event.target.closest("form");
            const side = event.target.dataset.participationSide;
            const field = form?.querySelector(`[data-selected-agents-side="${side}"]`);
            const input = field?.querySelector("[data-bridge-agent-select]");
            const selectedAgents = event.target.value === "selected_agents";
            if (field) field.hidden = !selectedAgents;
            if (input) {
              input.disabled = !selectedAgents;
              input.required = selectedAgents;
              if (selectedAgents) input.focus();
            }
          }
          if (event.target.matches("[data-agent-pick]")) {
            const form = event.target.closest("form");
            const isNew = event.target.value === "__new__";
            form.querySelectorAll("[data-new-actor]").forEach(el => { el.hidden = !isNew; });
            const runtimeInput = form.querySelector('[name="runtime"]');
            if (runtimeInput) {
              runtimeInput.required = isNew;
              if (isNew) runtimeInput.focus();
            }
            if (isNew) {
              const nameInput = form.querySelector('[name="display_name"]');
              if (nameInput) nameInput.value = "";
            }
            if (!isNew) {
              const agent = (state.data.agentOptions?.agents ||
                state.data.agents?.agents || []).find(a => a.agent_id === event.target.value);
              if (agent) {
                const roleSel = form.querySelector('[name="role"]');
                if (roleSel && agent.role) roleSel.value = agent.role;
                const nameInput = form.querySelector('[name="display_name"]');
                if (nameInput) nameInput.value = agent.display_name || "";
              }
            }
          }
          if (event.target.id === "task-filter") {
            state.taskFilter = event.target.value;
            invalidatePagedView("tasks");
            render({ force: true });
            await refreshPagedView("tasks");
          }
          if (event.target.id === "decision-filter") {
            state.decisionFilter = event.target.value;
            invalidatePagedView("decisions");
            render({ force: true });
            await refreshPagedView("decisions");
          }
          if (event.target.matches("[data-list-sort]")) {
            const view = event.target.dataset.listSort;
            state.listSort[view] = event.target.value;
            storageSet("attacca.admin.sorts", JSON.stringify(state.listSort));
            invalidatePagedView(view);
            render({ force: true });
            await refreshPagedView(view);
          }
          if (event.target.id === "task-plan-revision-filter") {
            state.taskPlan.revisionFilter = event.target.value;
            state.taskPlan.revisionOffset = 0;
            await reloadTaskPlan({ showLoading: false });
          }
          if (event.target.id === "task-plan-action-filter") {
            state.taskPlan.actionFilter = event.target.value;
            state.taskPlan.actionOffset = 0;
            await reloadTaskPlan({ showLoading: false });
          }
          if (event.target.matches("[data-task-plan-sort]")) {
            const kind = event.target.dataset.taskPlanSort;
            state.taskPlan[`${kind}Sort`] = event.target.value;
            state.taskPlan[`${kind}Offset`] = 0;
            await reloadTaskPlan({ showLoading: false });
          }
          if (event.target.matches("[data-plan-version]") && event.target.value) {
            await openTaskPlan(
              event.target.dataset.planVersion,
              Number(event.target.value));
          }
          if (event.target.matches("[data-status-select]") && event.target.value) {
            const taskId = event.target.dataset.statusSelect;
            const status = event.target.value;
            const reason = prompt(`Reason for setting ${taskId} to ${status}:`, "Updated in the web panel.");
            if (reason === null) { event.target.value = ""; return; }
            try { await mutate(`${taskId} moved to ${status}`, () => api(pathFor(`/tasks/${encodeURIComponent(taskId)}/status`), { method: "POST", body: { status, reason } })); }
            catch (_) { event.target.value = ""; }
          }
        } catch (error) {
          busy(false);
          toast(error.message, "error");
        }
      });

      document.addEventListener("input", event => {
        if (event.target.id === "task-plan-revision-search") {
          queueTaskPlanFilterRefresh(event.target, "revision");
          return;
        }
        if (event.target.id === "task-plan-action-search") {
          queueTaskPlanFilterRefresh(event.target, "action");
          return;
        }
        if (event.target.id === "bulk-dispose-before") {
          state.bulkDisposeBefore = event.target.value;
          updateBulkDisposePreview();
          return;
        }
        const filters = {
          "workspace-search": ["workspaceSearch", "workspaces", false],
          "task-search": ["taskSearch", "tasks", false],
          "room-search": ["roomFilter", "room", true],
          "activity-search": ["activityFilter", "activity", true],
          "rule-search": ["ruleFilter", "rules", false],
          "decision-search": ["decisionSearch", "decisions", false],
          "agent-search": ["agentSearch", "agents", false],
          "bridge-search": ["bridgeSearch", "bridges", false],
          "shared-handoff-search": ["sharedHandoffSearch", "sharedHandoff", false],
          "handoff-search": ["handoffSearch", "handoff", false],
          "role-scope-history-search": ["roleScopeHistorySearch", "roleScopeHistory", false],
          "log-search": ["logSearch", "log", false],
          "client-key-search": ["clientKeySearch", "clientKeys", false]
        };
        const config = filters[event.target.id];
        if (!config) return;
        const [stateKey, view, feed] = config;
        state[stateKey] = event.target.value;
        queueFilterRefresh(event.target, view, { feed });
      });

      document.addEventListener("scroll", event => {
        const feed = event.target?.id === "room-feed" ? event.target
          : event.target?.id === "activity-feed" ? event.target : null;
        if (!feed) return;
        const kind = feed.id === "room-feed" ? "room" : "activity";
        const nearNewest = feedNearNewest(kind, feed);
        state[`${kind}Feed`].followNewest = nearNewest;
        if (nearNewest && state[`${kind}Feed`].newCount) {
          state[`${kind}Feed`].newCount = 0;
          const indicator = $(`[data-action="${kind}-newest"]`);
          if (indicator) indicator.hidden = true;
        }
      }, true);

      document.addEventListener("submit", async event => {
        const form = event.target.closest("form[data-form]");
        if (!form) return;
        event.preventDefault();
        const formData = new FormData(form);
        const values = Object.fromEntries(formData);
        const kind = form.dataset.form;
        const submit = form.querySelector("button[type=submit]");
        if (submit) submit.disabled = true;
        try {
          if (kind === "auth-bootstrap") {
            state.auth = await api("/v1/auth/bootstrap", { method: "POST", body: { username: values.username.trim(), password: values.password } });
            form.reset();
            await bootstrap();
            toast("Administrator created; authentication enforcement remains off");
          }
          if (kind === "auth-login") {
            state.auth = await api("/v1/auth/login", { method: "POST", body: { username: values.username.trim(), password: values.password } });
            state.invitationAcceptanceError = "";
            state.authMode = "sign-in";
            form.reset();
            await bootstrap();
            toast("Signed in");
          }
          if (kind === "auth-register") {
            if (values.password !== values.confirm_password) throw new Error("The two passwords do not match.");
            state.auth = await api("/v1/auth/register", { method: "POST", body: { username: values.username.trim(), password: values.password } });
            state.authMode = "sign-in";
            form.reset();
            await bootstrap();
            toast("Account created; ask an administrator for workspace access");
          }
          if (kind === "accept-human-invitation") {
            const invitationToken = state.pendingInvitationToken;
            if (!invitationToken) throw new Error("The one-time invitation token is no longer available.");
            const username = values.username.trim();
            const password = values.password;
            try {
              const accepted = await api("/v1/auth/invitations/accept", { method: "POST", body: {
                invitation_token: invitationToken,
                username, password
              } });
              if (accepted.accepted !== true || accepted.login_required !== true || accepted.login_endpoint !== "/v1/auth/login") {
                throw new Error("The server did not return the expected invitation login handoff.");
              }
              state.pendingInvitationToken = "";
              state.invitationAcceptanceError = "";
              state.auth = await api(accepted.login_endpoint, { method: "POST", body: { username, password } });
              form.reset();
              await bootstrap();
              toast("Invitation accepted; signed in as your own human account");
            } catch (error) {
              state.invitationAcceptanceError = error.message || String(error);
              renderAuth();
              throw error;
            }
          }
          if (kind === "save-panel-behavior") {
            state.prefs = { ...state.prefs, autoRefresh: values.autoRefresh === "true", refreshSeconds: Math.max(5, Math.min(300, Number(values.refreshSeconds) || 15)) };
            savePrefs();
            render({ force: true });
            toast("Browser settings saved");
          }
          if (kind === "create-workspace") {
            const body = { name: values.name };
            if (values.project_id) body.project_id = values.project_id;
            if (values.repository_fingerprint) body.repository_fingerprint = values.repository_fingerprint;
            busy(true);
            const result = await api("/v1/projects", { method: "POST", body });
            await loadProjects();
            toast(result.already_existed ? "Workspace already existed; opened it" : "Workspace created");
            await selectProject(result.project_id);
            form.reset();
          }
          if (kind === "add-workspace-member") {
            await mutate("Account added to the workspace", () => api(
              pathFor("/members"),
              { method: "POST", body: { username: String(values.username || "").trim() } }));
            form.reset();
          }
          if (kind === "create-task") {
            await mutate("Task created", () => api(pathFor("/tasks"), { method: "POST", body: { title: values.title, description: values.description || null, expected_scope: list(values.expected_scope), dependencies: list(values.dependencies), risk_level: values.risk_level, plan_required: values.plan_required === "true" } }));
            form.reset();
          }
          if (kind === "set-task-plan") {
            const body = {
              title: values.title,
              overview: values.overview || "",
              sections: parsePlanSectionsMarkdown(values.sections_markdown),
              submit_for_review: values.submit_for_review === "true"
            };
            if (values.expected_version !== undefined && values.expected_version !== "") body.expected_version = Number(values.expected_version);
            state.taskPlan.selectedVersion = null;
            state.taskPlan.revisionOffset = 0;
            state.taskPlan.actionOffset = 0;
            await mutate(`${form.dataset.task} plan saved`, () => api(pathFor(`/tasks/${encodeURIComponent(form.dataset.task)}/plan`), { method: "PUT", body }));
            state.taskPlan.edit = false;
            render({ force: true });
          }
          if (kind === "report-task") {
            let evidence = [];
            if (values.evidence.trim()) {
              evidence = JSON.parse(values.evidence);
              if (!Array.isArray(evidence) || !evidence.every(item => item && typeof item === "object" && !Array.isArray(item))) throw new Error("Evidence must be a JSON array of objects.");
            }
            await mutate(`${form.dataset.task} reported`, () => api(pathFor(`/tasks/${encodeURIComponent(form.dataset.task)}/report`), { method: "POST", body: { summary: values.summary, requested_state: values.requested_state, evidence } }));
          }
          if (kind === "send-room") {
            const body = { body: values.body, msg_type: values.msg_type };
            if (values.task_id) body.task_id = values.task_id;
            if (values.mentions) body.mentions = list(values.mentions);
            if (values.reply_to) body.reply_to = values.reply_to;
            body.target_project = values.target_project || state.projectId;
            await mutate("Message sent", () => api(pathFor("/room"), { method: "POST", body }));
            form.reset();
          }
          if (kind === "bulk-dispose") {
            const before = Number(values.before_seq);
            if (!Number.isFinite(before) || before < 1) throw new Error("Enter the event number to resolve through.");
            const note = String(values.note || "").trim();
            if (!note) throw new Error("A bulk resolution requires a note explaining it.");
            const matched = bulkDisposeMatchCount(before);
            if (!confirm(`Resolve ${matched} pending message${matched === 1 ? "" : "s"} at or below #${before} as ${dispositionLabel(values.disposition)}? One disposition is written per message, the ledger records a single bulk event, and your reconciliation baseline moves to #${before}.`)) return;
            const outcome = await mutate("Pending assignments resolved", () => api(pathFor("/messages/dispose-bulk"), { method: "POST", body: { disposition: values.disposition, note, filter: { before_seq: before } } }));
            state.bulkDisposeBefore = "";
            form.reset();
            if (outcome) toast(`${outcome.disposed_count} resolved · ${outcome.remaining_pending} still pending`);
          }
          if (kind === "propose-decision") {
            await mutate("Decision proposed", () => api(pathFor("/decisions"), { method: "POST", body: { title: values.title, detail: values.detail || null, rationale: values.rationale || null } }));
            form.reset();
          }
          if (kind === "create-rule") {
            await mutate("Project rule created", () => api(pathFor("/rules"), { method: "POST", body: { title: values.title, body: values.body, scope: values.scope, priority: Number(values.priority) } }));
            form.reset();
          }
          if (kind === "update-rule") {
            await mutate(`${form.dataset.rule} updated`, () => api(pathFor(`/rules/${encodeURIComponent(form.dataset.rule)}`), { method: "PUT", body: { title: values.title, body: values.body, scope: values.scope, priority: Number(values.priority), expected_version: Number(values.expected_version) } }));
          }
          if (kind === "save-cloud-context") {
            await mutate("Cloud context saved", () => api(pathFor("/cloud-context"), { method: "PUT", body: { content: values.content || "", expected_version: Number(values.expected_version) } }));
          }
          if (kind === "update-shared-handoff") {
            if (!canManageSharedHandoff()) {
              throw new Error("The shared project handoff may only be updated by a registered AI Director.");
            }
            const body = {
              expected_context_version: state.data.sharedHandoff?.context_version,
              expected_handoff_version: Number(values.expected_handoff_version || 0)
            };
            HANDOFF_FIELDS.forEach(field => { body[field] = values[field] || ""; });
            await mutate("Shared project handoff updated", () => api(
              pathFor("/handoff"), { method: "PUT", body }));
          }
          if (kind === "update-identity-handoff") {
            if (selectedHandoffActor() !== state.prefs.actor) {
              throw new Error("An identity handoff can only be updated by that exact registered AI.");
            }
            const body = {
              expected_context_version: state.data.identityHandoff?.context_version,
              expected_handoff_version: Number(values.expected_handoff_version || 0)
            };
            HANDOFF_FIELDS.forEach(field => { body[field] = values[field] || ""; });
            await mutate("AI identity handoff updated", () => api(
              pathFor(`/identity-handoff?actor=${encodeURIComponent(selectedHandoffActor())}`),
              { method: "PUT", body }));
          }
          if (kind === "save-role-scope") {
            if (!canManageRoleScopes()) {
              throw new Error("Role scopes may only be edited by a human or registered Director.");
            }
            const role = String(form.dataset.role || "");
            if (!ROLE_SCOPE_NAMES.includes(role)) throw new Error("Choose a valid role scope.");
            await mutate(`${roleScopeLabel(role)} role scope saved`, () => api(
              pathFor(`/role-scopes/${encodeURIComponent(role)}`), {
                method: "PUT",
                body: {
                  content: values.content ?? "",
                  expected_version: Number(values.expected_version || 0)
                }
              }));
          }
          if (kind === "search-project") {
            state.searchQuery = values.query.trim();
            invalidatePagedView("search");
            render({ force: true });
            const result = await loadProjectSearch({ throwOnError: true });
            if (result) toast(`${result.total ?? result.total_hits ?? 0} project-memory matches`);
          }
          if (kind === "append-event") {
            let payload;
            try { payload = JSON.parse(values.payload); }
            catch (_) { throw new Error("Payload must be valid JSON."); }
            if (!payload || Array.isArray(payload) || typeof payload !== "object") throw new Error("Payload must be a JSON object.");
            await mutate("Event appended", () => api(pathFor("/events"), { method: "POST", body: { event_type: values.event_type, payload, task_id: values.task_id || null } }));
            form.reset();
          }
          if (kind === "save-runtime") {
            state.serverSettings = await api("/v1/settings", { method: "PUT", body: { default_project: values.default_project || null, verbose: values.verbose === "true", update_interval_seconds: Number(values.update_interval_seconds) } });
            toast("Server runtime settings applied");
            render();
          }
          if (kind === "set-lead") {
            await mutate("Lead director updated", () => api(pathFor("/lead"), { method: "PUT", body: { agent_id: values.agent_id || null } }));
          }
          if (kind === "add-bridge") {
            const body = {
              other_project: values.other_project,
              participation: values.participation,
              selected_agents: values.participation === "selected_agents" ? formData.getAll("selected_agents").map(String).filter(Boolean) : [],
              peer_participation: values.peer_participation,
              peer_selected_agents: values.peer_participation === "selected_agents" ? formData.getAll("peer_selected_agents").map(String).filter(Boolean) : []
            };
            const principal = values.principal_side === "other" ? values.other_project : state.projectId;
            if (values.relation === "master") body.boss = principal;
            if (values.relation === "advisor") body.advisor = principal;
            await mutate(`Bridge to ${values.other_project} created`, () => api(pathFor("/bridges"), { method: "POST", body }));
          }
          if (kind === "update-bridge-participation") {
            const body = {
              participation: values.participation,
              selected_agents: values.participation === "selected_agents" ? formData.getAll("selected_agents").map(String).filter(Boolean) : [],
              peer_participation: values.peer_participation,
              peer_selected_agents: values.peer_participation === "selected_agents" ? formData.getAll("peer_selected_agents").map(String).filter(Boolean) : []
            };
            await mutate(`Participation for ${form.dataset.project} updated`, () => api(pathFor(`/bridges/${encodeURIComponent(form.dataset.project)}`), { method: "PUT", body }));
          }
          if (kind === "register-agent") {
            const createGenerated = values.agent_id === "__new__";
            if (!createGenerated && !values.agent_id) throw new Error("Choose an existing AI identity or create a generated one.");
            if (createGenerated && !String(values.runtime || "").trim()) throw new Error("Choose the runtime for the generated identity.");
            const body = createGenerated
              ? { identity_mode: "new", display_name: values.display_name || null, role: values.role || null, runtime: String(values.runtime || "").trim() }
              : { agent_id: values.agent_id, display_name: values.display_name || null, role: values.role || null };
            await mutate(createGenerated ? "Generated AI identity reserved" : "AI role saved", () => api(pathFor("/agents"), { method: "POST", body }));
            form.reset();
          }
        } catch (error) {
          toast(error.message, "error");
        } finally {
          busy(false);
          if (submit) submit.disabled = false;
        }
      });

      $("#refresh-button").addEventListener("click", async () => {
        try {
          busy(true);
          await bootstrap();
          toast("Control room refreshed");
        } catch (error) { toast(error.message, "error"); }
        finally { busy(false); }
      });

      window.addEventListener("hashchange", async () => {
        state.clientAuthorization = clientAuthorizationHintsFromLocation();
        const invitationToken = consumeInvitationTokenFromLocation();
        if (invitationToken) {
          state.pendingInvitationToken = invitationToken;
          state.invitationAcceptanceError = "";
          state.view = "settings";
          renderAuth();
          return;
        }
        const view = viewFromLocationHash();
        if (VIEWS.includes(view)) {
          state.view = view;
          render();
          await loadPendingClientAuthorization();
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && state.prefs.autoRefresh && state.projectId) loadProjectData({ quiet: true });
      });

      bootstrap().catch(error => {
        state.loading = false;
        try { busy(false); } catch (_) { /* the failure boundary must render */ }
        try { updateChrome(); } catch (_) { /* retain the primary error */ }
        content.innerHTML = `<div class="page-head"><div><div class="eyebrow">Control room error</div><h1>Attacca could not finish loading</h1><p>The server responded, but the browser stopped while starting the panel.</p></div></div><div class="notice error"><span>!</span><div><strong>${h(error?.message || error || "Unknown browser error")}</strong><br>Hard-refresh this page. If it repeats, copy this exact message so the failing browser feature can be identified.</div></div>`;
      });
    })();
  </script>
</body>
</html>
