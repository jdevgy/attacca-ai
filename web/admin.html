            feed.scrollTop = kind === "room" ? feed.scrollHeight : 0;
            return;
          }
          const anchor = [...feed.querySelectorAll("[data-feed-key]")]
            .find(row => row.dataset.feedKey === snapshot.anchorKey);
          if (anchor) {
            const offsetDelta = anchor.getBoundingClientRect().top - feed.getBoundingClientRect().top - snapshot.anchorOffset;
            feed.scrollTop += offsetDelta;
          } else feed.scrollTop = snapshot.scrollTop;
        });
      }

      function resetFeed(kind) {
        state[`${kind}Feed`] = newFeedState();
      }

      function navigateFeed(kind, direction) {
        const feed = state[`${kind}Feed`];
        if (direction === "newest") feed.offset = 0;
        else if (direction < 0) feed.offset = Math.min(
          Math.max(0, feed.total - 1), feed.offset + PANEL_PAGE_SIZE);
        else feed.offset = Math.max(0, feed.offset - PANEL_PAGE_SIZE);
        feed.followNewest = feed.offset === 0;
        if (feed.followNewest) feed.newCount = 0;
        loadProjectData({ quiet: true, feedTransition: kind });
      }

      function rememberControlFocus(target) {
        state.restoreFocus = target?.id ? {
          id: target.id,
          start: Number.isFinite(target.selectionStart) ? target.selectionStart : null,
          end: Number.isFinite(target.selectionEnd) ? target.selectionEnd : null
        } : null;
      }

      function restoreControlFocus() {
        const snapshot = state.restoreFocus;
        state.restoreFocus = null;
        if (!snapshot) return;
        requestAnimationFrame(() => {
          const target = document.getElementById(snapshot.id);
          if (!target) return;
          target.focus({ preventScroll: true });
          if (snapshot.start != null && typeof target.setSelectionRange === "function") {
            target.setSelectionRange(snapshot.start, snapshot.end ?? snapshot.start);
          }
        });
      }

      function beginStandaloneRequest(view) {
        state.requestSerials[view] = (Number(state.requestSerials[view]) || 0) + 1;
        return state.requestSerials[view];
      }

      function invalidateStandaloneRequest(view) {
        if (Object.prototype.hasOwnProperty.call(state.requestSerials, view)) {
          beginStandaloneRequest(view);
        }
      }

      function standaloneRequestIsCurrent(view, serial) {
        return Number(state.requestSerials[view]) === Number(serial);
      }

      function clearPagedViewData(view) {
        const dataKey = {
          workspaces: "projectPage", tasks: "tasks", decisions: "decisions",
          rules: "rules", agents: "agents", bridges: "bridges",
          sharedHandoff: "sharedHandoffHistory",
          handoff: "identityHandoffHistory", roleScopeHistory: "roleScopeHistory",
          log: "log", room: "room",
          activity: "events"
        }[view];
        if (dataKey) {
          if (view === "workspaces") {
            state.data.projectPage = {
              projects: [], total: 0, unfiltered_total: 0,
              limit: PANEL_PAGE_SIZE, offset: 0, has_more: false
            };
          } else delete state.data[dataKey];
          delete state.errors[dataKey];
        }
        if (view === "search") {
          state.searchResults = null;
          delete state.errors.search;
        }
        if (view === "clientKeys") {
          const access = state.credentialAccess || emptyCredentialAccess();
          state.credentialAccess = {
            ...access,
            client_keys: [], total: 0, unfiltered_total: 0,
            limit: PANEL_PAGE_SIZE, offset: 0, has_more: false
          };
          delete state.errors.clientKeys;
        }
      }

      function invalidatePagedView(view, { feed = false } = {}) {
        const usesMainLoader = view !== "clientKeys" && view !== "search" &&
          !(view === "workspaces" && !state.projectId);
        if (usesMainLoader) state.loadSerial += 1;
        invalidateStandaloneRequest(view);
        if (feed) resetFeed(view);
        else resetListPage(view);
        clearPagedViewData(view);
      }

      async function loadProjectPage({ quiet = true } = {}) {
        const requestSerial = beginStandaloneRequest("workspaces");
        if (!quiet) busy(true);
        try {
          const result = await api(
            `/v1/projects${listQuery("workspaces", { q: state.workspaceSearch })}`);
          if (!standaloneRequestIsCurrent("workspaces", requestSerial)) return null;
          state.data.projectPage = result;
          delete state.errors.projectPage;
          return result;
        } catch (error) {
          if (!standaloneRequestIsCurrent("workspaces", requestSerial)) return null;
          delete state.data.projectPage;
          state.errors.projectPage = error.message || String(error);
          return null;
        } finally {
          if (!quiet) busy(false);
          if (standaloneRequestIsCurrent("workspaces", requestSerial)) render({ force: true });
        }
      }

      async function loadProjectSearch({ quiet = true, throwOnError = false } = {}) {
        const requestSerial = beginStandaloneRequest("search");
        const projectAtStart = state.projectId;
        const queryAtStart = state.searchQuery;
        if (!state.projectId || !state.searchQuery) {
          state.searchResults = null;
          render({ force: true });
          return null;
        }
        if (!quiet) busy(true);
        try {
          const result = await api(pathFor(
            `/search${listQuery("search", { q: state.searchQuery })}`));
          if (!standaloneRequestIsCurrent("search", requestSerial) ||
              projectAtStart !== state.projectId || queryAtStart !== state.searchQuery) return null;
          state.searchResults = result;
          delete state.errors.search;
          return result;
        } catch (error) {
          if (!standaloneRequestIsCurrent("search", requestSerial) ||
              projectAtStart !== state.projectId || queryAtStart !== state.searchQuery) return null;
          state.searchResults = null;
          state.errors.search = error.message || String(error);
          if (throwOnError) throw error;
          return null;
        } finally {
          if (!quiet) busy(false);
          if (standaloneRequestIsCurrent("search", requestSerial) &&
              projectAtStart === state.projectId && queryAtStart === state.searchQuery) {
            render({ force: true });
          }
        }
      }

      async function reloadCredentialAccess({ quiet = true, throwOnError = false } = {}) {
        const requestSerial = beginStandaloneRequest("clientKeys");
        if (!quiet) busy(true);
        try {
          const result = await loadCredentialAccess();
          if (!standaloneRequestIsCurrent("clientKeys", requestSerial)) return null;
          state.credentialAccess = result;
          delete state.errors.clientKeys;
          return result;
        } catch (error) {
          if (!standaloneRequestIsCurrent("clientKeys", requestSerial)) return null;
          state.credentialAccess = emptyCredentialAccess();
          state.errors.clientKeys = error.message || String(error);
          if (throwOnError) throw error;
          return null;
        } finally {
          if (!quiet) busy(false);
          if (standaloneRequestIsCurrent("clientKeys", requestSerial)) render({ force: true });
        }
      }

      async function markInboxReadAll() {
        let page = null;
        for (let batch = 0; batch < 1000; batch += 1) {
          page = await api(pathFor(
            `/inbox?mark_read=1&limit=${PANEL_PAGE_SIZE}&detail=full`));
          if (!page?.may_have_more) return page;
        }
        throw new Error("Inbox kept growing while it was being marked read; try again.");
      }

      async function refreshPagedView(view, { feedTransition = null } = {}) {
        if (view === "clientKeys") return reloadCredentialAccess();
        if (view === "search") return loadProjectSearch();
        if (view === "workspaces" && !state.projectId) return loadProjectPage();
        return loadProjectData({ quiet: true, feedTransition });
      }

      function navigateList(view, direction) {
        const page = listPage(view);
        page.offset = Math.max(0, page.offset + direction * PANEL_PAGE_SIZE);
        return refreshPagedView(view);
      }

      function queueFilterRefresh(target, view, { feed = false } = {}) {
        rememberControlFocus(target);
        invalidatePagedView(view, { feed });
        render({ force: true, feedTransition: feed ? view : null });
        clearTimeout(state.filterTimer);
        state.filterTimer = setTimeout(() => {
          state.filterTimer = null;
          refreshPagedView(view, { feedTransition: feed ? view : null });
        }, FILTER_DEBOUNCE_MS);
      }

      async function loadProjectData({ quiet = false, feedTransition = null } = {}) {
        if (!state.projectId) return;
        const projectAtStart = state.projectId;
        const loadSerial = ++state.loadSerial;
        const requestIsCurrent = () => loadSerial === state.loadSerial && projectAtStart === state.projectId;
        if (!quiet) busy(true);
        try {
          const handoffActor = selectedHandoffActor();
          const roleScope = selectedRoleScope();
          const roleScopeManager = canManageRoleScopes();
          const endpoints = {
            projectPage: `/v1/projects${listQuery("workspaces", { q: state.workspaceSearch })}`,
            sharedHandoff: pathFor("/handoff") + "?detail=full",
            sharedHandoffHistory: pathFor(`/handoff/history${listQuery("sharedHandoff", {
              q: state.sharedHandoffSearch
            })}`),
            overviewHandoff: pathFor("/handoff") + "?detail=full",
            roleScopes: pathFor(`/role-scopes${roleScopeManager ? "?include_all=1" : ""}`),
            status: pathFor("/status"),
            bridges: pathFor(`/bridges${listQuery("bridges", { q: state.bridgeSearch })}`),
            bridgeOptions: pathFor("/bridges?options=1"),
            tasks: pathFor(`/tasks${listQuery("tasks", { q: state.taskSearch, status: state.taskFilter, detail: "full" })}`),
            inbox: pathFor(`/inbox?mark_read=0&limit=${PANEL_PAGE_SIZE}&detail=full`),
            room: pathFor(`/room/history${feedQuery("room", {
              conversation: state.roomConversation, q: state.roomFilter,
              detail: "full"
            })}`),
            decisions: pathFor(`/decisions${listQuery("decisions", {
              q: state.decisionSearch, status: state.decisionFilter
            })}`),
            cloudContext: pathFor("/cloud-context"),
            events: pathFor(`/activity${feedQuery("activity", { q: state.activityFilter })}`),
            agents: pathFor(`/agents${listQuery("agents", { q: state.agentSearch })}`),
            members: pathFor("/members"),
            agentOptions: pathFor("/agents?options=1"),
            log: pathFor(`/log${listQuery("log", { q: state.logSearch })}`),
            overviewTasks: pathFor(`/tasks?limit=7&offset=0&sort=newest&status=active&detail=full`),
            overviewDecisions: pathFor(`/decisions?limit=1&offset=0&sort=newest`),
            overviewAgents: pathFor(`/agents?limit=7&offset=0&sort=newest`),
            overviewLog: pathFor(`/log?limit=7&offset=0&sort=newest`),
            rules: pathFor(`/rules${listQuery("rules", {
              q: state.ruleFilter,
              include_all: canManageProjectRules() ? 1 : undefined,
              include_disabled: canManageProjectRules() ? 1 : undefined
            })}`),
            verify: pathFor("/verify")
          };
          if (handoffActor) {
            endpoints.identityHandoff = pathFor(
              `/identity-handoff?actor=${encodeURIComponent(handoffActor)}`);
            endpoints.identityHandoffHistory = pathFor(
              `/identity-handoff/history${listQuery("handoff", {
                q: state.handoffSearch, actor: handoffActor
              })}`);
          }
          if (roleScopeManager || ROLE_SCOPE_NAMES.includes(panelAgentRecord()?.role)) {
            endpoints.roleScopeHistory = pathFor(
              `/role-scopes/${encodeURIComponent(roleScope)}/history${listQuery("roleScopeHistory", {
                q: state.roleScopeHistorySearch
              })}`);
          }
          if (state.taskPlan.taskId) {
            const suffix = taskPlanRequestSuffix(state.taskPlan);
            endpoints.selectedPlan = pathFor(`/tasks/${encodeURIComponent(state.taskPlan.taskId)}/plan${suffix}`);
          }
          const entries = Object.entries(endpoints);
          const results = await Promise.allSettled(entries.map(([, endpoint]) => api(endpoint)));
          if (!requestIsCurrent()) return;
          entries.forEach(([key]) => { delete state.errors[key]; });
          delete state.errors.freshness;
          delete state.errors.projectOptions;
          results.forEach((result, index) => {
            const key = entries[index][0];
            if (key === "selectedPlan") {
              state.taskPlan.loading = false;
              if (result.status === "fulfilled") {
                state.taskPlan.data = result.value;
                state.taskPlan.error = "";
              } else {
                state.taskPlan.data = null;
                state.taskPlan.error = result.reason.message;
              }
              return;
            }
            if (key === "members") {
              // Membership administration is restricted to a server admin or
              // a workspace owner. A refusal here is the ordinary answer for
              // everybody else, so it hides the card instead of surfacing as
              // a page load error.
              state.workspaceMembers = result.status === "fulfilled" ? result.value : null;
              state.workspaceMembersError = result.status === "fulfilled" ? "" : result.reason.message;
              return;
            }
            if (result.status === "fulfilled") state.data[key] = result.value;
            else {
              delete state.data[key];
              state.errors[key] = result.reason.message;
            }
          });
          if (Array.isArray(state.data.agentOptions?.agents)) {
            state.workspaceAgents[projectAtStart] = state.data.agentOptions.agents;
            delete state.workspaceAgentErrors[projectAtStart];
          }
          const contextVersion = state.data.sharedHandoff?.context_version ??
            state.data.overviewHandoff?.context_version;
          try {
            const freshness = await api(pathFor(`/freshness${contextVersion == null ? "" : `?context_version=${encodeURIComponent(contextVersion)}`}`));
            if (!requestIsCurrent()) return;
            state.data.freshness = freshness;
          } catch (error) {
            if (!requestIsCurrent()) return;
            delete state.data.freshness;
            state.errors.freshness = error.message;
          }
          try {
            const projectsResult = await api("/v1/projects?options=1");
            if (!requestIsCurrent()) return;
            state.projects = projectsResult.projects || [];
            delete state.errors.projectOptions;
          } catch (error) {
            if (!requestIsCurrent()) return;
            state.projects = [];
            state.errors.projectOptions = error.message || String(error);
            updateChrome();
          }
          if (!requestIsCurrent()) return;
          updateChrome();
          render({ feedTransition });
        } finally {
          if (!quiet) busy(false);
        }
      }

      function startPoller() {
        clearInterval(state.poller);
        if (!state.prefs.autoRefresh) return;
        const delay = Math.max(5, Math.min(300, Number(state.prefs.refreshSeconds) || 15)) * 1000;
        state.poller = setInterval(() => {
          if (!state.projectId || document.hidden || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) return;
          loadProjectData({ quiet: true });
        }, delay);
      }

      function pageHead(eyebrow, title, description, actions = "") {
        return `<div class="page-head"><div><div class="eyebrow">${h(eyebrow)}</div><h1>${h(title)}</h1><p>${h(description)}</p></div>${actions ? `<div class="page-actions">${actions}</div>` : ""}</div>`;
      }

      function allErrors() { return Object.entries(state.errors).map(([key, message]) => `${key}: ${message}`).join(" · "); }

      function applyCredentialCapabilityGates() {
        const capabilities = state.credentialAccess?.capabilities || {};
        if (capabilities.client_keys === true) return;
        const form = $('form[data-form="create-client-key"]', content);
        if (form) form.hidden = true;
        $$('[data-action="revoke-client-key"], [data-action="delete-client-key"]', content).forEach(button => {
          button.disabled = true;
          button.title = "Client API key management is unavailable in this server build.";
        });
      }

      function render({ force = false, feedTransition = null } = {}) {
        const viewport = captureFeedViewport();
        const context = { viewport, feedTransition, feedResetApplied: null };
        state.renderContext = context;
        updateChrome();
        if (!state.auth?.authenticated) {
          renderAuth();
          state.renderContext = null;
          return true;
        }
        if (!state.projectId && state.view !== "workspaces" && state.view !== "settings") state.view = "workspaces";
        const renderer = {
          overview: renderOverview,
          workspaces: renderWorkspaces,
          tasks: renderTasks,
          room: renderRoom,
          rules: renderRules,
          context: renderCloudContext,
          network: renderNetwork,
          decisions: renderDecisions,
          handoff: renderHandoff,
          log: renderLog,
          activity: renderActivity,
          settings: renderAuthenticatedSettings
        }[state.view];
        try {
          const html = renderer();
          const key = `${state.projectId || "none"}:${state.view}`;
          if (!shouldReplaceRender(state.renderedKey, state.renderedHtml, key, html, force)) {
            restoreControlFocus();
            return false;
          }
          content.innerHTML = html;
          if (state.view === "settings") applyCredentialCapabilityGates();
          state.renderedKey = key;
          state.renderedHtml = html;
          updateChrome();
          restoreFeedViewport(viewport, feedTransition, context.feedResetApplied);
          restoreControlFocus();
          return true;
        } finally {
          state.renderContext = null;
        }
      }

      function renderOverview() {
        const project = currentProject() || {};
        const tasks = state.data.overviewTasks?.tasks || [];
        const decisionsResponse = state.data.overviewDecisions || {};
        const agents = state.data.overviewAgents?.agents || [];
        const handoff = state.data.overviewHandoff || state.data.handoff || {};
        const status = state.data.status || {};
        const counts = status.counts || {};
        const openTasks = tasks.filter(task => !["done", "cancelled"].includes(task.status));
        const claimed = tasks.filter(task => task.status === "claimed").length;
        const proposed = Number(counts.open_decisions) || 0;
        const decisionsTotal = responsePage(decisionsResponse, "decisions", 0).unfilteredTotal;
        const recentResponse = state.data.overviewLog || {};
        const recentKey = Array.isArray(recentResponse.entries) ? "entries" : "log";
        const recent = responseRows(recentResponse, recentKey);
        const logLine = entry => typeof entry === "string" ? entry : entry?.line || "";
        const verify = state.data.verify;
        const freshness = state.data.freshness;
        return pageHead("Project pulse", project.name || project.project_id, "One screen for the current state, active work, and what changed.", `<button class="button" data-view="room">Message room</button><button class="button primary" data-view="tasks">Create task</button>`) +
          (allErrors() ? errorNotice(allErrors()) : "") +
          `<div class="grid metrics">
            <section class="card metric"><div class="label">Ledger events</div><div class="value">${Number(counts.events ?? project.events ?? state.data.events?.events?.length ?? 0).toLocaleString()}</div><div class="sub">${verify?.ok ? "Chain verified" : verify ? "Verification needs attention" : "Verification unavailable"}</div></section>
            <section class="card metric"><div class="label">Open tasks</div><div class="value">${h(counts.open_tasks ?? openTasks.length)}</div><div class="sub">${h(counts.claimed_tasks ?? claimed)} currently claimed</div></section>
            <section class="card metric"><div class="label">Open decisions</div><div class="value">${h(counts.open_decisions ?? proposed)}</div><div class="sub">${h(decisionsTotal)} total records</div></section>
            <section class="card metric"><div class="label">Known workers</div><div class="value">${h(counts.agents ?? agents.length)}</div><div class="sub">Context version ${h(status.context_version ?? handoff.context_version ?? project.context_version ?? "—")}</div></section>
          </div>
          <div class="card handoff-hero section-gap">
            <div class="cluster"><span class="badge accepted">Current handoff</span><span class="faint small">Updated ${h(relativeTime(handoff.handoff_updated_at))} by ${h(actorDisplay(handoff.handoff_updated_by || "nobody yet"))}</span></div>
            <div class="handoff-objective">${h(handoff.handoff?.objective || "No objective has been written yet.")}</div>
            <div class="form-actions"><button class="button small" data-view="handoff">Open handoff</button></div>
          </div>
          <div class="grid main-side section-gap">
            <section class="card"><div class="card-head"><h2>Active work</h2><button class="button quiet small" data-view="tasks">View board</button></div><div class="card-body">
              ${openTasks.length ? `<div class="list">${openTasks.slice(0, 7).map(task => `<div class="list-row"><div><div class="list-title">${h(task.task_id)} · ${h(task.title)}</div><div class="list-meta"><span>${h(taskClaimantText(task))}</span><span>${h(task.expected_scope?.length ? `${task.expected_scope.length} scoped path${task.expected_scope.length === 1 ? "" : "s"}` : "scope not set")}</span></div></div><div>${statusBadge(task.status)}</div></div>`).join("")}</div>` : empty("The board is clear", "Create a task when there is work to coordinate.", `<button class="button small primary" data-view="tasks">Create task</button>`) }
            </div></section>
            <section class="card"><div class="card-head"><h2>Recent activity</h2><button class="button quiet small" data-view="activity">Full ledger</button></div><div class="card-body">
              ${recent.length ? `<div class="timeline">${recent.map(entry => `<div class="timeline-row"><div class="timeline-line">${h(logLine(entry))}</div></div>`).join("")}</div>` : empty("No activity yet", "Events will appear as people and agents work.")}
            </div></section>
          </div>
          <div class="grid two section-gap">
            <section class="card"><div class="card-head"><h2>Workers</h2><button class="button quiet small" data-view="settings">Register worker</button></div><div class="card-body">
              ${agents.length ? `<div class="list">${agents.map(agent => `<div class="list-row"><div><div class="list-title">${h(agentFriendlyName(agent))}</div><div class="list-meta"><span>${h(agentShortName(agent) || "Compatibility record")}</span>${agentDisplayDescription(agent) && agentDisplayDescription(agent) !== agentFriendlyName(agent) ? `<span>${h(agentDisplayDescription(agent))}</span>` : ""}${ownerChip(agent.owner)}<span>${h(agent.role || "role not set")}</span><span>${h(agent.runtime || "runtime not set")}</span></div></div><div class="faint small">${h(relativeTime(agent.last_seen_at))}</div></div>`).join("")}</div>` : empty("No workers registered", "Workers appear here after they register with this workspace.")}
            </div></section>
            <section class="card"><div class="card-head"><h2>Continuity</h2></div><div class="card-body stack">
              <div class="list-row"><div><div class="list-title">Git branch</div><div class="list-meta"><span>Current server-side checkout</span></div></div><code>${h(handoff.git?.branch || "—")}</code></div>
              <div class="list-row"><div><div class="list-title">Git revision</div><div class="list-meta"><span>Last observed HEAD</span></div></div><code>${h((handoff.git?.head || "—").slice(0, 10))}</code></div>
              <div class="list-row"><div><div class="list-title">Ledger integrity</div><div class="list-meta"><span>${h(verify?.events ?? 0)} checked events</span></div></div>${statusBadge(verify?.ok ? "ok" : "error")}</div>
              <div class="list-row"><div><div class="list-title">Panel briefing</div><div class="list-meta"><span>Context v${h(freshness?.current_context_version ?? status.context_version ?? "—")}</span></div></div>${statusBadge(freshness?.stale === false ? "fresh" : freshness?.stale ? "stale" : "unknown")}</div>
            </div></section>
          </div>`;
      }

      // POST /v1/projects is open to every authenticated human account, and
      // the server grants the creator membership on the workspace it makes,
      // so there is no separate administrator gate to mirror here.  Keep this
      // the single place the panel answers "may this account create one?".
      function canCreateWorkspace() { return Boolean(state.auth?.authenticated); }

      const NO_WORKSPACE_NOTICE =
        "Your account has no workspace yet — ask an administrator to add you, or create a workspace";
      const NO_WORKSPACE_NOTICE_WITHOUT_CREATE =
        "Your account has no workspace yet — ask an administrator to add you";

      function noWorkspaceNotice() {
        const text = canCreateWorkspace()
          ? NO_WORKSPACE_NOTICE : NO_WORKSPACE_NOTICE_WITHOUT_CREATE;
        return `<div class="notice"><span>i</span><div><strong>${h(text)}.</strong><br>Workspace access is granted per workspace. Other workspaces may exist on this server; they stay hidden until an administrator or a workspace owner adds your account.</div></div>`;
      }

      // The Members card is rendered only when the server actually answered
      // GET /members for this account, so the card is hidden for an ordinary
      // member without ever guessing the authorization rule in the browser.
      function renderWorkspaceMembers() {
        const response = state.workspaceMembers;
        if (!state.projectId || !response) return "";
        const page = responsePage(response, "members");
        const members = page.rows;
        const rows = members.length
          ? members.map(member => `<div class="list-row"><div><div class="list-title">@${h(member.username)}${member.display_name && member.display_name !== member.username ? ` · ${h(member.display_name)}` : ""}</div><div class="list-meta"><span>${member.is_admin ? "server administrator" : "workspace member"}</span>${member.is_workspace_owner ? `<span>workspace owner</span>` : ""}${member.disabled ? `<span>account disabled</span>` : ""}<span>Added ${h(fmtTime(member.granted_at))}</span>${member.granted_by ? `<span>by @${h(member.granted_by)}</span>` : ""}</div></div><button class="button danger small" type="button" data-action="revoke-workspace-member" data-member="${h(member.username)}">Remove</button></div>`).join("")
          : empty("No accounts added yet", "Add an existing account name to give that person access to this workspace.");
        const truncated = members.length < page.total
          ? `<div class="faint small section-gap">Showing ${h(members.length)} of ${h(page.total)} members.</div>` : "";
        return `<div class="grid section-gap"><section class="card"><div class="card-head"><div><h2>Members</h2><span class="faint small">accounts with access to ${h(state.projectId)}</span></div><span class="badge">${h(page.unfilteredTotal)} member${page.unfilteredTotal === 1 ? "" : "s"}</span></div><div class="card-body">
          <div class="notice"><span>i</span><div><strong>Workspace access is a single durable grant.</strong><br>Adding an account lets that person read and work in this workspace. It carries no separate member role, never creates an account, and never renames or replaces an AI identity.</div></div>
          <div class="list section-gap">${rows}</div>${truncated}
          <form data-form="add-workspace-member" class="section-gap"><div class="field"><label for="workspace-member-username">Add account</label><input id="workspace-member-username" name="username" required minlength="2" maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9._\\-]+" placeholder="account name" autocomplete="off"><span class="help">The account must already exist on this server. Removing the last administrator or owner of a workspace is refused.</span></div><div class="form-actions"><button class="button primary" type="submit">Add account</button></div></form>
        </div></section></div>`;
      }

      function renderWorkspaces() {
        const response = state.errors.projectPage ? {}
          : state.data.projectPage || { projects: state.projects };
        const projects = responseRows(response, "projects");
        const noWorkspaces = !projects.length && !state.workspaceSearch;
        return pageHead("Server workspaces", "Workspaces", "Create a logical project or switch which one this panel manages.") +
          (state.errors.projectPage ? errorNotice(state.errors.projectPage) : "") +
          (noWorkspaces ? noWorkspaceNotice() : "") +
          `<div class="grid main-side">
            <section><div class="grid two">
              <div class="filterbar" style="grid-column:1/-1"><input id="workspace-search" type="search" value="${h(state.workspaceSearch)}" placeholder="Search all workspaces…" aria-label="Search workspaces">${sortControl("workspaces")}</div>${projects.length ? projects.map(project => `<article class="card workspace-card ${project.project_id === state.projectId ? "selected" : ""}">
                <div class="workspace-top"><div><div class="cluster"><h2 class="workspace-title">${h(project.name || project.project_id)}</h2>${project.project_id === state.projectId ? `<span class="badge accepted">Selected</span>` : ""}</div><div class="faint mono small" style="margin-top:5px">${h(project.project_id)}</div></div><button class="button small ${project.project_id === state.projectId ? "quiet" : ""}" data-action="select-project" data-project="${h(project.project_id)}" ${project.project_id === state.projectId ? "disabled" : ""}>${project.project_id === state.projectId ? "Active" : "Open"}</button></div>
                <div class="workspace-stats"><div class="workspace-stat"><strong>${Number(project.events || 0).toLocaleString()}</strong><span>Events</span></div><div class="workspace-stat"><strong>${Number(project.open_tasks || 0).toLocaleString()}</strong><span>Open tasks</span></div></div>
                <div class="list-meta"><span>Context v${h(project.context_version)}</span><span>Created ${h(fmtTime(project.created_at))}</span></div>
                ${project.repository_fingerprint ? `<div class="truncate faint mono small" title="${h(project.repository_fingerprint)}" style="margin-top:10px">${h(project.repository_fingerprint)}</div>` : `<div class="faint small" style="margin-top:10px">No Git identity recorded</div>`}
              </article>`).join("") : `<div class="card" style="grid-column:1/-1">${empty(state.workspaceSearch ? "No matching workspaces" : "No workspaces you can open", state.workspaceSearch ? "Change or clear the search." : "This list shows only the workspaces your account has been granted.")}</div>`}
              <div style="grid-column:1/-1">${pageToolbar("workspaces", response, "projects", "workspaces")}</div>
            </div></section>
            <aside class="card"><div class="card-head"><h2>Create workspace</h2></div><div class="card-body">
              <form data-form="create-workspace">
                <div class="field"><label for="workspace-name">Name</label><input id="workspace-name" name="name" required placeholder="Acme storefront"><span class="help">The human-readable project name.</span></div>
                <div class="field section-gap"><label for="workspace-id">Workspace ID <span class="faint">optional</span></label><input id="workspace-id" name="project_id" placeholder="acme-storefront" pattern="[A-Za-z0-9._-]+"><span class="help">Leave blank to generate it from the name.</span></div>
                <div class="field section-gap"><label for="workspace-fingerprint">Git fingerprint <span class="faint">optional</span></label><input id="workspace-fingerprint" name="repository_fingerprint" placeholder="sha256:…"><span class="help">Use the canonical remote fingerprint when connecting clones.</span></div>
                <div class="form-actions"><button class="button primary" type="submit">Create workspace</button></div>
              </form>
              <div class="notice section-gap"><span>i</span><div><strong>Workspace management</strong><br>The REST API creates and selects workspaces. Rename, archive, delete, and remote-path attachment are not exposed yet.</div></div>
            </div></aside>
          </div>` +
          renderWorkspaceMembers();
      }

      function renderTasks() {
        const response = state.data.tasks || {};
        const tasks = responseRows(response, "tasks");
        return pageHead("Shared task board", "Tasks", "Claim work explicitly, coordinate overlapping paths, and attach evidence when reporting.") +
          (state.errors.tasks ? errorNotice(state.errors.tasks) : "") +
          `<div class="grid main-side">
            <section>
              <div class="filterbar"><input id="task-search" type="search" value="${h(state.taskSearch)}" placeholder="Search all tasks…" aria-label="Search tasks"><select id="task-filter" aria-label="Filter task status">${["active","all","queued","claimed","blocked","review","done","cancelled"].map(option => `<option value="${option}" ${option === state.taskFilter ? "selected" : ""}>${option[0].toUpperCase() + option.slice(1)}</option>`).join("")}</select>${sortControl("tasks")}</div>
              <div class="stack">${tasks.length ? tasks.map(renderTaskCard).join("") : `<div class="card">${empty("No matching tasks", "Change the filter or create a new task.")}</div>`}</div>
              ${pageToolbar("tasks", response, "tasks", "tasks")}
            </section>
            <aside class="card"><div class="card-head"><h2>Create task</h2></div><div class="card-body">
              <form data-form="create-task">
                <div class="field"><label for="task-title">Title</label><input id="task-title" name="title" required placeholder="Add onboarding walkthrough"></div>
                <div class="field section-gap"><label for="task-description">Description</label><textarea id="task-description" name="description" placeholder="What needs to be true when this is done?"></textarea></div>
                <div class="field section-gap"><label for="task-scope">Expected paths</label><input id="task-scope" name="expected_scope" placeholder="src/**, tests/**"><span class="help">Comma-separated paths power overlap warnings.</span></div>
                <div class="field section-gap"><label for="task-dependencies">Dependencies</label><input id="task-dependencies" name="dependencies" placeholder="T-1, T-4"></div>
                <div class="field section-gap"><label for="task-risk">Risk</label><select id="task-risk" name="risk_level"><option>low</option><option selected>medium</option><option>high</option></select></div>
                <div class="field section-gap"><label for="task-plan-required">Detailed plan</label><select id="task-plan-required" name="plan_required"><option value="false" selected>Optional / not yet required</option><option value="true">Required for this large task</option></select><span class="help">A plan has immutable revisions, section review, approvals, and attributed edit suggestions.</span></div>
                <div class="form-actions"><button class="button primary" type="submit">Create task</button></div>
              </form>
            </div></aside>
          </div>`;
      }

      function renderTaskCard(task) {
        const canClaim = ["queued", "blocked", "review"].includes(task.status) || (task.status === "claimed" && task.claimed_by === state.prefs.actor);
        const canReport = !["done", "cancelled"].includes(task.status) && (task.status !== "claimed" || task.claimed_by === state.prefs.actor || task.lease_expired);
        const planReady = !task.plan_required || task.plan?.status === "approved";
        const scope = task.expected_scope || [];
        const attribution = task.attribution || {};
        const claimantText = taskClaimantText(task);
        return `<article class="card task-card">
          <div class="task-top"><div><div class="cluster"><span class="mono muted">${h(task.task_id)}</span>${statusBadge(task.status)}${statusBadge(task.risk_level)}${task.plan ? statusBadge(task.plan.status) : task.plan_required ? `<span class="badge draft">plan required</span>` : ""}</div><h2 class="task-title" style="margin-top:10px">${h(task.title)}</h2></div><div class="faint small">${h(relativeTime(task.updated_at))}</div></div>
          ${task.description ? `<p class="task-description">${h(task.description)}</p>` : ""}
          <div class="task-meta">${scope.map(item => `<span class="chip">${h(item)}</span>`).join("") || `<span class="faint small">No expected paths</span>`}</div>
          <div class="list-meta"><span>Claimant: ${h(claimantText)}</span>${task.lease_until ? `<span>Lease ${h(relativeTime(task.lease_until))}</span>` : ""}${task.dependencies?.length ? `<span>Depends on ${h(task.dependencies.join(", "))}</span>` : ""}</div>
          <div class="list-meta attribution-line">${actionAttribution("Created", attribution.created)}${actionAttribution("Claimed", attribution.claimed)}${actionAttribution("Resolved", attribution.resolved)}</div>
          ${!planReady ? `<div class="notice section-gap"><span>!</span><div><strong>Approval gate active.</strong><br>This required plan is ${h(task.plan?.status || "missing")}. The task may be blocked or returned to queue, but cannot move to review or done until the latest plan is approved.</div></div>` : ""}
          ${task.last_report ? `<details class="section-gap"><summary class="muted small">Latest report</summary><div class="notice section-gap"><div><strong>${h(task.last_report.summary)}</strong><br>${h(attributionText(task.last_report.reported_by, task.last_report.reported_actor_type, task.last_report.reported_owner, attribution.reported?.attribution))} · ${h(fmtTime(task.last_report.reported_at))}</div></div></details>` : ""}
          <div class="task-actions">
            <button class="button small ${task.plan ? "primary" : ""}" type="button" data-action="view-task-plan" data-task="${h(task.task_id)}">${task.plan ? "View plan →" : "Add plan →"}</button>
            ${canClaim ? `<button class="button small" data-action="claim-task" data-task="${h(task.task_id)}">${task.status === "claimed" ? "Renew claim" : "Claim"}</button>` : ""}
            ${task.status === "claimed" && task.claimed_by === state.prefs.actor ? `<button class="button quiet small" data-action="release-task" data-task="${h(task.task_id)}">Release</button>` : ""}
            ${canReport ? `<details style="flex:1 1 100%"><summary class="button small" style="display:inline-flex;align-items:center">Report result</summary><form data-form="report-task" data-task="${h(task.task_id)}" class="section-gap"><div class="form-grid"><div class="field wide"><label>Summary</label><textarea name="summary" required placeholder="What changed and what remains?"></textarea></div><div class="field"><label>Resulting state</label><select name="requested_state"><option value="review" ${planReady ? "selected" : "disabled"}>review${planReady ? "" : " · needs approved plan"}</option><option value="done" ${planReady ? "" : "disabled"}>done${planReady ? "" : " · needs approved plan"}</option><option value="blocked" ${planReady ? "" : "selected"}>blocked</option><option value="queued">queued</option></select></div><div class="field"><label>Evidence JSON</label><input name="evidence" placeholder='[{"kind":"test","result":"pass"}]'></div></div><div class="form-actions"><button class="button primary small" type="submit">Submit report</button></div></form></details>` : ""}
            ${!["claimed"].includes(task.status) ? `<select aria-label="Set status for ${h(task.task_id)}" data-status-select="${h(task.task_id)}" style="width:auto;min-height:32px;padding:4px 30px 4px 8px"><option value="">Set status…</option>${["queued","blocked","review","done","cancelled"].filter(status => status !== task.status).map(status => `<option value="${status}" ${!planReady && ["review","done"].includes(status) ? "disabled" : ""}>${status}${!planReady && ["review","done"].includes(status) ? " · needs approved plan" : ""}</option>`).join("")}</select>` : ""}
          </div>
          ${state.taskPlan.taskId === task.task_id ? renderTaskPlanPanel(task) : ""}
        </article>`;
      }

      function renderTaskPlanEditor(task, plan = null) {
        const expected = plan?.version;
        const submitDefault = !plan || plan.status !== "draft";
        return `<form data-form="set-task-plan" data-task="${h(task.task_id)}" class="plan-editor section-gap">
          ${expected == null ? "" : `<input type="hidden" name="expected_version" value="${h(expected)}">`}
          <div class="form-grid">
            <div class="field wide"><label>Plan title</label><input name="title" required value="${h(plan?.title || `${task.title} — delivery plan`)}" placeholder="Detailed delivery plan"></div>
            <div class="field wide"><label>Overview</label><textarea name="overview" placeholder="Purpose, constraints, dependencies, risks, and what success looks like.">${h(plan?.overview || "")}</textarea></div>
            <div class="field wide"><label>Detailed sections</label><textarea name="sections_markdown" required placeholder="## Scope [scope]\nDetailed scope…\n\n## Implementation [implementation]\nDetailed sequence…">${h(planSectionsToMarkdown(plan?.sections || []))}</textarea><span class="help">Start every long section with <code>## Heading [stable-id]</code>. Keep the bracketed ID stable across revisions so feedback remains addressable.</span></div>
            <div class="field"><label>After saving</label><select name="submit_for_review"><option value="false" ${submitDefault ? "" : "selected"}>Keep as draft</option><option value="true" ${submitDefault ? "selected" : ""}>Submit for review</option></select></div>
          </div>
          <div class="form-actions"><button class="button quiet small" type="button" data-action="cancel-plan-edit" data-task="${h(task.task_id)}">Cancel</button><button class="button primary small" type="submit">${plan ? "Create revision" : "Create plan"}</button></div>
        </form>`;
      }

      function renderTaskPlanPanel(task) {
        const selected = state.taskPlan;
        if (selected.loading) return `<section class="task-plan-panel"><div class="muted">Loading full plan…</div></section>`;
        if (selected.error) return `<section class="task-plan-panel"><div class="notice error"><span>!</span><div><strong>Plan could not load</strong><br>${h(selected.error)}</div></div><div class="form-actions"><button class="button quiet small" type="button" data-action="close-task-plan">Close</button><button class="button small" type="button" data-action="view-task-plan" data-task="${h(task.task_id)}" ${selected.selectedVersion == null ? "" : `data-version="${h(selected.selectedVersion)}"`}>Retry</button></div></section>`;
        const payload = selected.data || { plan: null, revisions: [] };
        const plan = payload.plan;
        if (!plan) return `<section class="task-plan-panel"><div class="task-plan-head"><div><div class="eyebrow">Detailed task plan</div><h3>No plan yet</h3><p class="muted small">Use a structured plan for large work, then submit it for human or Director approval and section-level suggestions.</p></div><button class="button quiet small" type="button" data-action="close-task-plan">Close</button></div>${canEditTaskPlan(task) ? renderTaskPlanEditor(task) : `<div class="notice error section-gap"><span>i</span><div><strong>Read-only for this identity.</strong><br>A human, registered Director, or the active task claimant can create the plan.</div></div>`}</section>`;
        const revisions = payload.revisions || [];
        const revisionInPage = revisions.some(item =>
          Number(item.version) === Number(plan.version));
        const revisionChoices = revisionInPage ? revisions : [
          { version: plan.version, status: plan.status, outside_page: true },
          ...revisions
        ];
        const latestVersion = Number(task.plan?.version) ||
          revisions.reduce((latest, item) => Math.max(
            latest, Number(item.version) || 0), Number(plan.version) || 0);
        const historical = Number(plan.version) !== latestVersion;
        const editable = canEditTaskPlan(task) && !historical;
        const approvable = canApproveTaskPlan() && !historical && plan.status === "in_review";
        const feedbackOpen = !historical && plan.status === "in_review";
        const revisionFilters = ["all", "draft", "in_review", "changes_requested", "approved"];
        const actionFilters = [
          ["all", "All activity"], ["review", "Reviews"],
          ["approved", "Approvals"], ["suggested", "Edit suggestions"],
          ["commented", "Comments"], ["submitted", "Submissions"],
          ["revised", "Revisions"], ["created", "Creation"]
        ];
        const actionButtons = historical ? "" : `<div class="cluster">
          ${plan.status === "draft" && editable ? `<button class="button primary small" type="button" data-action="submit-task-plan" data-task="${h(task.task_id)}" data-version="${h(plan.version)}">Submit for review</button>` : ""}
          ${approvable ? `<button class="button primary small" type="button" data-action="approve-task-plan" data-task="${h(task.task_id)}" data-version="${h(plan.version)}">Approve entire plan</button>` : ""}
          ${feedbackOpen ? `<button class="button small" type="button" data-action="suggest-task-plan" data-task="${h(task.task_id)}" data-version="${h(plan.version)}">Suggest overall edit</button>` : ""}
          <button class="button quiet small" type="button" data-action="comment-task-plan" data-task="${h(task.task_id)}" data-version="${h(plan.version)}">Comment</button>
          ${editable ? `<button class="button small" type="button" data-action="edit-task-plan" data-task="${h(task.task_id)}">${plan.status === "draft" ? "Revise draft" : "Create new revision"}</button>` : ""}
        </div>`;
        return `<section class="task-plan-panel" aria-label="Detailed plan for ${h(task.task_id)}">
          <div class="task-plan-head"><div><div class="cluster"><span class="eyebrow">Detailed task plan</span>${statusBadge(plan.status)}${historical ? `<span class="badge done">historical</span>` : `<span class="badge accepted">latest</span>`}</div><h3>${h(plan.title)}</h3><div class="list-meta"><span>version ${h(plan.version)}</span><span>${h(plan.sections?.length || 0)} section${plan.sections?.length === 1 ? "" : "s"}</span><span>authored ${h(fmtTime(plan.authored_at))}</span></div></div><button class="button quiet small" type="button" data-action="close-task-plan">Close</button></div>
          <div class="filterbar section-gap"><input id="task-plan-revision-search" type="search" value="${h(selected.revisionQuery)}" placeholder="Search every plan revision…" aria-label="Search all plan revisions"><select id="task-plan-revision-filter" aria-label="Filter plan revision status">${revisionFilters.map(value => `<option value="${h(value)}" ${selected.revisionFilter === value ? "selected" : ""}>${value === "all" ? "All statuses" : h(identityPart(value))}</option>`).join("")}</select>${taskPlanSortControl("revision")}</div><div class="faint small">Revision search, status, and date order apply to the complete immutable history before each page.</div>
          <div class="task-plan-head section-gap"><label class="field small">Revision<select data-plan-version="${h(task.task_id)}" aria-label="Plan revision">${revisionChoices.map(item => `<option value="${h(item.version)}" ${Number(item.version) === Number(plan.version) ? "selected" : ""}>v${h(item.version)} · ${h(item.status)}${item.outside_page ? " · selected outside this page" : ""}</option>`).join("")}</select></label></div>${taskPlanPageToolbar(payload, "revision", "plan revisions")}
          ${plan.overview ? `<div class="task-plan-overview">${h(plan.overview)}</div>` : ""}
          ${!canApproveTaskPlan() && feedbackOpen ? `<div class="notice section-gap"><span>i</span><div><strong>Approval is restricted to a human or registered Director.</strong><br>This identity may still leave attributed comments and edit suggestions.</div></div>` : ""}
          <div class="plan-sections">${(plan.sections || []).map((section, index) => `<article class="plan-section"><div class="task-plan-head"><div><div class="eyebrow">Section ${index + 1} · ${h(section.section_id)}</div><h4>${h(section.title)}</h4></div>${feedbackOpen ? `<div class="cluster">${approvable ? `<button class="button primary small" type="button" data-action="approve-task-plan" data-task="${h(task.task_id)}" data-version="${h(plan.version)}" data-section="${h(section.section_id)}">Approve section</button>` : ""}<button class="button small" type="button" data-action="suggest-task-plan" data-task="${h(task.task_id)}" data-version="${h(plan.version)}" data-section="${h(section.section_id)}">Suggest edit</button><button class="button quiet small" type="button" data-action="comment-task-plan" data-task="${h(task.task_id)}" data-version="${h(plan.version)}" data-section="${h(section.section_id)}">Comment</button></div>` : ""}</div><div class="plan-section-body">${h(section.body)}</div></article>`).join("")}</div>
          ${actionButtons}
          ${selected.edit && editable ? renderTaskPlanEditor(task, plan) : ""}
          <div class="plan-review-history"><div class="eyebrow">Plan activity · immutable attribution</div><div class="filterbar section-gap"><input id="task-plan-action-search" type="search" value="${h(selected.actionQuery)}" placeholder="Search every action on this revision…" aria-label="Search all actions on this plan revision"><select id="task-plan-action-filter" aria-label="Filter plan activity type">${actionFilters.map(([value, label]) => `<option value="${h(value)}" ${selected.actionFilter === value ? "selected" : ""}>${h(label)}</option>`).join("")}</select>${taskPlanSortControl("action")}</div><div class="faint small">Activity search, type, and date order apply to the complete selected-revision history before each page.</div>${(plan.actions || []).length ? plan.actions.map(action => { const detail = action.payload || {}; return `<div class="plan-review-row"><div class="cluster"><strong>${h(planActionLabel(action.event_type))}</strong>${detail.section_id ? `<span class="chip">${h(detail.section_id)}</span>` : ""}<span class="faint small">${h(fmtTime(action.at))}</span></div>${detail.note ? `<div class="prose small section-gap">${h(detail.note)}</div>` : ""}<div class="list-meta">${actionAttribution("By", action)}</div></div>`; }).join("") : `<div class="muted small section-gap">${h(selected.actionQuery || selected.actionFilter !== "all" ? "No plan activity matches this full-history filter." : selected.actionOffset ? "No plan activity is available at this offset." : "No plan actions recorded for this revision.")}</div>`}${taskPlanPageToolbar(payload, "action", "plan actions")}</div>
        </section>`;
      }

      function renderRoom() {
        const roomResponse = state.data.room || {};
        const inbox = state.data.inbox || {};
        const unreadTotal = inboxUnreadTotal(inbox);
        const bridges = state.data.bridgeOptions?.bridges || state.data.bridges?.bridges || [];
        const friendlyName = value => {
          const raw = String(value || "Workspace");
          if (!/[-_]/.test(raw)) return raw;
          return raw.replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim().replace(/(^|\s)([a-z])/g, (_, gap, letter) => gap + letter.toUpperCase());
        };
        const projectName = id => friendlyName(state.projects.find(item => item.project_id === id)?.name || id);
        const sourceName = projectName(state.projectId);
        const requestedConversation = state.roomConversation || "local";
        const localConversation = requestedConversation === "local";
        const activeBridge = localConversation ? null
          : bridges.find(bridge => bridge.with === requestedConversation) || {
            with: requestedConversation, relation: "connected",
            participation: "unknown", metadata_unavailable: true
          };
        const conversationDenied = Boolean(activeBridge && activeBridge.can_participate === false);
        const conversationMetadataUnavailable = Boolean(activeBridge?.metadata_unavailable);
        const hasRoomResponse = Object.prototype.hasOwnProperty.call(state.data, "room");
        const echoedConversation = roomResponse.conversation;
        const scopeMismatch = hasRoomResponse &&
          String(echoedConversation ?? "") !== requestedConversation;
        const roomScope = `${state.projectId}:${requestedConversation}:${state.roomFilter}`;
        const roomPage = prepareServerFeed("room", roomResponse, "messages", roomScope);
        const pagedMessages = conversationDenied || scopeMismatch ? [] : [...roomPage.rows].sort(
          (left, right) => (Number(left.seq) || 0) - (Number(right.seq) || 0));
        const messages = pagedMessages;
        const conversationTitle = localConversation
          ? `Local workspace room · ${sourceName}`
          : `${sourceName} ↔ ${projectName(activeBridge.with)}`;
        return pageHead("Human + AI channel", `${sourceName} room`, "Choose the source workspace, then open its Local room or one named inter-project conversation. These feeds never mix. Every participation-visible non-self message appears here; mentions and replies only assign attention.", `<button class="button" data-view="network">Manage AI Network</button>`) +
          (state.errors.room || state.errors.inbox || state.errors.bridgeOptions || scopeMismatch
            ? errorNotice([state.errors.room, state.errors.inbox,
              state.errors.bridgeOptions,
              scopeMismatch ? "The room response did not match the requested conversation; no messages were rendered." : ""
            ].filter(Boolean).join(" · ")) : "") +
          `<section class="card"><div class="card-body"><div class="form-grid"><div class="field"><label for="room-workspace">Source workspace</label><select id="room-workspace">${state.projects.map(item => `<option value="${h(item.project_id)}" ${item.project_id === state.projectId ? "selected" : ""}>${h(projectName(item.project_id))} · ${h(item.project_id)}</option>`).join("")}</select><span class="help">Every conversation below is read from this workspace's retained room events.</span></div><div class="field"><label for="room-conversation">Conversation</label><select id="room-conversation"><optgroup label="Local"><option value="local" ${localConversation ? "selected" : ""}>Local workspace room · ${h(sourceName)}</option></optgroup>${bridges.length ? `<optgroup label="Inter-project">${bridges.map(bridge => `<option value="${h(bridge.with)}" ${requestedConversation === bridge.with ? "selected" : ""}>${h(sourceName)} ↔ ${h(projectName(bridge.with))} · ${h(bridge.relation)}${bridge.can_participate === false ? " · access denied" : ""}</option>`).join("")}</optgroup>` : ""}${conversationMetadataUnavailable ? `<optgroup label="Unavailable"><option value="${h(requestedConversation)}" selected disabled>${h(sourceName)} ↔ ${h(projectName(requestedConversation))} · metadata unavailable</option></optgroup>` : ""}</select><span class="help">The server filters this exact conversation before applying the 60-message page.</span></div><div class="field wide"><label for="room-search">Search this full conversation</label><input id="room-search" type="search" value="${h(state.roomFilter)}" placeholder="Search message body, actor, type, or task…"><span class="help">Search runs over the authorized conversation history, not only this page.</span></div></div>${activeBridge && !conversationMetadataUnavailable ? `<div class="form-actions"><button class="button quiet small" type="button" data-action="swap-room-workspace" data-project="${h(activeBridge.with)}" data-conversation="${h(state.projectId)}">View this pair from ${h(projectName(activeBridge.with))}</button></div>` : ""}<div class="notice ${conversationDenied || conversationMetadataUnavailable ? "error" : ""} section-gap"><span>${localConversation ? "L" : conversationDenied || conversationMetadataUnavailable ? "!" : "↔"}</span><div><strong>${h(conversationTitle)}</strong><br>${localConversation ? "Local workspace messages only; incoming and outgoing bridge traffic is excluded." : conversationDenied ? `${h(attributionText(state.prefs.actor, state.prefs.actorType, state.prefs.owner))} is denied by ${h(sourceName)}'s ${h(bridgeParticipationLabel(activeBridge.participation))} participation policy. The ${h(activeBridge.relation)} relationship still exists; a human or registered Director can change access in AI Network without deleting it.` : conversationMetadataUnavailable ? "The exact requested inter-project scope is preserved, but bridge metadata could not be loaded. Sending stays disabled until it is verified." : `Inter-project messages retained in ${h(sourceName)} only; unrelated origins and local-only messages are excluded.`}</div></div></div></section>` +
          renderPendingDispositions(inbox) +
          `<div class="grid main-side section-gap">
            <section class="card" id="room-conversation-feed"><div class="card-head"><div><h2>${h(conversationTitle)}</h2><span class="faint small">${conversationDenied ? `Messages are hidden by ${h(sourceName)}'s participation policy` : `${h(roomPage.total)} authorized conversation messages`}</span></div>${unreadTotal ? `<button class="button quiet small" type="button" data-action="mark-inbox-read">Mark group room read · ${h(Number(unreadTotal).toLocaleString())} unread</button>` : `<span class="badge fresh">caught up</span>`}<span class="badge ${conversationDenied ? "error" : localConversation ? "fresh" : "accepted"}">${conversationDenied ? "Access denied" : localConversation ? "Local" : "Inter-project"}</span></div><div class="card-body">
              ${conversationDenied ? empty("Conversation access denied", `${attributionText(state.prefs.actor, state.prefs.actorType, state.prefs.owner)} cannot read or send in this inter-project conversation. The relationship remains connected; change its participation policy in AI Network.`) : scopeMismatch ? empty("Conversation response rejected", "Refresh after the server can prove the exact requested conversation scope.") : `${roomPage.total || roomPage.offset ? feedToolbar("room", roomPage, `${pagedMessages.length} messages returned by full-history query`) : ""}${pagedMessages.length ? `<div class="room-feed" id="room-feed" role="log" aria-label="${h(conversationTitle)} message history" aria-live="off" tabindex="0" data-feed-scope="${h(roomScope)}">${pagedMessages.map(message => `<article class="message" data-feed-key="${h(message.seq)}"><div class="message-head"><span class="message-actor" title="Ledger actor: ${h(message.ledger_actor || message.actor)}">${h(attributionText(message.actor, message.actor_type, message.owner, message.attribution))}</span>${statusBadge(message.msg_type)}${message.broadcast_to_everyone ? `<span class="chip">to everyone</span>` : message.addressed_to_you ? `<span class="chip">your attention</span>` : message.group_context ? `<span class="chip">group context</span>` : ""}${dispositionChip(message)}${message.origin_project ? `<span class="chip">from ${h(projectName(message.origin_project))}</span>` : (message.mirrored_to || []).length ? `<span class="chip">to ${h(message.mirrored_to.map(projectName).join(", "))}</span>` : `<span class="chip">local · ${h(sourceName)}</span>`}${message.authority ? `<span class="badge">${h(message.authority)}</span>` : ""}</div><div class="message-body">${h(message.body)}</div><div class="message-foot"><span>#${h(message.seq)}</span><span>${h(fmtTime(message.at))}</span>${message.task_id ? `<span>${h(message.task_id)}</span>` : ""}${message.mentions?.length ? `<span>expected responder: ${h(message.mentions.map(actorDisplay).join(", "))}</span>` : ""}${message.reply_to ? `<span>reply ${h(String(message.reply_to).slice(0, 16))}</span>` : ""}</div></article>`).join("")}</div>` : empty(state.roomFilter ? "No matching conversation messages" : roomPage.offset ? "No messages at this offset" : localConversation ? "No local workspace messages" : "No retained messages for this workspace pair", state.roomFilter ? "Change or clear the full-history search." : roomPage.offset ? "Use Newer to return to an available page." : localConversation ? "Send the first local-only message." : "Send the first message across this workspace bridge.")}`}
            </div></section>
            <aside class="card"><div class="card-head"><h2>Send message</h2></div><div class="card-body">
              ${conversationDenied || conversationMetadataUnavailable ? `<div class="notice error"><span>!</span><div><strong>Sending is disabled for this conversation.</strong><br>${conversationMetadataUnavailable ? "Bridge metadata must load successfully before the panel can prove the destination." : "Participation is an access policy, not a relationship state. Ask a human or registered Director to update access in AI Network; do not delete the bridge just to grant access."}</div></div>` : `<form data-form="send-room">
                <div class="field"><label for="room-body">Message</label><textarea id="room-body" name="body" required placeholder="Tell the project what matters…"></textarea></div>
                <div class="field section-gap"><label for="room-destination">Destination</label><select id="room-destination" name="target_project"><optgroup label="Local"><option value="${h(state.projectId)}" ${localConversation ? "selected" : ""}>Local workspace room · ${h(sourceName)}</option></optgroup>${bridges.length ? `<optgroup label="Inter-project">${bridges.map(bridge => `<option value="${h(bridge.with)}" ${state.roomConversation === bridge.with ? "selected" : ""} ${bridge.can_participate === false ? "disabled" : ""}>${h(sourceName)} ↔ ${h(projectName(bridge.with))} · ${h(bridge.relation)}${bridge.can_participate === false ? " · access denied" : ""}</option>`).join("")}</optgroup>` : ""}</select><span class="help">A bridge destination is retained on both workspace rooms; Local stays only in ${h(sourceName)}. Denied destinations cannot be selected.</span></div>
                <div class="form-grid section-gap"><div class="field"><label for="room-type">Type</label><select id="room-type" name="msg_type">${["chat","directive","claim","handoff","challenge","decision","approval","status","system"].map(type => `<option>${type}</option>`).join("")}</select></div><div class="field"><label for="room-task">Task ID</label><input id="room-task" name="task_id" placeholder="T-13"></div><div class="field"><label for="room-mentions">Mention</label><input id="room-mentions" name="mentions" placeholder="@Gibbs, @Turing"><span class="help">Use server-unique short names such as @Gibbs. Matching is case-insensitive; the server records the exact canonical identities.</span></div><div class="field"><label for="room-reply">Reply to message</label><select id="room-reply" name="reply_to"><option value="">No reply</option>${messages.filter(message => message.event_id).map(message => `<option value="${h(message.event_id)}">#${h(message.seq)} · ${h(actorDisplay(message.actor))} · ${h(String(message.body || "").slice(0, 34))}</option>`).join("")}</select></div></div>
                <div class="form-actions"><button class="button primary" type="submit">Send to room</button></div>
              </form>`}
              <div class="notice section-gap"><span>i</span><div>Use room messages for coordination. Create a task for owned work and a decision for a durable project choice; chat alone records neither.</div></div>
            </div></aside>
          </div>`;

      function renderDecisions() {

      function handoffIdentityChoices(response) {
        const responseActor = String(response?.identity_handoff_actor ||

            actor_id: actorId,
            label: `${agentChoiceLabel(agent)}${actorId === state.prefs.actor &&
              state.prefs.actorType === "agent" ? " · this panel identity" : ""}`
          };

        const knownIds = new Set(choices.map(choice => choice.actor_id));
        // The server may answer for an identity the visible agent list does not

      function roleScopeLabel(role) {
        return role === "lead_director" ? "Lead Director" : identityPart(role);

      function renderRoleScopes() {

      function renderHandoff() {
        const sharedResponse = state.data.sharedHandoff || {};

        const response = state.data.identityHandoff || {};
        const history = state.data.identityHandoffHistory || {};
        const requestedActor = selectedHandoffActor();
        const responseActor = String(response.identity_handoff_actor ||
          response.handoff_actor || "");
        const historyActor = String(history.identity_handoff_actor ||
          history.handoff_actor || "");
        const hasShared = Object.prototype.hasOwnProperty.call(state.data, "sharedHandoff");
        const hasHandoff = Object.prototype.hasOwnProperty.call(state.data, "identityHandoff");
        const hasHistory = Object.prototype.hasOwnProperty.call(state.data, "identityHandoffHistory");
        const handoffMismatch = hasHandoff &&

          </div></section>
          <aside class="stack"><div class="card pad"><div class="eyebrow">Repository snapshot</div><div class="list section-gap"><div class="list-row"><span class="muted">Branch</span><code>${h(sharedResponse.git?.branch || "—")}</code></div><div class="list-row"><span class="muted">Revision</span><code>${h(sharedResponse.git?.head || "—")}</code></div><div class="list-row"><span class="muted">Open tasks</span><strong>${h(sharedResponse.open_tasks?.length || 0)}</strong></div><div class="list-row"><span class="muted">Live decisions</span><strong>${h(sharedResponse.decisions?.length || 0)}</strong></div></div></div><div class="notice"><span>i</span><div><strong>Project-wide, not a pseudo-identity</strong><br>Shared handoff v${h(sharedVersion)} has no web.jack, console.jack, or AI owner namespace. Each revision still records the exact Director and human operator that ran it.</div></div></aside></div>
          <section class="card section-gap"><div class="card-head"><h2>Shared handoff history</h2><span class="faint small">Project-wide Director revisions</span></div><div class="card-body"><div class="filterbar"><input id="shared-handoff-search" type="search" value="${h(state.sharedHandoffSearch)}" placeholder="Search shared handoff versions…" aria-label="Search shared handoff history">${sortControl("sharedHandoff")}</div><div class="list">${sharedVersions.length ? sharedVersions.map(version => `<details class="list-row" style="display:block"><summary><span class="list-title">v${h(version.version)}</span> <span class="faint small">${h(attributionText(version.updated_by || "unknown", "agent", version.updated_owner))} · ${h(fmtTime(version.updated_at))}</span></summary><div class="message-body section-gap">${HANDOFF_FIELDS.map(field => (version.content && version.content[field]) ? `<div><strong>${h(labels[field])}:</strong> ${h(version.content[field])}</div>` : "").join("")}</div></details>`).join("") : empty(state.sharedHandoffSearch ? "No matching shared handoff versions" : listPage("sharedHandoff").offset ? "No shared handoff versions at this offset" : "No shared handoff history yet", state.sharedHandoffSearch ? "Change or clear the project-wide history search." : listPage("sharedHandoff").offset ? "Use Previous to return to an available page." : "The first registered Director update will create shared handoff v1.")}</div>${pageToolbar("sharedHandoff", sharedHistory, "versions", "shared handoff versions")}</div></section>
          <section class="card section-gap"><div class="card-head"><div><h2>Exact AI identity handoff</h2><span class="faint small">Independent continuity after the shared project brief</span></div></div><div class="card-body">${identityChoices.length ? `<div class="form-grid"><div class="field wide"><label for="handoff-identity">Registered AI identity</label><select id="handoff-identity">${identityChoices.map(choice => `<option value="${h(choice.actor_id)}" ${choice.actor_id === requestedActor ? "selected" : ""}>${h(choice.label)}</option>`).join("")}</select><span class="help">Only registered AI identities appear here; web and console human operators never receive identity handoffs. Selecting another AI is read-only and never changes this panel's authenticated actor.</span></div></div>` : empty("No registered AI identities", "Register an AI before an exact identity handoff can be selected. Human web/console actors are intentionally excluded.")}</div></section>
          ${identityChoices.length ? `<div class="grid main-side section-gap"><section class="card"><div class="card-head"><div><h2>Current identity handoff · ${h(actorDisplay(requestedActor))}</h2><span class="faint small">identity v${h(identityVersion)} · context v${h(response.context_version ?? sharedResponse.context_version ?? "—")}</span></div><span class="faint small">${(response.identity_handoff_updated_by || response.handoff_updated_by) ? h(attributionText(response.identity_handoff_updated_by || response.handoff_updated_by, "agent", response.identity_handoff_updated_owner || response.handoff_updated_owner)) : "not written"} · ${h(fmtTime(response.identity_handoff_updated_at || response.handoff_updated_at))}</span></div><div class="card-body">
            ${canWriteIdentity ? `<div class="notice"><span>✓</span><div><strong>You are editing your own exact AI identity handoff.</strong><br>This write cannot target or replace another AI's history and does not modify the shared project brief.</div></div>` : `<div class="notice error"><span>i</span><div><strong>Read only for this identity.</strong><br>${ownIdentity && !hasHandoff ? "The exact identity handoff must load successfully before an update can be submitted." : ownIdentity ? `${h(actorDisplay(state.prefs.actor))} must remain a registered AI to write this history.` : "Only the exact selected AI may update its own identity handoff; human operators cannot own or impersonate it."}</div></div>`}
            <form data-form="update-identity-handoff" class="section-gap"><input type="hidden" name="expected_handoff_version" value="${h(identityVersion)}"><div class="form-grid">${HANDOFF_FIELDS.map((field, index) => `<div class="field ${field === "objective" || field === "notes" ? "wide" : ""}"><label for="identity-handoff-${field}">${h(labels[field])}</label><textarea id="identity-handoff-${field}" name="${field}" ${index === 0 ? "required" : ""} ${canWriteIdentity ? "" : "disabled"} placeholder="${field === "blockers" ? "None" : "Write this AI's concise continuity update…"}">${h(handoff[field] || "")}</textarea></div>`).join("")}</div><div class="form-actions"><button class="button primary" type="submit" ${canWriteIdentity ? "" : "disabled"}>Update my AI identity handoff</button></div></form>
          </div></section><aside class="notice"><span>i</span><div><strong>Independent identity version</strong><br>Identity handoff v${h(identityVersion)} belongs only to ${h(actorDisplay(requestedActor))}. It supplements shared project handoff v${h(sharedVersion)} and the selected role's scope; none overwrites another.</div></aside></div>` : ""}
          ${renderRoleScopes()}
          ${identityChoices.length ? `<section class="card section-gap"><div class="card-head"><h2>Identity handoff history · ${h(actorDisplay(requestedActor))}</h2><span class="faint small">Exact registered-AI revisions only</span></div><div class="card-body"><div class="filterbar"><input id="handoff-search" type="search" value="${h(state.handoffSearch)}" placeholder="Search this AI's identity handoff versions…" aria-label="Search identity handoff history">${sortControl("handoff")}</div><div class="list">${versions.length ? versions.map(version => `<details class="list-row" style="display:block"><summary><span class="list-title">v${h(version.version)}</span> <span class="faint small">${h(attributionText(version.updated_by || requestedActor, "agent", version.updated_owner))} · ${h(fmtTime(version.updated_at))}</span></summary><div class="message-body section-gap">${HANDOFF_FIELDS.map(field => (version.content && version.content[field]) ? `<div><strong>${h(labels[field])}:</strong> ${h(version.content[field])}</div>` : "").join("")}</div></details>`).join("") : empty(state.handoffSearch ? "No matching identity handoff versions" : listPage("handoff").offset ? "No identity handoff versions at this offset" : "No identity handoff history yet", state.handoffSearch ? "Change or clear this AI's full-history search." : listPage("handoff").offset ? "Use Previous to return to an available page." : `The first update by ${actorDisplay(requestedActor)} will create identity handoff v1.`)}</div>${pageToolbar("handoff", historyMismatch ? {} : history, "versions", "identity handoff versions")}</div></section>` : ""}
          `;
      }

      function renderLog() {
        const response = state.data.log || {};
        const key = Array.isArray(response.entries) ? "entries" : "log";
        const entries = responseRows(response, key);

          (state.errors.log ? errorNotice(state.errors.log) : "") +
          `<section class="card"><div class="card-head"><h2>Significant project history</h2></div><div class="card-body"><div class="filterbar"><input id="log-search" type="search" value="${h(state.logSearch)}" placeholder="Search the full project log…" aria-label="Search project log">${sortControl("log")}</div><div class="faint small">Search and date order are applied to the complete authorized log before each ${h(PANEL_PAGE_SIZE)}-entry page.</div>${entries.length ? `<div class="timeline section-gap">${entries.map(entry => `<div class="timeline-row"${entry?.seq ? ` data-feed-key="${h(entry.seq)}"` : ""}><div class="timeline-line prose">${h(lineText(entry))}</div></div>`).join("")}</div>` : empty(state.logSearch ? "No matching project log entries" : "No project log entries", state.logSearch ? "Change or clear the full-history search." : "Meaningful project milestones will appear here.")}${pageToolbar("log", response, key, "significant entries")}</div></section>`;

      function renderSearchResults(result) {
        if (!result) return state.errors.search
          ? errorNotice(state.errors.search)
          : `<div class="muted small section-gap">Search spans events, tasks, decisions, and saved handoffs.</div>`;

          ...(result.events || []).map(item => ({ kind: "event", id: `#${item.seq}`, text: item.line })),

          ...(result.decisions || []).map(item => ({ kind: "decision", id: item.decision_id, text: `${item.title} · ${item.status}` })),

          }));

iv>${canManageRules ? `<div class="form-actions"><button class="button primary small" type="submit">Save rule changes</button></div>` : ""}</form></article>`).join("") : `<div class="bridge-panel">${empty(state.ruleFilter ? "No matching Core Rules" : "No Core Rules", state.ruleFilter ? "Change or clear the full-history search." : canManageRules ? "Create the first live workspace directive." : "No enabled rule applies to this panel identity.")}</div>`}</section>

            </div>
            ${pageToolbar("rules", response, "rules", "rules")}
