<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Attacca Control Room</title>
  <style>
    :root {
      --ink: #edf3ef;
      --muted: #8e9b95;
      --faint: #63706a;
      --bg: #090c0b;
      --panel: #101513;
      --panel-2: #151b18;
      --panel-3: #1b231f;
      --line: #26312c;
      --line-strong: #34433b;
      --green: #a5f2c2;
      --green-strong: #63d793;
      --amber: #f3c775;
      --red: #ff846d;
      --blue: #8fbaf8;
      --purple: #c8a9ff;
      --shadow: 0 24px 60px rgba(0, 0, 0, .32);
      --radius: 16px;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 82% -10%, rgba(99, 215, 147, .09), transparent 28rem),
        var(--bg);
      font: 14px/1.5 var(--sans);
    }

    button, input, textarea, select { font: inherit; }
    button, select { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    a { color: inherit; }

    :focus-visible {
      outline: 2px solid var(--green-strong);
      outline-offset: 2px;
    }

    .skip-link {
      position: fixed;
      left: 1rem;
      top: -5rem;
      z-index: 100;
      padding: .7rem 1rem;
      color: #07110b;
      background: var(--green);
      border-radius: 10px;
      font-weight: 750;
    }

    .skip-link:focus { top: 1rem; }

    .shell {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 24px 16px 18px;
      border-right: 1px solid var(--line);
      background: rgba(11, 15, 13, .94);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 8px 23px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      color: #07110b;
      background: var(--green);
      border-radius: 11px;
      font: 900 18px/1 var(--mono);
      box-shadow: 0 0 0 5px rgba(165, 242, 194, .06);
    }

    .brand strong { display: block; font-size: 16px; letter-spacing: -.02em; }
    .brand span { display: block; color: var(--faint); font: 10px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .12em; }

    .nav-label {
      margin: 5px 10px 8px;
      color: var(--faint);
      font: 10px/1 var(--mono);
      text-transform: uppercase;
      letter-spacing: .14em;
    }

    .nav {
      display: grid;
      gap: 3px;
    }

    .nav button {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 42px;
      padding: 0 11px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
      text-align: left;
      transition: color .15s, background .15s, border-color .15s;
    }

    .nav button:hover { color: var(--ink); background: rgba(255,255,255,.025); }
    .nav button.active { color: var(--ink); background: var(--panel-3); border-color: var(--line); }
    .nav .nav-icon { width: 18px; color: var(--faint); font: 13px/1 var(--mono); text-align: center; }
    .nav button.active .nav-icon { color: var(--green); }

    .sidebar-foot {
      margin-top: auto;
      padding: 14px 10px 2px;
      border-top: 1px solid var(--line);
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: var(--faint);
      box-shadow: 0 0 0 4px rgba(99,112,106,.1);
    }

    .dot.online { background: var(--green-strong); box-shadow: 0 0 0 4px rgba(99,215,147,.1); }
    .dot.offline { background: var(--red); box-shadow: 0 0 0 4px rgba(255,132,109,.1); }
    .identity-mini { margin-top: 9px; color: var(--faint); font: 11px/1.4 var(--mono); overflow: hidden; text-overflow: ellipsis; }

    .workspace {
      min-width: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
      padding: 12px clamp(18px, 3vw, 42px);
      border-bottom: 1px solid var(--line);
      background: rgba(9, 12, 11, .85);
      backdrop-filter: blur(18px);
    }

    .project-switcher { min-width: 0; }
    .eyebrow { color: var(--faint); font: 10px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .12em; }

    .project-switcher select {
      max-width: min(440px, 42vw);
      margin: 3px 0 0 -7px;
      padding: 3px 26px 3px 7px;
      border: 0;
      color: var(--ink);
      background: transparent;
      font-weight: 720;
      font-size: 16px;
    }

    .top-actions { display: flex; align-items: center; gap: 9px; }

    .icon-button, .button {
      min-height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      color: var(--ink);
      background: var(--panel-2);
      transition: transform .15s, border-color .15s, background .15s;
    }

    .icon-button:hover, .button:hover { border-color: #52665b; background: var(--panel-3); }
    .icon-button:active, .button:active { transform: translateY(1px); }
    .icon-button { width: 40px; padding: 0; font-size: 17px; }
    .button { padding: 0 14px; font-weight: 680; }
    .button.primary { color: #07110b; border-color: var(--green); background: var(--green); }
    .button.primary:hover { background: #bdffd3; }
    .button.danger { color: #ffd5ce; border-color: rgba(255,132,109,.35); background: rgba(255,132,109,.08); }
    .button.quiet { color: var(--muted); background: transparent; }
    .button.small { min-height: 32px; padding: 0 10px; border-radius: 8px; font-size: 12px; }

    main {
      width: min(1460px, 100%);
      margin: 0 auto;
      padding: 36px clamp(18px, 3vw, 42px) 70px;
    }

    .page-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .page-head h1 { margin: 5px 0 4px; font-size: clamp(25px, 3vw, 34px); line-height: 1.12; letter-spacing: -.035em; }
    .page-head p { max-width: 680px; margin: 0; color: var(--muted); }
    .page-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .grid { display: grid; gap: 16px; }
    .grid.metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.main-side { grid-template-columns: minmax(0, 1.65fr) minmax(290px, .85fr); }

    .card {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(255,255,255,.018), transparent 38%), var(--panel);
      box-shadow: 0 1px 0 rgba(255,255,255,.015) inset;
    }

    .card.pad { padding: 20px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 19px; border-bottom: 1px solid var(--line); }
    .card-head h2, .card-head h3 { margin: 0; font-size: 14px; letter-spacing: -.01em; }
    .card-body { padding: 18px 19px; }

    .metric { position: relative; min-height: 128px; padding: 18px; overflow: hidden; }
    .metric::after { content: ""; position: absolute; right: -23px; bottom: -35px; width: 100px; height: 100px; border: 1px solid var(--line); border-radius: 99px; opacity: .7; }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { margin-top: 12px; font: 650 30px/1 var(--mono); letter-spacing: -.06em; }
    .metric .sub { margin-top: 9px; color: var(--faint); font-size: 11px; }

    .section-gap { margin-top: 16px; }
    .stack { display: grid; gap: 11px; }
    .cluster { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

    .badge, .chip {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      min-height: 24px;
      padding: 2px 8px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.02);
      font: 10px/1.3 var(--mono);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .chip { text-transform: none; letter-spacing: 0; }
    .badge.queued { color: var(--blue); border-color: rgba(143,186,248,.27); background: rgba(143,186,248,.07); }
    .badge.claimed, .badge.accepted, .badge.approved, .badge.ok, .badge.fresh { color: var(--green); border-color: rgba(165,242,194,.27); background: rgba(165,242,194,.07); }
    .badge.review, .badge.in_review, .badge.proposed, .badge.medium { color: var(--amber); border-color: rgba(243,199,117,.27); background: rgba(243,199,117,.07); }
    .badge.blocked, .badge.changes_requested, .badge.rejected, .badge.high, .badge.cancelled, .badge.error, .badge.stale { color: var(--red); border-color: rgba(255,132,109,.27); background: rgba(255,132,109,.07); }
    .badge.done, .badge.draft, .badge.superseded, .badge.unknown { color: var(--muted); }
    .badge.low, .badge.chat, .badge.status { color: var(--blue); }
    .badge.directive, .badge.challenge, .badge.approval { color: var(--purple); }

    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .mono { font-family: var(--mono); }
    .small { font-size: 12px; }
    .prose { white-space: pre-wrap; overflow-wrap: anywhere; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .list { display: grid; }
    .list-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .list-row:first-child { padding-top: 0; }
    .list-row:last-child { padding-bottom: 0; border-bottom: 0; }
    .list-title { font-weight: 680; overflow-wrap: anywhere; }
    .list-meta { display: flex; flex-wrap: wrap; gap: 7px 12px; margin-top: 5px; color: var(--faint); font-size: 11px; }

    .task-card, .decision-card, .workspace-card { padding: 18px; }
    .task-top, .decision-top, .workspace-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .task-title, .decision-title, .workspace-title { margin: 0; font-size: 15px; line-height: 1.35; }
    .task-description, .decision-detail { margin: 10px 0 0; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
    .task-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 15px; padding-top: 14px; border-top: 1px solid var(--line); }
    .task-plan-panel { margin-top: 16px; padding: 18px; border: 1px solid rgba(143,186,248,.25); border-radius: 12px; background: rgba(143,186,248,.035); }
    .task-plan-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .task-plan-head h3 { margin: 6px 0 0; font-size: 18px; line-height: 1.35; }
    .task-plan-overview { margin-top: 15px; padding: 14px; border-left: 3px solid rgba(143,186,248,.45); color: var(--muted); background: rgba(0,0,0,.12); white-space: pre-wrap; overflow-wrap: anywhere; }
    .plan-sections { display: grid; gap: 12px; margin-top: 16px; }
    .plan-section { padding: 15px; border: 1px solid var(--line); border-radius: 10px; background: rgba(0,0,0,.12); }
    .plan-section h4 { margin: 0; font-size: 14px; }
    .plan-section-body { margin-top: 10px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
    .plan-review-history { display: grid; gap: 8px; margin-top: 16px; }
    .plan-review-row { padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: rgba(0,0,0,.1); }
    .plan-editor textarea[name="sections_markdown"] { min-height: 260px; font-family: var(--mono); font-size: 12px; }

    .workspace-card.selected { border-color: rgba(165,242,194,.5); box-shadow: 0 0 0 1px rgba(165,242,194,.08) inset; }
    .workspace-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
    .workspace-stat { padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.015); }
    .workspace-stat strong { display: block; font: 650 17px/1.3 var(--mono); }
    .workspace-stat span { color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }

    .bridge-panel { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.012); }
    .bridge-panel.targeted { border-color: rgba(165,242,194,.65); box-shadow: 0 0 0 2px rgba(165,242,194,.1); }
    .bridge-panel + .bridge-panel { margin-top: 12px; }
    .bridge-panel-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .bridge-panel-head h3 { margin: 0; font-size: 14px; }
    .bridge-relationship { padding: 13px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.012); }

    form { margin: 0; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .form-grid .wide { grid-column: 1 / -1; }
    .field { display: grid; gap: 6px; }
    .field label { color: var(--muted); font-size: 12px; font-weight: 650; }
    .field .help { color: var(--faint); font-size: 11px; }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      color: var(--ink);
      background: #0c100e;
    }

    input, select { min-height: 41px; padding: 8px 10px; }
    textarea { min-height: 94px; padding: 10px; line-height: 1.45; resize: vertical; }
    input[type="checkbox"], input[type="radio"] {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      min-height: 0;
      margin: 0;
      padding: 0;
      accent-color: var(--green-strong);
    }
    label.chip { gap: 6px; cursor: pointer; }
    input::placeholder, textarea::placeholder { color: #4d5a54; }
    input:hover, textarea:hover, select:hover { border-color: #46584f; }
    input:focus, textarea:focus, select:focus { border-color: var(--green-strong); box-shadow: 0 0 0 3px rgba(99,215,147,.08); outline: 0; }

    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
    .filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-bottom: 16px; }
    .filterbar input { flex: 1 1 230px; }
    .filterbar select { width: auto; min-width: 140px; }

    .room-feed, .history-feed {
      display: grid;
      align-content: start;
      gap: 12px;
      min-height: clamp(520px, 64vh, 760px);
      max-height: min(78vh, 940px);
      overflow: auto;
      padding: 2px 7px 2px 2px;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }
    .feed-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 9px 14px; margin-bottom: 12px; }
    .feed-pagination { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .feed-range { min-width: 150px; color: var(--faint); font: 10px/1.4 var(--mono); text-align: center; }
    .new-items { display: inline-flex; align-items: center; gap: 7px; color: var(--green); }
    .new-items[hidden] { display: none; }
    .message { padding: 14px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.015); }
    .message-head { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-bottom: 8px; }
    .message-actor { font-weight: 720; }
    .message-body { white-space: pre-wrap; overflow-wrap: anywhere; }
    .message-foot { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 9px; color: var(--faint); font: 10px/1.4 var(--mono); }

    .timeline { position: relative; display: grid; gap: 0; }
    .timeline::before { content: ""; position: absolute; left: 5px; top: 9px; bottom: 9px; width: 1px; background: var(--line); }
    .timeline-row { position: relative; padding: 0 0 17px 26px; }
    .timeline-row:last-child { padding-bottom: 0; }
    .timeline-row::before { content: ""; position: absolute; left: 1px; top: 7px; width: 9px; height: 9px; border: 2px solid var(--panel); border-radius: 99px; background: var(--green-strong); box-shadow: 0 0 0 1px var(--line-strong); }
    .timeline-at { color: var(--faint); font: 10px/1.3 var(--mono); }
    .timeline-line { margin-top: 4px; overflow-wrap: anywhere; }

    .event-row { border-bottom: 1px solid var(--line); }
    .event-row:last-child { border-bottom: 0; }
    .event-row summary { display: grid; grid-template-columns: 58px minmax(160px, .55fr) minmax(180px, 1fr) auto; gap: 12px; align-items: center; padding: 13px 0; cursor: pointer; list-style: none; }
    .event-row summary::-webkit-details-marker { display: none; }
    .event-payload { margin: 0 0 14px 70px; padding: 12px; overflow: auto; border: 1px solid var(--line); border-radius: 9px; color: #b8c5bf; background: #090c0b; font: 11px/1.55 var(--mono); white-space: pre-wrap; }

    .handoff-hero { padding: 24px; border-color: rgba(165,242,194,.18); background: linear-gradient(130deg, rgba(165,242,194,.055), transparent 50%), var(--panel); }
    .handoff-objective { margin: 10px 0 0; font-size: clamp(18px, 2vw, 23px); line-height: 1.4; letter-spacing: -.02em; }

    .notice { display: flex; gap: 11px; padding: 13px 14px; border: 1px solid rgba(243,199,117,.24); border-radius: 11px; color: #dbc8a3; background: rgba(243,199,117,.055); }
    .notice.error { color: #ffc1b6; border-color: rgba(255,132,109,.28); background: rgba(255,132,109,.06); }
    .notice.ok { color: #c6f8d8; border-color: rgba(99,215,147,.28); background: rgba(99,215,147,.06); }
    .notice strong { color: var(--ink); }

    .empty { display: grid; place-items: center; min-height: 190px; padding: 24px; color: var(--muted); text-align: center; }
    .empty-mark { width: 42px; height: 42px; margin: 0 auto 11px; border: 1px dashed var(--line-strong); border-radius: 12px; font: 17px/40px var(--mono); }
    .empty strong { display: block; margin-bottom: 4px; color: var(--ink); }

    .skeleton { position: relative; overflow: hidden; min-height: 120px; background: var(--panel); }
    .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.035), transparent); animation: shimmer 1.3s infinite; }
    @keyframes shimmer { to { transform: translateX(100%); } }

    .toast-region { position: fixed; z-index: 80; right: 22px; bottom: 22px; display: grid; gap: 8px; width: min(390px, calc(100vw - 32px)); pointer-events: none; }
    .toast { padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 11px; color: var(--ink); background: #19211d; box-shadow: var(--shadow); animation: toast-in .18s ease-out; }
    .toast.error { border-color: rgba(255,132,109,.45); background: #281714; }
    .toast.warning { border-color: rgba(243,199,117,.45); background: #2a2417; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

    .loading-line { position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 2px; opacity: 0; background: linear-gradient(90deg, transparent, var(--green), transparent); transform: translateX(-50%); transition: opacity .15s; }
    .loading-line.active { opacity: 1; animation: load-line 1s infinite ease-in-out; }
    @keyframes load-line { 50% { transform: translateX(50%); } }

    code { color: #c9e5d4; font-family: var(--mono); }
    pre.code-block { margin: 0; padding: 13px; overflow: auto; border: 1px solid var(--line); border-radius: 9px; color: #b8c5bf; background: #090c0b; font: 11px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }

    @media (max-width: 1050px) {
      .grid.metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid.main-side { grid-template-columns: 1fr; }
    }

    @media (max-width: 780px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { position: sticky; height: auto; padding: 10px 12px; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand { display: none; }
      .nav-label, .sidebar-foot { display: none; }
      .nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
      .nav::-webkit-scrollbar { display: none; }
      .nav button { flex: 0 0 auto; min-height: 38px; padding: 0 10px; font-size: 12px; }
      .nav .nav-icon { display: none; }
      .topbar { top: 59px; min-height: 62px; padding: 10px 16px; }
      .project-switcher select { max-width: 54vw; }
      main { padding: 26px 16px 55px; }
      .page-head { align-items: flex-start; flex-direction: column; }
      .grid.two, .form-grid { grid-template-columns: 1fr; }
      .form-grid .wide { grid-column: auto; }
      .room-feed, .history-feed { min-height: 56vh; max-height: 72vh; }
      .feed-toolbar, .feed-pagination { align-items: stretch; }
      .feed-pagination { width: 100%; }
      .feed-pagination .button { flex: 1 1 90px; }
      .feed-range { flex: 1 1 100%; order: -1; }
      .event-row summary { grid-template-columns: 48px minmax(0, 1fr) auto; }
      .event-row summary .event-actor { display: none; }
      .event-payload { margin-left: 0; }
    }

    @media (max-width: 480px) {
      .grid.metrics { grid-template-columns: 1fr; }
      .metric { min-height: 105px; }
      .top-actions .button { display: none; }
      .task-top, .decision-top, .workspace-top { flex-direction: column; }
      .list-row { grid-template-columns: 1fr; gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="loading-line" id="loading-line" aria-hidden="true"></div>
  <div class="shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div><strong>Attacca</strong><span>Control room</span></div>
      </div>
      <div class="nav-label">Manage</div>
      <nav class="nav" id="nav">
        <button type="button" data-view="overview"><span class="nav-icon">⌁</span>Overview</button>
        <button type="button" data-view="workspaces"><span class="nav-icon">◇</span>Workspaces</button>
        <button type="button" data-view="tasks"><span class="nav-icon">✓</span>Tasks</button>
        <button type="button" data-view="room"><span class="nav-icon">◌</span>Room / Inbox <span id="nav-unread" class="badge" hidden></span></button>
        <button type="button" data-view="rules"><span class="nav-icon">§</span>Core Rules <span id="nav-rules" class="badge">0</span></button>
        <button type="button" data-view="context"><span class="nav-icon">❑</span>Cloud Context</button>
        <button type="button" data-view="network"><span class="nav-icon">⇄</span>AI Network</button>
        <button type="button" data-view="decisions"><span class="nav-icon">⌘</span>Decisions</button>
        <button type="button" data-view="handoff"><span class="nav-icon">↗</span>Handoff</button>
        <button type="button" data-view="log"><span class="nav-icon">≋</span>Project Log</button>
        <button type="button" data-view="activity"><span class="nav-icon">∿</span>Activity</button>
        <button type="button" data-view="settings"><span class="nav-icon">⚙</span>Settings</button>
      </nav>
      <div class="sidebar-foot">
        <div class="connection"><span class="dot" id="server-dot"></span><span id="server-label">Checking server…</span></div>
        <div class="identity-mini" id="identity-mini">web.admin | Type: Human</div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="project-switcher">
          <div class="eyebrow">Active workspace</div>
          <select id="project-select" aria-label="Active workspace"><option value="">Loading…</option></select>
        </div>
        <div class="top-actions">
          <button class="button quiet" type="button" data-view="workspaces">New workspace</button>
          <button class="icon-button" id="refresh-button" type="button" title="Refresh data" aria-label="Refresh data">↻</button>
        </div>
      </header>

      <main id="content" tabindex="-1" aria-live="polite" aria-busy="true">
        <div class="page-head"><div><div class="eyebrow">Loading</div><h1>Opening the control room…</h1></div></div>
        <div class="grid metrics"><div class="card skeleton"></div><div class="card skeleton"></div><div class="card skeleton"></div><div class="card skeleton"></div></div>
      </main>
    </div>
  </div>

  <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const VIEWS = ["overview", "workspaces", "tasks", "room", "rules", "context", "network", "decisions", "handoff", "log", "activity", "settings"];
      const HANDOFF_FIELDS = ["objective", "what_changed", "active_work", "blockers", "risks", "next_actions", "notes"];
      const ROLE_SCOPE_NAMES = ["director", "advisor", "worker", "lead_director"];
      const BRIDGE_PARTICIPATION = [
        ["all", "All roles"],
        ["directors_advisors", "Directors + Advisors"],
        ["directors", "Directors only"],
        ["selected_agents", "Selected agents"]
      ];
      const RULE_SCOPES = ["everyone", "director", "advisor", "worker"];
      const DEFAULT_PREFS = { actor: "web.admin", actorType: "human", owner: "", autoRefresh: true, refreshSeconds: 15 };
      const PANEL_PAGE_SIZE = 60;
      const FILTER_DEBOUNCE_MS = 250;
      const NEWEST_EDGE_PX = 72;

      // TESTABLE_FEED_HELPERS:BEGIN
      function clampFeedPage(page, pageCount) {
        return Math.max(0, Math.min(Math.max(1, pageCount) - 1,
          Number.isFinite(Number(page)) ? Math.trunc(Number(page)) : 0));
      }

      function isNewestFeedPage(page, pageCount) {
        return clampFeedPage(page, pageCount) === Math.max(1, Number(pageCount) || 1) - 1;
      }

      function paginateFeed(rows, pageSize, requestedPage, followNewest = false) {
        const safeRows = Array.isArray(rows) ? rows : [];
        const size = Math.max(1, Math.trunc(Number(pageSize) || 1));
        const pageCount = Math.max(1, Math.ceil(safeRows.length / size));
        const page = followNewest ? pageCount - 1 : clampFeedPage(requestedPage, pageCount);
        const start = page * size;
        const end = Math.min(safeRows.length, start + size);
        return {
          rows: safeRows.slice(start, end),
          page,
          pageCount,
          total: safeRows.length,
          rangeStart: safeRows.length ? start + 1 : 0,
          rangeEnd: end
        };
      }

      function reduceFeedRefresh(current, newestSeq, addedCount, nearNewest) {
        const next = { ...current };
        if (typeof nearNewest === "boolean") next.followNewest = nearNewest;
        next.newestSeq = Math.max(Number(next.newestSeq) || 0, Number(newestSeq) || 0);
        if (next.followNewest) next.newCount = 0;
        else next.newCount = Math.max(0, Number(next.newCount) || 0) + Math.max(0, Number(addedCount) || 0);
        return next;
      }

      function shouldReplaceRender(previousKey, previousHtml, nextKey, nextHtml, force = false) {
        return Boolean(force || previousKey !== nextKey || previousHtml !== nextHtml);
      }
      // TESTABLE_FEED_HELPERS:END

      // TESTABLE_SORT_HELPERS:BEGIN
      function timestampMs(row, fields) {
        for (const field of fields || []) {
          const value = Date.parse(row?.[field]);
          if (Number.isFinite(value)) return value;
        }
        return null;
      }

      function naturalEntityId(left, right) {
        return String(left || "").localeCompare(String(right || ""), undefined,
          { numeric: true, sensitivity: "base" });
      }

      function sortDatedRows(rows, { direction = "newest", dateFields = ["updated_at", "created_at"], idFields = ["task_id", "decision_id", "project_id", "rule_id", "version"] } = {}) {
        const sign = direction === "oldest" ? 1 : -1;
        return [...(rows || [])].sort((left, right) => {
          const leftTime = timestampMs(left, dateFields);
          const rightTime = timestampMs(right, dateFields);
          if (leftTime == null && rightTime != null) return 1;
          if (rightTime == null && leftTime != null) return -1;
          if (leftTime != null && rightTime != null && leftTime !== rightTime) return sign * (leftTime - rightTime);
          const leftId = idFields.map(field => left?.[field]).find(value => value != null);
          const rightId = idFields.map(field => right?.[field]).find(value => value != null);
          return sign * naturalEntityId(leftId, rightId);
        });
      }
      // TESTABLE_SORT_HELPERS:END

      function newFeedState() {
        return { offset: 0, total: 0, hasMore: false, followNewest: true,
          newCount: 0, newestSeq: 0, scopeKey: "", resetPending: true };
      }

      function newListPage() { return { offset: 0 }; }

      function newTaskPlanState(taskId = "", overrides = {}) {
        return {
          taskId, data: null, error: "", loading: false, edit: false,
          selectedVersion: null, requestSerial: 0,
          revisionQuery: "", revisionFilter: "all", revisionOffset: 0,
          revisionSort: "newest",
          actionQuery: "", actionFilter: "all", actionOffset: 0,
          actionSort: "oldest",
          ...overrides
        };
      }

      function responseRows(response, key) {
        if (Array.isArray(response?.[key])) return response[key];
        return Array.isArray(response?.rows) ? response.rows : [];
      }

      function responsePage(response, key, fallbackOffset = 0) {
        const rows = responseRows(response, key);
        const pagination = response?.pagination || {};
        const number = (value, fallback) => Number.isFinite(Number(value))
          ? Number(value) : fallback;
        const total = number(response?.total, number(pagination.total, rows.length));
        const unfilteredTotal = number(response?.unfiltered_total,
          number(pagination.unfiltered_total, total));
        const limit = Math.max(1, number(response?.limit,
          number(pagination.limit, PANEL_PAGE_SIZE)));
        const offset = Math.max(0, number(response?.offset,
          number(pagination.offset, fallbackOffset)));
        const hasMore = typeof response?.has_more === "boolean" ? response.has_more
          : typeof pagination.has_more === "boolean" ? pagination.has_more
          : offset + rows.length < total;
        return { rows, total, unfilteredTotal, limit, offset, hasMore,
          rangeStart: rows.length ? offset + 1 : 0,
          rangeEnd: rows.length ? offset + rows.length : 0 };
      }

      function listPage(view) {
        if (!state.listPages[view]) state.listPages[view] = newListPage();
        return state.listPages[view];
      }

      function resetListPage(view) { listPage(view).offset = 0; }

      function resetProjectPages() {
        ["tasks", "decisions", "rules", "agents", "bridges", "sharedHandoff",
          "handoff", "roleScopeHistory", "log", "search"].forEach(resetListPage);
      }

      function listQuery(view, extra = {}) {
        const params = new URLSearchParams({
          limit: String(PANEL_PAGE_SIZE),
          offset: String(Math.max(0, listPage(view).offset || 0)),
          sort: sortDirection(view),
        });
        Object.entries(extra).forEach(([key, value]) => {
          if (value !== undefined && value !== null && String(value) !== "") {
            params.set(key, String(value));
          }
        });
        return `?${params.toString()}`;
      }

      function feedQuery(kind, extra = {}) {
        const feed = state[`${kind}Feed`] || newFeedState();
        const params = new URLSearchParams({
          limit: String(PANEL_PAGE_SIZE),
          offset: String(Math.max(0, feed.offset || 0)),
          sort: "newest",
        });
        if (Number(feed.newestSeq) > 0) {
          params.set("known_latest_seq", String(Number(feed.newestSeq)));
        }
        Object.entries(extra).forEach(([key, value]) => {
          if (value !== undefined && value !== null && String(value) !== "") {
            params.set(key, String(value));
          }
        });
        return `?${params.toString()}`;
      }

      function pageToolbar(view, response, key, noun) {
        const page = responsePage(response, key, listPage(view).offset);
        listPage(view).offset = page.offset;
        const shown = page.total === page.unfilteredTotal
          ? `${page.total} ${noun}`
          : `${page.total} matching of ${page.unfilteredTotal} ${noun}`;
        const range = page.rows.length
          ? `${page.rangeStart}–${page.rangeEnd} of ${page.total}`
          : page.offset > 0 && page.total > 0
          ? `No results at offset ${page.offset} · ${page.total} total`
          : `0 of ${page.total}`;
        return `<div class="feed-toolbar"><div class="feed-pagination" role="navigation" aria-label="${h(identityPart(noun))} pages"><button class="button quiet small" type="button" data-action="list-previous" data-list-page="${h(view)}" ${page.offset <= 0 ? "disabled" : ""}>Previous</button><span class="feed-range">${h(range)}</span><button class="button quiet small" type="button" data-action="list-next" data-list-page="${h(view)}" ${page.hasMore ? "" : "disabled"}>Next</button></div><span class="faint small">${h(shown)} · ${h(page.limit)} per page</span></div>`;
      }

      // Some privacy modes and embedded/forwarded browser surfaces expose
      // localStorage but throw as soon as it is accessed. A preference cache
      // must never prevent the control room from booting.
      function storageGet(key, fallback = "") {
        try { return localStorage.getItem(key) ?? fallback; }
        catch (_) { return fallback; }
      }

      function storageSet(key, value) {
        try { localStorage.setItem(key, value); return true; }
        catch (_) { return false; }
      }

      function readListSorts() {
        try {
          const parsed = JSON.parse(storageGet("attacca.admin.sorts", "{}"));
          return Object.fromEntries(Object.entries(parsed || {}).filter(([, value]) => ["newest", "oldest"].includes(value)));
        } catch (_) { return {}; }
      }

      function sortDirection(view) { return state.listSort[view] || "newest"; }
      function sortControl(view) {
        return `<label class="cluster small" for="sort-${h(view)}"><span class="faint">Sort by date</span><select id="sort-${h(view)}" data-list-sort="${h(view)}" aria-label="Sort ${h(view)} by date"><option value="newest" ${sortDirection(view) === "newest" ? "selected" : ""}>Newest first</option><option value="oldest" ${sortDirection(view) === "oldest" ? "selected" : ""}>Oldest first</option></select></label>`;
      }

      // The client opens Settings with one opaque authorization request in the
      // fragment. Consume it into memory and erase it before any API request.
      // TESTABLE_CLIENT_AUTHORIZATION_HINTS:BEGIN
      function clientAuthorizationHintsFromLocation() {
        try {
          const raw = String(location.hash || "").replace(/^#/, "");
          const [view, ...parts] = raw.split("&");
          if (view !== "settings") return { authorizationRequest: "" };
          const params = new URLSearchParams(parts.join("&"));
          const candidate = params.get("authorization_request") || "";
          params.delete("authorization_request");
          const safe = candidate.length === 43 && [...candidate].every(char =>
            (char >= "A" && char <= "Z") ||
            (char >= "a" && char <= "z") ||
            (char >= "0" && char <= "9") || char === "-" || char === "_");
          if (typeof history !== "undefined" && history.replaceState) {
            const remainder = params.toString();
            history.replaceState(null, "", `#settings${remainder ? `&${remainder}` : ""}`);
          }
          return { authorizationRequest: safe ? candidate : "" };
        } catch (_) { return { authorizationRequest: "" }; }
      }
      // TESTABLE_CLIENT_AUTHORIZATION_HINTS:END

      // Invitation secrets stay in the URL fragment so they are never sent
      // to the HTTP server, access logs, or referrers. Consume and erase the
      // secret immediately; only in-memory state retains it for acceptance.
      // TESTABLE_INVITATION_URL_HELPERS:BEGIN
      function viewFromLocationHash() {
        const view = location.hash.slice(1).split("&", 1)[0];
        return VIEWS.includes(view) ? view : "overview";
      }

      function consumeInvitationTokenFromLocation() {
        let token = "";
        try {
          const url = new URL(location.href);
          const rawHash = String(url.hash || "").replace(/^#/, "");
          const [view, ...parts] = rawHash.split("&");
          const params = new URLSearchParams(parts.join("&"));
          const candidate = params.get("invitation_token") || "";
          if (view === "settings" &&
              /^ati_[a-z0-9_-]{3,128}\.[a-z0-9_-]{16,256}$/i.test(candidate)) token = candidate;
          let scrubbed = false;
          if (params.has("invitation_token")) {
            params.delete("invitation_token");
            scrubbed = true;
          }
          // Query-carried invitation secrets are never accepted. Erase them
          // anyway so an unsafe hand-built link cannot keep leaking it.
          if (url.searchParams.has("invitation_token")) {
            url.searchParams.delete("invitation_token");
            scrubbed = true;
          }
          if (scrubbed) {
            const query = url.searchParams.toString();
            const remainder = params.toString();
            history.replaceState(null, "", `${url.pathname}${query ? `?${query}` : ""}#${view || "settings"}${remainder ? `&${remainder}` : ""}`);
          }
        } catch (_) { /* malformed or unavailable URL state is ignored */ }
        return token;
      }

      function invitationAcceptanceLink(verificationUri, invitationToken) {
        const token = String(invitationToken || "");
        if (!/^ati_[a-z0-9_-]{3,128}\.[a-z0-9_-]{16,256}$/i.test(token)) return "";
        const url = new URL(verificationUri || "/app#settings", location.origin);
        if (url.origin !== location.origin || url.pathname !== "/app") return "";
        url.hash = `settings&invitation_token=${encodeURIComponent(token)}`;
        return url.toString();
      }
      // TESTABLE_INVITATION_URL_HELPERS:END

      const state = {
        view: viewFromLocationHash(),
        auth: null,
        credentialAccess: null,
        oneTimeCredential: null,
        clientAuthorization: clientAuthorizationHintsFromLocation(),
        pendingClientAuthorization: null,
        pendingClientAuthorizationError: "",
        pendingInvitationToken: consumeInvitationTokenFromLocation(),
        invitationAcceptanceError: "",
        authMode: "sign-in",
        authTokens: [],
        health: null,
        serverSettings: null,
        projects: [],
        workspaceAgents: {},
        workspaceAgentErrors: {},
        workspaceMembers: null,
        workspaceMembersError: "",
        projectId: storageGet("attacca.admin.project"),
        data: {},
        errors: {},
        loading: true,
        workspaceSearch: "",
        taskFilter: "active",
        taskSearch: "",
        taskPlan: newTaskPlanState(),
        roomConversation: "local",
        roomFilter: "",
        bulkDisposeBefore: "",
        activityFilter: "",
        ruleFilter: "",
        decisionFilter: "",
        decisionSearch: "",
        agentSearch: "",
        bridgeSearch: "",
        sharedHandoffSearch: "",
        handoffSearch: "",
        handoffActor: "",
        roleScopeRole: "",
        roleScopeHistorySearch: "",
        logSearch: "",
        clientKeySearch: "",
        listSort: readListSorts(),
        listPages: {
          workspaces: newListPage(), tasks: newListPage(), decisions: newListPage(),
          rules: newListPage(), agents: newListPage(), bridges: newListPage(),
          sharedHandoff: newListPage(), handoff: newListPage(),
          roleScopeHistory: newListPage(),
          log: newListPage(), search: newListPage(),
          clientKeys: newListPage()
        },
        roomFeed: newFeedState(),
        activityFeed: newFeedState(),
        searchQuery: "",
        searchResults: null,
        prefs: readPrefs(),
        poller: null,
        authRecovery: null,
        filterTimer: null,
        restoreFocus: null,
        loadSerial: 0,
        requestSerials: { workspaces: 0, search: 0, clientKeys: 0 },
        renderedKey: null,
        renderedHtml: null,
        renderContext: null
      };

      const $ = (selector, root = document) => root.querySelector(selector);
      const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
      const content = $("#content");

      // TESTABLE_EMPTY_CREDENTIAL_ACCESS:BEGIN
      function emptyCredentialAccess() {
        return {
          supported: false,
          capabilities: { client_keys: false, activation: false },
          client_keys: [], total: 0, unfiltered_total: 0,
          limit: 60, offset: 0, has_more: false
        };
      }
      // TESTABLE_EMPTY_CREDENTIAL_ACCESS:END

      function readPrefs() {
        try { return { ...DEFAULT_PREFS, ...JSON.parse(storageGet("attacca.admin.prefs", "{}")) }; }
        catch (_) { return { ...DEFAULT_PREFS }; }
      }

      function savePrefs() {
        storageSet("attacca.admin.prefs", JSON.stringify(state.prefs));
        $("#identity-mini").textContent = identitySummary(
          state.prefs.actor, state.prefs.actorType, state.prefs.owner);
        startPoller();
      }

      function h(value) {
        return String(value ?? "").replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
      }

      function identityPart(value) {
        const known = { director: "Director", advisor: "Advisor", worker: "Worker", human: "Human", agent: "Agent", tool: "Tool", system: "System", codex: "Codex", claude: "Claude", kimi: "Kimi", vscode: "VS Code", web: "Web" };
        const raw = String(value || "Unknown");
        if (known[raw.toLowerCase()]) return known[raw.toLowerCase()];
        return raw.replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim().replace(/(^|\s)([a-z])/g, (_, gap, letter) => gap + letter.toUpperCase());
      }

      function projectName(projectId) {
        const id = String(projectId || "");
        return state.projects.find(project => project.project_id === id)?.name || id || "Unknown workspace";
      }

      // TESTABLE_NAMED_IDENTITY_HELPERS:BEGIN
      function agentPersonaName(agent) {
        if (!agent) return "";
        const explicit = agent.persona_name || agent.identity?.persona_name;
        if (explicit) return String(explicit);
        const raw = String(agent.operational_actor_id || agent.agent_id || "");
        const parts = raw.split(".");
        const roles = new Set(["director", "advisor", "worker", "unassigned"]);
        return parts.length >= 4 && roles.has(parts[parts.length - 3])
          ? identityPart(parts[parts.length - 1]) : "";
      }

      function agentShortName(agent) {
        if (!agent) return "";
        const explicit = agent.short_name || agent.identity?.short_name;
        if (explicit) return String(explicit).startsWith("@") ? String(explicit) : `@${explicit}`;
        const name = agentPersonaName(agent);
        return name ? `@${name}` : "";
      }

      function agentFriendlyName(agent) {
        return agentPersonaName(agent) || "Existing compatibility identity";
      }

      function agentDisplayDescription(agent) {
        const display = String(agent?.display_name || "").trim();
        if (!display) return "";
        const rawIds = new Set([
          String(agent?.agent_id || "").trim(),
          String(agent?.operational_actor_id || "").trim()
        ].filter(Boolean).map(value => value.toLowerCase()));
        return rawIds.has(display.toLowerCase()) ? "" : display;
      }

      function agentChoiceLabel(agent) {
        const name = agentFriendlyName(agent);
        const address = agentShortName(agent);
        return [name, address,
          agent.role ? identityPart(agent.role) : "",
          agent.runtime ? identityPart(agent.runtime) : ""]
          .filter(Boolean).join(" · ");
      }
      // TESTABLE_NAMED_IDENTITY_HELPERS:END

      function actorDisplay(actorId) {
        const raw = String(actorId || "unknown");
        const registered = (state.data.agentOptions?.agents ||
          state.data.agents?.agents || state.workspaceAgents?.[state.projectId] || [])
          .find(agent => agent.agent_id === raw || agent.operational_actor_id === raw);
        if (registered?.operational_actor_id && registered.operational_actor_id !== raw) {
          return actorDisplay(registered.operational_actor_id);
        }
        const registeredAddress = agentShortName(registered);
        if (registeredAddress) return registeredAddress;
        const parts = raw.split(".");
        const roles = new Set(["director", "advisor", "worker", "unassigned", "human", "tool", "system"]);
        const personaIdentity = parts.length >= 4 && roles.has(parts[parts.length - 3]);
        if ((parts.length >= 3 && roles.has(parts[parts.length - 2])) || personaIdentity) {
          const persona = personaIdentity ? parts.pop() : null;
          const runtime = parts.pop();
          const role = parts.pop();
          const workspaceId = parts.join(".");
          const workspace = state.projects.find(project => project.project_id === workspaceId)?.name || workspaceId;
          if (persona) return `@${identityPart(persona)}`;
          return [workspace, role, runtime].filter(Boolean).map(identityPart).join(" · ");
        }
        const lower = raw.toLowerCase();
        const runtime = ["claude", "codex", "kimi", "cline", "cursor", "windsurf", "gemini", "vscode", "opencode", "glm"].find(name => lower.includes(name));
        if (!runtime) return raw;
        const hintedRole = ["director", "advisor", "worker"].find(role => lower.includes(role));
        return [projectName(state.projectId), registered?.role || hintedRole || "unassigned", runtime].map(identityPart).join(" · ");
      }

      function identitySummary(actorId, actorType, owner) {
        return attributionText(actorId, actorType, owner);
      }

      function ownerChip(owner) {
        return `<span class="chip">Run by user: ${h(owner || "not recorded")}</span>`;
      }

      function attributionText(actorId, actorType, owner, projection = null) {
        const type = String(projection?.actor_type || actorType || "agent").toLowerCase();
        const actor = projection?.actor_id || actorId || "unknown";
        if (type === "human") {
          const raw = projection?.human_user || owner || String(actorId || actor).split(".").pop() || "unknown";
          return `Human user: ${identityPart(raw)}`;
        }
        const runBy = projection?.run_by_user ?? owner ?? "not recorded";
        return `AI: ${actorDisplay(actor)} · Run by user: ${runBy}`;
      }

      function taskClaimantText(task) {
        const attribution = task.attribution || {};
        const claimant = attribution.current_claimant || [...(task.actions || [])].reverse().find(action =>
          task.claimed_by && [action.operational_actor_id, action.actor_id].includes(task.claimed_by));
        if (claimant) {

      function planSectionsToMarkdown(sections = []) {
        return sections.map(section =>
          `## ${section.title} [${section.section_id}]\n${section.body}`).join("\n\n");
      }

      function parsePlanSectionsMarkdown(value) {
        const lines = String(value || "").replace(/\r\n?/g, "\n").split("\n");
        const sections = [];
        let current = null;
        const used = new Set();
        const finish = () => {
          if (!current) return;
          const body = current.lines.join("\n").trim();
          if (!body) throw new Error(`Plan section ${current.section_id} needs detailed content.`);
          sections.push({ section_id: current.section_id, title: current.title, body });
        };
        lines.forEach(line => {
          const heading = line.match(/^##\s+(.+?)(?:\s+\[([A-Za-z0-9._-]+)\])?\s*$/);
          if (!heading) {
            if (!current && line.trim()) throw new Error("Start each plan section with ## Heading [stable-id].");
            if (current) current.lines.push(line);
            return;
          }
          finish();
          const title = heading[1].trim();
          let sectionId = heading[2] || title.toLowerCase().replace(/[^a-z0-9._-]+/g, "-").replace(/^-+|-+$/g, "") || `section-${sections.length + 1}`;
          const base = sectionId;
          let suffix = 2;
          while (used.has(sectionId)) sectionId = `${base}-${suffix++}`;
          used.add(sectionId);
          current = { section_id: sectionId, title, lines: [] };
        });
        finish();
        if (!sections.length) throw new Error("Add at least one detailed ## plan section.");
        return sections;
      }

      function fmtTime(value, withDate = true) {
        if (!value) return "—";
        const date = new Date(value);
        if (Number.isNaN(date.valueOf())) return h(value);
        return new Intl.DateTimeFormat(undefined, withDate ? { dateStyle: "medium", timeStyle: "short" } : { timeStyle: "short" }).format(date);
      }
      function relativeTime(value) {
        if (!value) return "never";
        if (typeof Intl.RelativeTimeFormat !== "function") return fmtTime(value);
        const seconds = Math.round((new Date(value).valueOf() - Date.now()) / 1000);
        const ranges = [[60, "second"], [60, "minute"], [24, "hour"], [7, "day"], [4.345, "week"], [12, "month"], [Infinity, "year"]];
        let amount = seconds;
        for (const [divisor, unit] of ranges) {
          if (Math.abs(amount) < divisor) return new Intl.RelativeTimeFormat(undefined, { numeric: "auto" }).format(Math.round(amount), unit);
          amount /= divisor;
        }
        return fmtTime(value);
      }

      const API_TIMEOUT_MS = 15000;

      async function api(path, options = {}) {
        const headers = { "Accept": "application/json", "X-Attacca-Actor": state.prefs.actor, "X-Attacca-Actor-Type": state.prefs.actorType };
        if (state.prefs.owner) headers["X-Attacca-Owner"] = state.prefs.owner;
        if (options.body !== undefined) headers["Content-Type"] = "application/json";
        const method = (options.method || "GET").toUpperCase();
        if (!["GET", "HEAD", "OPTIONS"].includes(method) && state.auth?.csrf_token) {
          headers["X-Attacca-CSRF"] = state.auth.csrf_token;
        }
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), options.timeoutMs || API_TIMEOUT_MS);
        try {
          const response = await fetch(path, { method, headers, credentials: "same-origin", body: options.body === undefined ? undefined : JSON.stringify(options.body), signal: controller.signal });
          const raw = await response.text();
          let payload = null;
          try { payload = raw ? JSON.parse(raw) : {}; }
          catch (_) { payload = { error: raw || `HTTP ${response.status}` }; }
          if (!response.ok) {
            if (response.status === 401 && !path.startsWith("/v1/auth/")) {
              await recoverExpiredAuthentication();
            }
            const failure = new Error(payload.error || `HTTP ${response.status}`);
            failure.status = response.status;
            throw failure;
          }
          return payload;
        } catch (error) {
          if (controller.signal.aborted) throw new Error(`Timed out loading ${path}`);
          throw error;
        } finally {
          clearTimeout(timer);
        }
      }

      // TESTABLE_CREDENTIAL_ACCESS_HELPERS:BEGIN
      function normalizeCredentialAccess(payload) {
        const fallback = emptyCredentialAccess();
        const source = payload && typeof payload === "object" ? payload : {};
        const keys = Array.isArray(source.client_keys) ? source.client_keys : [];
        return {
          ...source,
          supported: Array.isArray(source.client_keys),
          capabilities: {
            ...fallback.capabilities,
            client_keys: Array.isArray(source.client_keys),
            activation: true
          },
          client_keys: keys,
          total: Number.isFinite(Number(source.total)) ? Number(source.total) : keys.length,
          unfiltered_total: Number.isFinite(Number(source.unfiltered_total))
            ? Number(source.unfiltered_total) : Number.isFinite(Number(source.total))
            ? Number(source.total) : keys.length,
          limit: Number.isFinite(Number(source.limit)) ? Number(source.limit) : 60,
          offset: Number.isFinite(Number(source.offset)) ? Number(source.offset) : 0,
          has_more: typeof source.has_more === "boolean" ? source.has_more : false
        };
      }

      function activationEligibility(access, account) {
        const isOwner = account?.is_owner === true;
        const activationSupported = access?.capabilities?.activation === true;
        const enabled = state.auth?.authentication_required === true ||
          state.auth?.authentication_activated === true;
        const reasons = [];
        if (!isOwner) reasons.push("Only the server owner can change authentication enforcement.");
        if (!activationSupported) reasons.push("This server does not expose the authentication toggle.");
        return {
          allowed: isOwner && activationSupported,
          isOwner, activationSupported, enabled, reasons
        };
      }

      function credentialMemberships(record) {
        const memberships = record?.project_memberships ?? record?.workspace_memberships ?? record?.project_ids ?? [];
        const explicit = (Array.isArray(memberships) ? memberships : [memberships])
          .map(item => typeof item === "string" ? item : item?.project_id)
          .filter(Boolean);
        return [...new Set(explicit)];
      }

      async function loadCredentialAccess() {
        if (!state.auth?.authenticated) return emptyCredentialAccess();
        try {
          return normalizeCredentialAccess(await api(
            `/v1/auth/client-keys${listQuery("clientKeys", { q: state.clientKeySearch })}`));

      async function loadPendingClientAuthorization() {
        const authorizationRequest = state.clientAuthorization?.authorizationRequest || "";
        state.pendingClientAuthorization = null;
        state.pendingClientAuthorizationError = "";
        if (!state.auth?.authenticated || !authorizationRequest) return;
        try {

            });

        const entries = await Promise.all((projects || []).map(async project => {

      async function recoverExpiredAuthentication() {
        if (state.authRecovery) return state.authRecovery;
        state.authRecovery = (async () => {
          clearInterval(state.poller);
          state.projects = [];
          state.workspaceAgents = {};
          state.workspaceAgentErrors = {};
          state.projectId = "";
          state.data = {};
          state.errors = {};
          state.handoffActor = "";
          state.roleScopeRole = "";
          state.credentialAccess = null;
          state.oneTimeCredential = null;
          state.authTokens = [];
          try {
            const response = await fetch("/v1/auth/status", {
              method: "GET", headers: { "Accept": "application/json" },
              credentials: "same-origin"
            });
            state.auth = response.ok ? await response.json() : {
              authentication_required: true, bootstrap_required: false,
              authenticated: false, user: null, csrf_token: null
            };
          } catch (_) {
            state.auth = { authentication_required: true,
              bootstrap_required: false, authenticated: false,
              user: null, csrf_token: null };
          }
          updateChrome();
          renderAuth();

        try { return await state.authRecovery; }
        finally { state.authRecovery = null; }

      async function downloadProjectExport(format) {
        if (!state.projectId) throw new Error("Choose a workspace before downloading its data.");
        const headers = { "Accept": "application/octet-stream", "X-Attacca-Actor": state.prefs.actor, "X-Attacca-Actor-Type": state.prefs.actorType };
        if (state.prefs.owner) headers["X-Attacca-Owner"] = state.prefs.owner;
        const endpoint = pathFor(`/export?format=${encodeURIComponent(format)}`);
        const response = await fetch(endpoint, { method: "GET", headers, credentials: "same-origin" });
        if (!response.ok) {
          const raw = await response.text();
          let message = raw || `HTTP ${response.status}`;
          try { message = JSON.parse(raw).error || message; } catch (_) { /* plain error body */ }
          if (response.status === 401) await recoverExpiredAuthentication();
          const failure = new Error(message);
          failure.status = response.status;
          throw failure;
        }
        const blob = await response.blob();
        const disposition = response.headers.get("Content-Disposition") || "";
        const match = disposition.match(/filename="?([^";]+)"?/i);
        const fallback = `attacca-${state.projectId}-${format === "zip" ? "export.zip" : format === "json" ? "export.json" : format}`;
        const filename = match?.[1] || fallback;
        const objectUrl = URL.createObjectURL(blob);
        try {
          const link = document.createElement("a");
          link.href = objectUrl;
          link.download = filename;
          link.hidden = true;
          document.body.append(link);
          link.click();
          link.remove();
        } finally {
          setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
        }
        return filename;
      }

        const matched = bulkDisposeMatchCount(before);
        return `<section class="card section-gap" id="pending-dispositions"><div class="card-head"><div><h2>Pending assignments</h2><span class="faint small">${h(total)} addressed message${total === 1 ? "" : "s"} still need an explicit outcome from ${h(attributionText(state.prefs.actor, state.prefs.actorType, state.prefs.owner))}</span></div>${inbox.disposition_baseline_seq ? `<span class="badge">reconciled through #${h(inbox.disposition_baseline_seq)}</span>` : ""}</div><div class="card-body">
          <div class="stack">${pending.slice(0, 20).map(item => `<div class="plan-review-row"><div class="cluster"><span>#${h(item.seq)}</span><strong>${h(actorDisplay(item.actor))}</strong>${statusBadge(item.msg_type)}${dispositionChip(item)}<span class="faint small">${h(fmtTime(item.at))}</span></div><div class="prose small section-gap">${h(String(item.body || "").slice(0, 220))}</div></div>`).join("")}</div>
          <form data-form="bulk-dispose" class="section-gap">
            <div class="form-grid"><div class="field"><label for="bulk-dispose-before">Resolve all before #N</label><input id="bulk-dispose-before" name="before_seq" type="number" min="1" value="${h(before)}"><span class="help">Every pending message at or below this event number is resolved, and your reconciliation baseline moves to it.</span></div><div class="field"><label for="bulk-dispose-disposition">Outcome</label><select id="bulk-dispose-disposition" name="disposition">${["acknowledged", "not_actionable", "deferred"].map(option => `<option value="${option}">${dispositionLabel(option)}</option>`).join("")}</select><span class="help">claimed and completed stay per-message because both must name a task.</span></div></div>
            <div class="field section-gap"><label for="bulk-dispose-note">Note</label><textarea id="bulk-dispose-note" name="note" required placeholder="Why is this batch being resolved?"></textarea><span class="help">A note is mandatory: the ledger records one bulk event naming every message closed.</span></div>
            <div class="form-actions"><span class="faint small" id="bulk-dispose-preview">${h(matched)} of ${h(pending.length)} pending messages match #${h(before)}</span><button class="button primary" id="bulk-dispose-submit" type="submit">Resolve all before #${h(before)}…</button></div>
          </form>
        </div></section>`;
      }
      function inboxUnreadTotal(inbox = {}) {
        if (Number.isFinite(Number(inbox.unread_total))) return Number(inbox.unread_total);
        const messages = (inbox.messages || []).length;
        return inbox.messages_include_all_visible
          ? messages
          : messages + Number(inbox.unread_broadcasts || 0);
      }

      function updateChrome() {
        $$("[data-view]").forEach(button => button.classList.toggle("active", button.dataset.view === state.view && button.closest("#nav")));
        const select = $("#project-select");
        select.innerHTML = state.projects.length
          ? state.projects.map(project => `<option value="${h(project.project_id)}" ${project.project_id === state.projectId ? "selected" : ""}>${h(project.name || project.project_id)} · ${h(project.project_id)}</option>`).join("")
          : `<option value="">No workspaces yet</option>`;
        select.disabled = !state.auth?.authenticated || !state.projects.length;
        const account = state.auth?.user;
        $("#identity-mini").textContent = account
          ? `Signed in: @${account.username}`
          : "Authentication required";
        $$("[data-view]").forEach(button => { button.disabled = !state.auth?.authenticated; });
        const dot = $("#server-dot");
        dot.className = `dot ${state.health?.ok ? "online" : state.health ? "offline" : ""}`;
        $("#server-label").textContent = state.health?.ok ? `Server ${state.health.version}` : state.health ? "Server unavailable" : "Checking server…";
        const unread = inboxUnreadTotal(state.data.inbox || {});
        const unreadBadge = $("#nav-unread");
        unreadBadge.hidden = !unread;
        unreadBadge.textContent = unread ? Number(unread).toLocaleString() : "";
        const ruleBadge = $("#nav-rules");
        const ruleResponse = state.data.rules || {};
        const rules = ruleResponse.rules || [];
        const enabledRules = rules.filter(rule => rule.enabled).length;
        const rulePage = responsePage(ruleResponse, "rules", listPage("rules").offset);
        const ruleTotal = rulePage.unfilteredTotal;
        const enabledTotal = Number.isFinite(Number(ruleResponse.enabled_total))
          ? Number(ruleResponse.enabled_total) : enabledRules;
        ruleBadge.textContent = Number(ruleTotal).toLocaleString();
        ruleBadge.title = `${enabledTotal} enabled of ${ruleTotal} workspace rules`;
      }

      function renderAuth() {
        const acceptingInvitation = Boolean(state.pendingInvitationToken);
        const bootstrapRequired = Boolean(state.auth?.bootstrap_required);
        // Self-registration is a server setting the panel only mirrors. The
        // register route re-checks it, so a stale page can never create an
        // account on a server that has closed sign-up. Invitation acceptance
        // and first-run bootstrap keep priority over it.
        const registrationOpen = !acceptingInvitation && !bootstrapRequired &&
          state.auth?.self_registration === "open";
        const creatingAccount = registrationOpen && state.authMode === "register";
        const title = acceptingInvitation ? "Accept your Attacca invitation"
          : bootstrapRequired ? "Create the first administrator"
          : creatingAccount ? "Create your Attacca account" : "Sign in to Attacca";
        const description = acceptingInvitation
          ? "Create your own human account from this one-time invitation. Its workspace and administrator scope cannot be widened here."
          : bootstrapRequired
          ? "Create the human control account first. Authentication enforcement remains off until the server owner enables it in Settings."
          : creatingAccount
          ? "Create your own human account on this server. A new account starts with no workspace access: an administrator grants it, or you create your own workspace."
          : "Use your Attacca account to open the hosted control room.";
        const form = acceptingInvitation
          ? `<form data-form="accept-human-invitation"><div class="form-grid"><div class="field"><label for="invite-accept-username">Account name</label><input id="invite-accept-username" name="username" autocomplete="username" minlength="2" maxlength="64" pattern="[a-z0-9][a-z0-9._-]+" required autofocus><span class="help">This immutable name is used for login and audit attribution.</span></div><div class="field"><label for="invite-accept-password">Create password</label><input id="invite-accept-password" name="password" type="password" autocomplete="new-password" minlength="8" required><span class="help">The invitation token remains only in this page's memory and is submitted once over the same-origin API.</span></div></div><div class="form-actions"><button class="button quiet" type="button" data-action="dismiss-invitation-acceptance">Cancel</button><button class="button primary" type="submit">Accept invitation and sign in</button></div></form>`
          : bootstrapRequired
          ? `<form data-form="auth-bootstrap"><div class="form-grid"><div class="field"><label for="auth-username">Account name</label><input id="auth-username" name="username" autocomplete="username" minlength="2" maxlength="64" pattern="[a-z0-9][a-z0-9._-]+" required><span class="help">This immutable name is used for login and audit attribution.</span></div><div class="field"><label for="auth-password">Password</label><input id="auth-password" name="password" type="password" autocomplete="new-password" minlength="8" required><span class="help">At least 8 characters. The prototype stores a salted password hash, never this plaintext value.</span></div></div><div class="form-actions"><button class="button primary" type="submit">Create administrator and sign in</button></div></form>`
          : creatingAccount
          ? `<form data-form="auth-register"><div class="form-grid"><div class="field"><label for="auth-username">Account name</label><input id="auth-username" name="username" autocomplete="username" minlength="2" maxlength="64" pattern="[a-z0-9][a-z0-9._-]+" required autofocus><span class="help">This immutable name is used for login and audit attribution.</span></div><div class="field"><label for="auth-password">Password</label><input id="auth-password" name="password" type="password" autocomplete="new-password" minlength="8" required><span class="help">At least 8 characters. The prototype stores a salted password hash, never this plaintext value.</span></div><div class="field"><label for="auth-password-confirm">Confirm password</label><input id="auth-password-confirm" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required></div></div><div class="form-actions"><button class="button quiet" type="button" data-action="dismiss-account-registration">Back to sign in</button><button class="button primary" type="submit">Create account and sign in</button></div></form>`
          : `<form data-form="auth-login"><div class="form-grid"><div class="field"><label for="auth-username">Username</label><input id="auth-username" name="username" autocomplete="username" required autofocus></div><div class="field"><label for="auth-password">Password</label><input id="auth-password" name="password" type="password" autocomplete="current-password" required></div></div><div class="form-actions">${registrationOpen ? `<button class="button quiet" type="button" data-action="show-account-registration">Create account</button>` : ""}<button class="button primary" type="submit">Sign in</button></div></form>`;
        const context = acceptingInvitation
          ? "Acceptance creates and signs in as a separate human account. It never reuses the inviter's identity or credential, and a consumed, expired, or revoked invitation cannot be replayed."
          : bootstrapRequired
            ? "Creating the administrator does not enable enforcement. The owner can first create client-install API keys, then use the explicit Settings toggle."
            : creatingAccount
            ? "Registration creates a human account only: no administrator authority, no workspace membership, and no AI actor identity. Sign-up is not rate limited, so restrict network access before exposing the server publicly."
            : "Sign-in identifies the human operator. AI actor identities remain separate and are never replaced by this account.";
        content.innerHTML = `${pageHead("Hosted access", title, description)}<div class="grid two"><section class="card" style="grid-column:1/-1;max-width:760px"><div class="card-head"><h2>${h(title)}</h2><span class="badge ${bootstrapRequired || acceptingInvitation || creatingAccount ? "pending" : "accepted"}">${acceptingInvitation ? "one-time invitation" : bootstrapRequired ? "first run" : creatingAccount ? "new account" : "account sign-in"}</span></div><div class="card-body">${state.invitationAcceptanceError ? `<div class="notice error"><span>!</span><div><strong>Invitation could not be accepted.</strong><br>${h(state.invitationAcceptanceError)}</div></div>` : ""}${form}<div class="notice section-gap"><span>i</span><div>${context}</div></div></div></section></div>`;
        content.setAttribute("aria-busy", "false");
      }

      async function bootstrap() {
        busy(true);
        // Trust boundary: auth/status is the first application-data request.
        // Do not fetch projects or settings until bootstrap/login succeeds.
        try {
          state.auth = await api("/v1/auth/status");
        } catch (error) {
          state.loading = false;
          state.health = { ok: false, error: error.message };
          updateChrome();
          content.innerHTML = `${pageHead("Connection error", "Attacca is not responding", "The panel could not read the public authentication status.")}<div class="notice error"><span>!</span><div><strong>${h(error.message)}</strong><br>Start or reconnect the server, then refresh this page.</div></div>`;
          busy(false);
          return;
        }
        state.loading = false;
        if (state.pendingInvitationToken || state.auth.bootstrap_required ||
            (state.auth.bootstrapped && !state.auth.authenticated) ||
            (state.auth.authentication_required && !state.auth.authenticated)) {
          state.projects = [];
          state.serverSettings = null;
          state.credentialAccess = null;
          state.data = {};
          updateChrome();
          renderAuth();
          busy(false);
          return;
        }
        if (state.auth.user) {
          state.prefs = { ...state.prefs, actor: `web.${state.auth.user.username}`,
            actorType: "human", owner: state.auth.user.username };
        }
        let projectsResult;
        try {
          const requests = [api("/healthz"), api("/v1/projects?options=1"), api("/v1/settings")];
          if (state.auth.authenticated) {
            requests.push(api("/v1/auth/tokens"));
            requests.push(loadCredentialAccess());
          }
          const [health, projects, settings, tokens, credentialAccess] = await Promise.all(requests);
          state.health = health;
          state.serverSettings = settings;
          state.authTokens = tokens?.tokens || [];
          state.credentialAccess = credentialAccess || emptyCredentialAccess();
          await loadPendingClientAuthorization();
          projectsResult = projects;
        } catch (error) {
          // A protected request may have discovered an expired session and
          // already switched the panel back to the login gate. Never retry
          // protected endpoints anonymously from this recovery branch.
          if (error.status === 401 ||
              (state.auth?.authentication_required && !state.auth.authenticated)) {
            busy(false);
            return;
          }
          state.health = { ok: false, error: error.message };
          try { state.serverSettings = await api("/v1/settings"); } catch (_) { /* server may predate the panel settings route */ }
          try { projectsResult = await api("/v1/projects?options=1"); }
          catch (projectError) {
            state.loading = false;
            updateChrome();
            content.innerHTML = `<div class="page-head"><div><div class="eyebrow">Connection error</div><h1>Attacca is not responding</h1><p>The panel uses the same origin as the Attacca server.</p></div></div><div class="notice error"><span>!</span><div><strong>${h(projectError.message)}</strong><br>Start or restart the server, then refresh this page.</div></div>`;
            busy(false);
            return;
          }
        }
        state.projects = projectsResult.projects || [];
        await loadWorkspaceAgentDirectory(state.projects);
        if (!state.projects.some(project => project.project_id === state.projectId)) state.projectId = state.projects[0]?.project_id || "";
        if (state.projectId) storageSet("attacca.admin.project", state.projectId);
        state.loading = false;
        updateChrome();
        if (state.projectId) await loadProjectData();
        else {
          state.view = "workspaces";
          await loadProjectPage();
          busy(false);
        }
        startPoller();
      }

      async function loadProjects() {
        const result = await api("/v1/projects?options=1");
        state.projects = result.projects || [];
        updateChrome();
      }

      function feedElement(kind) {
        return kind === "room" ? $("#room-feed") : kind === "activity" ? $("#activity-feed") : null;
      }

      function feedNearNewest(kind, feed) {
        if (!feed) return true;
        const feedState = state[`${kind}Feed`] || newFeedState();
        if ((Number(feedState.offset) || 0) > 0) return false;
        return kind === "room"
          ? feed.scrollHeight - feed.scrollTop - feed.clientHeight <= NEWEST_EDGE_PX
          : feed.scrollTop <= NEWEST_EDGE_PX;
      }

      function captureFeedViewport() {
        const kind = state.view === "room" ? "room" : state.view === "activity" ? "activity" : null;
        const feed = kind ? feedElement(kind) : null;
        if (!feed) return null;
        const scrollTop = feed.scrollTop;
        const feedTop = feed.getBoundingClientRect().top;
        const rows = [...feed.querySelectorAll("[data-feed-key]")];
        const anchor = rows.find(row => row.getBoundingClientRect().bottom >= feedTop + 1) || rows[0] || null;
        return {
          kind,
          scopeKey: feed.dataset.feedScope || "",
          nearNewest: feedNearNewest(kind, feed),
          scrollTop,
          anchorKey: anchor?.dataset.feedKey || null,
          anchorOffset: anchor ? anchor.getBoundingClientRect().top - feedTop : 0
        };
      }

      function newestSequence(rows) {
        return (rows || []).reduce((latest, row) => Math.max(latest, Number(row?.seq) || 0), 0);
      }

      function prepareServerFeed(kind, response, key, scopeKey) {
        const stateKey = `${kind}Feed`;
        let feed = state[stateKey] || newFeedState();
        const context = state.renderContext || {};
        const viewport = context.viewport;
        const page = responsePage(response, key, feed.offset);
        const rows = page.rows;
        const latest = Number(response?.latest_seq) || newestSequence(rows);
        const reset = feed.resetPending || feed.scopeKey !== scopeKey;
        if (reset) {
          feed = { ...newFeedState(), scopeKey, newestSeq: latest,
            offset: page.offset, total: page.total, hasMore: page.hasMore,
            resetPending: false };
          context.feedResetApplied = kind;
        } else {
          const added = Number(response?.new_count) || (rows || []).filter(
            row => (Number(row?.seq) || 0) > (Number(feed.newestSeq) || 0)).length;
          const preserveNavigation = context.feedTransition === kind;
          const nearNewest = !preserveNavigation && viewport?.kind === kind && viewport.scopeKey === scopeKey
            ? viewport.nearNewest
            : undefined;
          feed = reduceFeedRefresh(feed, latest, added, nearNewest);
          if (preserveNavigation) context.feedResetApplied = kind;
        }
        feed.offset = page.offset;
        feed.total = page.total;
        feed.hasMore = page.hasMore;
        feed.followNewest = page.offset === 0 && feed.followNewest;
        if (feed.followNewest) feed.newCount = 0;
        state[stateKey] = feed;
        return page;
      }

      function feedToolbar(kind, page, loadedLabel) {
        const feed = state[`${kind}Feed`];
        const title = kind === "room" ? "conversation" : "activity";
        const newLabel = `${feed.newCount} new ${kind === "room" ? `message${feed.newCount === 1 ? "" : "s"}` : `event${feed.newCount === 1 ? "" : "s"}`}`;
        const range = page.rows.length
          ? `${page.rangeStart}–${page.rangeEnd} of ${page.total}`
          : page.offset > 0 && page.total > 0
          ? `No results at offset ${page.offset} · ${page.total} total`
          : `0 of ${page.total}`;
        return `<div class="feed-toolbar"><div class="feed-pagination" role="navigation" aria-label="${h(identityPart(title))} history pages"><button class="button quiet small" type="button" data-action="${kind}-older" ${page.hasMore ? "" : "disabled"}>Older</button><span class="feed-range">${h(range)}</span><button class="button quiet small" type="button" data-action="${kind}-newer" ${page.offset > 0 ? "" : "disabled"}>Newer</button></div><button class="button quiet small new-items" type="button" data-action="${kind}-newest" aria-live="polite" ${feed.newCount ? "" : "hidden"}>${h(newLabel)} · View newest</button><span class="faint small">${h(loadedLabel)} · ${h(page.limit)} per page</span></div>`;
      }

      function restoreFeedViewport(snapshot, transition, resetApplied) {
        const kind = state.view === "room" ? "room" : state.view === "activity" ? "activity" : null;
        if (!kind) return;
        const expectedScope = state[`${kind}Feed`]?.scopeKey || "";
        requestAnimationFrame(() => {
          const feed = feedElement(kind);
          if (!feed || feed.dataset.feedScope !== expectedScope) return;
          const followNewest = Boolean(state[`${kind}Feed`]?.followNewest);
          if (transition === kind || resetApplied === kind || !snapshot || snapshot.kind !== kind || snapshot.scopeKey !== expectedScope) {
            feed.scrollTop = followNewest && kind === "room" ? feed.scrollHeight : 0;
            return;
          }
          if (followNewest && snapshot.nearNewest) {
