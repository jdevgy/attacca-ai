        return `<div class="list-row"><div><div class="cluster"><strong>${h(invitation.label || "Workspace invitation")}</strong>${statusBadge(status)}${invitation.is_admin ? `<span class="badge review">administrator</span>` : `<span class="badge">member</span>`}</div><div class="list-meta"><span>Invited by: @${h(invitation.invited_by || "not recorded")}</span><span>Prefix: ${h(invitation.token_prefix || "unavailable")}…</span><span>${invitation.expires_at ? `Expires: ${h(fmtTime(invitation.expires_at))}` : "No expiry"}</span>${invitation.accepted_at ? `<span>Accepted: ${h(fmtTime(invitation.accepted_at))}</span>` : ""}</div><div class="cluster section-gap"><span class="faint small">Workspace membership</span>${renderCredentialMemberships(invitation)}</div></div>${status === "pending" ? `<button class="button danger small" type="button" data-action="revoke-invitation" data-invitation="${h(invitation.invitation_id)}">Revoke invitation</button>` : ""}</div>`;
      }

      function renderPendingEnrollment(enrollment, agentDirectory) {
        const code = enrollmentCode(enrollment);
        const requestId = enrollment.enrollment_id || code;
        const targeted = Boolean(code && state.targetedEnrollmentCode && code === state.targetedEnrollmentCode);
        if (enrollment.status === "approved") {
          return `<article class="bridge-panel ${targeted ? "targeted" : ""}" data-enrollment-code="${h(code)}"><div class="bridge-panel-head"><div><div class="cluster"><strong>${h(enrollment.client_label || enrollment.device_label || "New terminal")}</strong><span class="badge accepted">approved</span><span class="badge pending">waiting for terminal claim</span></div><div class="list-meta"><span>Device ID: ${h(enrollment.device_id || "not reported")}</span><span>Approved: ${h(fmtTime(enrollment.approved_at))}</span><span>Expires: ${h(fmtTime(enrollment.expires_at))}</span></div></div></div><div class="cluster section-gap"><span class="faint small">Requested exact AI actors</span>${renderCredentialBindings(enrollment)}</div><p class="muted small">The long-lived credential is available only to the initiating terminal's one-time device poll. It is never rendered in this browser.</p></article>`;
        }
        const requestedProjects = new Set(credentialMemberships(enrollment));
        const requestedBindings = new Set(credentialBindings(enrollment).map(binding => `${binding.project_id || ""}\u0000${binding.actor_id}`));
        return `<article class="bridge-panel ${targeted ? "targeted" : ""}" data-enrollment-code="${h(code)}"><div class="bridge-panel-head"><div><div class="cluster"><strong>${h(enrollment.client_label || enrollment.device_label || "New terminal")}</strong><span class="badge pending">pending approval</span></div><div class="list-meta"><span>Device ID: ${h(enrollment.device_id || "assigned after approval")}</span><span>Requested: ${h(fmtTime(enrollment.created_at || enrollment.requested_at))}</span><span>Expires: ${h(fmtTime(enrollment.expires_at))}</span></div></div>${state.auth?.user?.is_admin === true ? `<button class="button danger small" type="button" data-action="deny-terminal-enrollment" data-code="${h(code)}">Deny</button>` : ""}</div><form data-form="approve-terminal-enrollment" data-code="${h(code)}" data-enrollment="${h(requestId)}" class="section-gap"><div class="field"><label>Workspace memberships</label><div class="cluster">${state.projects.map(project => `<label class="chip"><input type="checkbox" name="project_memberships" value="${h(project.project_id)}" ${requestedProjects.has(project.project_id) ? "checked" : ""}> ${h(project.name)} · ${h(project.project_id)}</label>`).join("") || `<span class="muted">No workspaces are available.</span>`}</div><span class="help">Requested memberships are visible and preselected. The terminal can access only the memberships approved here.</span></div><div class="field section-gap"><label>Allowed AI actor bindings across selected workspaces</label><div class="cluster">${agentDirectory.map(({ project_id: projectId, agent }) => `<label class="chip"><input type="checkbox" name="actor_bindings" value="${h(JSON.stringify({ project_id: projectId, actor_id: agent.agent_id }))}" ${requestedBindings.has(`${projectId}\u0000${agent.agent_id}`) ? "checked" : ""}> ${h(projectId)} · ${h(agent.agent_id)}</label>`).join("") || `<span class="muted">No AI actors are registered in the available workspaces.</span>`}</div><span class="help">Requested bindings are visible and preselected. Every approved binding must belong to an approved workspace membership. These are exact, unchanged AI identities; the signed-in human remains the separate terminal owner.</span></div><div class="field section-gap"><label>Terminal expiry <span class="faint">optional</span></label><input name="expires_at" type="datetime-local"></div><div class="form-actions"><button class="button primary" type="submit" ${code ? "" : "disabled"}>Approve terminal enrollment</button></div></form></article>`;
      }

      function renderMigrationTarget(target, editable = true) {
        const covered = Array.isArray(target.covered_by_terminal_ids) && target.covered_by_terminal_ids.length > 0;
        const required = target.migration_required !== false;
        const targetId = target.target_id || [target.project_id, target.actor_id, target.device_id].filter(Boolean).join(":");
        const control = editable
          ? `<div class="field" style="min-width:260px"><label class="chip"><input type="checkbox" name="required_clients" value="${h(targetId)}" data-project="${h(target.project_id || "")}" data-actor="${h(target.actor_id || "")}" data-device="${h(target.device_id || "")}" ${required ? "checked" : ""}> Required for activation</label><input name="exclusion_reason" data-exclusion-for="${h(targetId)}" value="${h(target.migration_exclusion_reason || "")}" placeholder="Reason required when excluded"></div>`
          : `<div class="cluster">${statusBadge(required ? "required" : "excluded")}${!required && target.migration_exclusion_reason ? `<span class="muted small">${h(target.migration_exclusion_reason)}</span>` : ""}</div>`;
        return `<div class="list-row" data-migration-target="${h(targetId)}"><div><div class="cluster"><strong>${h(target.client_label || target.device_id || "Legacy client")}</strong>${statusBadge(covered ? "covered" : required ? "pending" : "excluded")}</div><div class="list-meta"><span>Workspace: ${h(target.project_id || "unknown")}</span><span>Device: ${h(target.device_id || "unknown")}</span></div><div class="cluster section-gap"><span class="faint small">Exact AI actor</span><span class="chip">${h(target.actor_id || "unknown")}</span></div>${covered ? `<div class="list-meta"><span>Covered by terminal: ${h(target.covered_by_terminal_ids.join(", "))}</span></div>` : ""}</div>${control}</div>`;
      }

      function renderOneTimeServiceCredential() {
        const value = state.oneTimeCredential;
        if (value?.kind !== "service" || !value.secret) return "";
        return `<div class="notice ok"><span>✓</span><div><strong>Copy this service credential now</strong><br><code id="one-time-service-secret">${h(value.secret)}</code>${value.expires_at ? ` · expires ${h(fmtTime(value.expires_at))}` : ""}<div class="cluster section-gap"><button class="button primary small" type="button" data-action="copy-one-time-secret">Copy service credential</button><button class="button quiet small" type="button" data-action="dismiss-one-time-credential">Dismiss permanently</button></div><span class="help">This long-lived credential exists only in this page's memory. It is absent from later API responses, browser storage, and logs; dismissing or reloading cannot recover it.</span></div></div>`;
      }

      function renderOneTimeInvitation() {
        const value = state.oneTimeCredential;
        if (value?.kind !== "invitation" || !value.secret || !value.link) return "";
        return `<div class="notice ok"><span>✓</span><div><strong>Share this one-time invitation securely</strong><br><span class="help">Acceptance link (the secret is in the fragment and is not sent in the initial HTTP request):</span><br><code id="one-time-invitation-link">${h(value.link)}</code><div class="section-gap"><span class="help">Token fallback:</span><br><code id="one-time-invitation-secret">${h(value.secret)}</code></div>${value.expires_at ? `<div class="list-meta"><span>Expires: ${h(fmtTime(value.expires_at))}</span></div>` : ""}<div class="cluster section-gap"><button class="button primary small" type="button" data-action="copy-one-time-link">Copy acceptance link</button><button class="button small" type="button" data-action="copy-one-time-secret">Copy token</button><button class="button quiet small" type="button" data-action="dismiss-one-time-credential">Dismiss permanently</button></div><span class="help">Neither value is stored by this panel. The invitation is consumed once; replay, expiry, and revocation are rejected.</span></div></div>`;
      }

      function renderAuthenticatedSettings() {
        const settings = state.serverSettings || {};
        const account = state.auth?.user || {};
        const access = state.credentialAccess || emptyCredentialAccess();
        const compatibility = access.compatibility;
        const eligibility = activationEligibility(access, account);
        const armed = state.activationArmedVersion !== null &&
          String(state.activationArmedVersion) === String(compatibility.readiness_version) &&
          eligibility.allowed;
        const agents = state.data.agents?.agents || [];
        const workspaceAgentDirectory = state.projects.flatMap(project =>
          (state.workspaceAgents?.[project.project_id] || []).map(agent => ({ project_id: project.project_id, agent })));
        const protectedMode = eligibility.alreadyActivated;
        const compatibilityActive = !protectedMode;
        const qaAcceptance = compatibility.qa_evidence?.acceptance || {};
        const qaRegression = compatibility.qa_evidence?.regression || {};
        const blockers = [
          ...(compatibility.blockers || []),
          ...(compatibility.uncovered_projects || []).map(projectId => `Required workspace ${projectId} has no enrolled terminal coverage.`),
          ...(compatibility.uncovered_actors || []).map(actorId => `Required AI actor ${actorId} has no enrolled terminal coverage.`),
          ...eligibility.reasons.filter(reason => !reason.includes("already active"))
        ];
        const migrationTargets = access.migration_targets || [];
        const terminalRows = access.terminals.length
          ? access.terminals.map(terminal => renderTerminalRow(terminal, account)).join("")
          : `<div class="muted">No enrolled terminals yet. Compatibility stays active and protected-mode activation stays locked.</div>`;
        const pendingRows = access.terminal_enrollments.length
          ? access.terminal_enrollments.map(enrollment => renderPendingEnrollment(enrollment, workspaceAgentDirectory)).join("")
          : `<div class="muted">No terminal enrollment is waiting for approval.</div>`;
        const serviceRows = access.service_keys.length
          ? access.service_keys.map(key => renderServiceKeyRow(key, account)).join("")
          : `<div class="muted">No service keys yet.</div>`;
        const invitationRows = access.invitations.length
          ? access.invitations.map(renderInvitationRow).join("")
          : `<div class="muted">No human invitations yet.</div>`;
        const legacyRows = state.authTokens.length
          ? state.authTokens.map(token => `<div class="list-row"><div><div class="cluster"><strong>${h(token.label)}</strong><span class="badge pending">legacy credential</span></div><div class="list-meta"><span>Owner: @${h(account.username || "not recorded")}</span><span>${h(token.token_prefix || "unavailable")}…</span><span>${token.last_used_at ? `Last use: ${h(fmtTime(token.last_used_at))}` : "Never used"}</span></div><div class="cluster section-gap"><span class="faint small">Exact AI actor</span><span class="chip">${h(token.actor_id || "human API client")}</span>${token.project_id ? `<span class="chip">${h(token.project_id)}</span>` : ""}</div></div>${token.revoked_at ? statusBadge("revoked") : `<button class="button danger small" type="button" data-action="revoke-auth-token" data-token="${h(token.token_id)}">Revoke legacy key</button>`}</div>`).join("")
          : `<div class="muted">No legacy actor keys remain.</div>`;
        const serviceKeyControls = access.capabilities.service_keys === true
          ? `<form data-form="create-service-key" class="section-gap"><div class="form-grid"><div class="field"><label for="service-label">Label</label><input id="service-label" name="label" maxlength="120" placeholder="Release automation" required></div><div class="field"><label for="service-expires">Expires <span class="faint">recommended</span></label><input id="service-expires" name="expires_at" type="datetime-local"></div><div class="field wide"><label>Workspace scope</label><div class="cluster">${state.projects.map(project => `<label class="chip"><input type="checkbox" name="project_memberships" value="${h(project.project_id)}"> ${h(project.name)} · ${h(project.project_id)}</label>`).join("")}</div></div><div class="field wide"><label>Exact allowed AI actors <span class="faint">optional</span></label><div class="cluster">${workspaceAgentDirectory.map(({ project_id: projectId, agent }) => `<label class="chip"><input type="checkbox" name="actor_bindings" value="${h(JSON.stringify({ project_id: projectId, actor_id: agent.agent_id }))}"> ${h(projectId)} · ${h(agent.agent_id)}</label>`).join("") || `<span class="muted">No registered actors are available in the selected workspace memberships.</span>`}</div></div></div><div class="form-actions"><button class="button primary" type="submit">Create service key</button></div></form>`
          : `<div class="notice section-gap"><span>i</span><div><strong>Service-key enrollment is not enabled yet.</strong><br>No dead creation control is rendered. Existing service-key metadata remains visible, and exact actor bindings are unchanged.</div></div>`;
        const invitationControls = access.capabilities.invitations !== true
          ? `<div class="notice section-gap"><span>i</span><div><strong>Human invitations are not enabled yet.</strong><br>No dead invitation control is rendered, and this panel cannot create a credential that impersonates another person.</div></div>`
          : account.is_admin !== true
            ? `<div class="notice section-gap"><span>i</span><div><strong>Administrator access is required to create invitations.</strong><br>Your own human and terminal identities remain unchanged.</div></div>`
            : `<form data-form="invite-human" class="section-gap"><div class="form-grid"><div class="field"><label for="invite-label">Invitation label</label><input id="invite-label" name="label" maxlength="120" placeholder="New teammate · Alpha" required></div><div class="field"><label for="invite-expires">Expires <span class="faint">48 hours by default</span></label><input id="invite-expires" name="expires_at" type="datetime-local"></div><div class="field wide"><label>Workspace membership</label><div class="cluster">${state.projects.map(project => `<label class="chip"><input type="checkbox" name="project_memberships" value="${h(project.project_id)}"> ${h(project.name)} · ${h(project.project_id)}</label>`).join("")}</div></div><div class="field wide"><label class="chip"><input type="checkbox" name="is_admin" ${account.is_owner === true ? "" : "disabled"}> Invite as server administrator</label><span class="help">${account.is_owner === true ? "Only the server owner may grant administrator scope." : "Only the server owner can grant administrator scope; this invitation will be a member."}</span></div></div><div class="form-actions"><button class="button primary" type="submit">Create one-time invitation</button></div></form>`;
        const migrationScopeControls = migrationTargets.length
          ? account.is_owner === true && access.capabilities.migration_scope === true
            ? `<form data-form="save-migration-scope" class="section-gap"><div class="card-head" style="padding-left:0;padding-right:0"><div><h3>Active client migration scope</h3><span class="faint small">Only live compatibility clients and explicitly selected clients are targets. Historical actors are not added automatically.</span></div></div><div class="list">${migrationTargets.map(target => renderMigrationTarget(target, true)).join("")}</div><div class="form-actions"><button class="button" type="submit">Save required clients and exclusions</button></div></form>`
            : `<div class="section-gap"><div class="card-head" style="padding-left:0;padding-right:0"><div><h3>Active client migration scope</h3><span class="faint small">Read only · ${account.is_owner === true ? "migration-scope editing is not enabled by this server" : "only the server owner can change activation scope"}.</span></div></div><div class="list">${migrationTargets.map(target => renderMigrationTarget(target, false)).join("")}</div></div>`
          : `<div class="notice section-gap"><span>i</span><div><strong>No active migration targets are published.</strong><br>At least one live terminal enrollment and coverage for every required client are needed before readiness can pass.</div></div>`;
        return pageHead("Account and access", "Settings", "Manage human-owned terminals, service automation, invitations, compatibility migration, and server behavior without changing AI identities.") +
          `<div class="notice"><span>✓</span><div><strong>Signed in as ${h(account.display_name || account.username)}</strong><br>Human account: <code>web.${h(account.username)}</code> · <strong>Run by user: ${h(account.username)}</strong>. AI actors such as ${agents[0]?.agent_id ? `<code>${h(agents[0].agent_id)}</code>` : "registered workspace actors"} remain separate, exact identities; a terminal credential never renames or impersonates them. Browser identity headers cannot override either identity.</div></div>
          <div class="grid two section-gap">
            <section class="card"><div class="card-head"><h2>Human account</h2><span class="badge accepted">${account.is_owner ? "server owner" : account.is_admin ? "admin" : "user"}</span></div><div class="card-body"><div class="list"><div class="list-row"><span class="muted">Username</span><code>@${h(account.username)}</code></div><div class="list-row"><span class="muted">Display name</span><strong>${h(account.display_name || account.username)}</strong></div><div class="list-row"><span class="muted">Protected-mode authority</span><strong>${account.is_owner ? "Owner controls enabled" : "Read only · server owner required"}</strong></div></div><div class="form-actions"><button class="button danger" type="button" data-action="auth-logout">Sign out</button></div></div></section>
            <section class="card"><div class="card-head"><h2>Browser refresh</h2></div><div class="card-body"><form data-form="save-panel-behavior"><div class="form-grid"><div class="field"><label for="settings-refresh">Refresh interval</label><input id="settings-refresh" name="refreshSeconds" type="number" min="5" max="300" value="${h(state.prefs.refreshSeconds)}"></div><div class="field"><label for="settings-auto">Live refresh</label><select id="settings-auto" name="autoRefresh"><option value="true" ${state.prefs.autoRefresh ? "selected" : ""}>On</option><option value="false" ${!state.prefs.autoRefresh ? "selected" : ""}>Off</option></select></div></div><div class="form-actions"><button class="button primary" type="submit">Save browser settings</button></div></form></div></section>
            <section class="card" style="grid-column:1/-1"><div class="card-head"><div><h2>Authentication migration</h2><span class="faint small">explicit activation only</span></div><div class="cluster">${statusBadge(compatibilityActive ? "compatibility" : "protected")}${statusBadge(eligibility.migrationReady ? "ready" : "pending")}</div></div><div class="card-body">${!access.supported ? `<div class="notice error"><span>!</span><div><strong>Terminal migration inventory is unavailable.</strong><br>Activation is locked. Upgrade the hosted service through its normal operator workflow; this panel will never guess that migration is safe.</div></div>` : compatibilityActive ? `<div class="notice"><span>↔</span><div><strong>Compatibility mode is active.</strong><br>Existing clients may continue while human-owned terminals are enrolled. Creating the administrator did not activate protected mode.</div></div>` : `<div class="notice ok"><span>✓</span><div><strong>Protected mode is active.</strong><br>Terminal credentials and service keys are required according to the recorded migration scope.</div></div>`}
              <div class="grid two section-gap"><div class="bridge-panel"><div class="cluster"><strong>Migration readiness</strong>${statusBadge(eligibility.migrationReady ? "passed" : "pending")}</div><div class="list-meta"><span>Readiness version: ${h(compatibility.readiness_version ?? "not published")}</span><span>${h(access.terminals.length)} enrolled terminal${access.terminals.length === 1 ? "" : "s"}</span></div></div><div class="bridge-panel"><div class="cluster"><strong>Two independent QA passes</strong>${statusBadge(eligibility.acceptancePassed && eligibility.regressionPassed ? "passed" : "pending")}</div><div class="list-meta"><span>Acceptance criteria: ${eligibility.acceptancePassed ? "passed" : "missing"}${qaAcceptance.suite ? ` · ${h(qaAcceptance.suite)}` : ""}${qaAcceptance.result ? ` · ${h(qaAcceptance.result)}` : ""}</span><span>Regression/integration: ${eligibility.regressionPassed ? "passed" : "missing"}${qaRegression.suite ? ` · ${h(qaRegression.suite)}` : ""}${qaRegression.result ? ` · ${h(qaRegression.result)}` : ""}</span></div></div></div>
              ${migrationScopeControls}
              ${blockers.length && !protectedMode ? `<div class="notice error section-gap"><span>!</span><div><strong>Activation remains locked.</strong><ul>${[...new Set(blockers)].map(item => `<li>${h(item)}</li>`).join("")}</ul></div></div>` : ""}
              <div class="bridge-panel section-gap"><div class="bridge-panel-head"><div><strong>Two-stage owner activation</strong><div class="list-meta"><span>Stage 1 records a separate owner review. Stage 2 performs activation. Neither stage runs automatically.</span></div></div>${statusBadge(armed ? "armed" : protectedMode ? "active" : "not armed")}</div><div class="form-actions"><button class="button" type="button" data-action="arm-auth-activation" ${eligibility.allowed && !armed ? "" : "disabled"}>1. Review and arm activation</button><button class="button primary" type="button" data-action="activate-authentication" ${armed ? "" : "disabled"}>2. Activate protected mode</button></div></div></div></section>
            <section class="card" style="grid-column:1/-1"><div class="card-head"><div><h2>Human-owned terminals</h2><span class="faint small">model-independent device identity</span></div><span class="badge">${h(access.terminals.length)} enrolled</span></div><div class="card-body">${state.targetedEnrollmentError ? `<div class="notice error"><span>!</span><div><strong>The linked terminal request could not be loaded.</strong><br>${h(state.targetedEnrollmentError)}</div></div>` : ""}<div class="notice"><span>↗</span><div><strong>The initiating terminal starts enrollment.</strong><br>Only that terminal holds its one-time device secret and exact device ID. Its browser approval link opens the matching request below; this panel never manufactures an unbound terminal credential.</div></div><div class="card-head section-gap" style="padding-left:0;padding-right:0"><h3>Pending terminal approvals</h3><span class="faint small">approve workspace membership and exact actors</span></div><div class="stack">${pendingRows}</div><div class="card-head section-gap" style="padding-left:0;padding-right:0"><h3>Enrolled terminals</h3><span class="faint small">human owner · device · scope · last use</span></div><div class="list">${terminalRows}</div></div></section>
            <section class="card"><div class="card-head"><h2>Service keys</h2><span class="faint small">human-owned automation</span></div><div class="card-body">${renderOneTimeServiceCredential()}<div class="notice"><span>i</span><div>A service key belongs to the signed-in human or organization service account. Exact allowed AI actor bindings remain separate; the key does not turn one actor into another.</div></div>${serviceKeyControls}<div class="list section-gap">${serviceRows}</div></div></section>
            <section class="card"><div class="card-head"><h2>Invite another human</h2><span class="faint small">no impersonation</span></div><div class="card-body">${renderOneTimeInvitation()}<div class="notice"><span>+</span><div>The invitee accepts once, creates their own human account, and then signs in through the ordinary session endpoint. This never creates a key that acts as the invitee.</div></div>${invitationControls}<div class="list section-gap">${invitationRows}</div></div></section>
            <section class="card" style="grid-column:1/-1"><div class="card-head"><h2>Legacy actor keys pending migration</h2><span class="faint small">read-only metadata · no plaintext</span></div><div class="card-body"><div class="notice"><span>!</span><div>These keys predate human-owned terminal enrollment. They are shown only as prefixes and exact actor bindings. No raw key is rendered, and they do not satisfy terminal readiness unless the server records matching terminal coverage.</div></div><div class="list section-gap">${legacyRows}</div></div></section>
            <section class="card"><div class="card-head"><h2>Server runtime</h2>${statusBadge(state.health?.ok ? "ok" : "error")}</div><div class="card-body"><form data-form="save-runtime"><div class="form-grid"><div class="field wide"><label for="runtime-default">Default workspace</label><select id="runtime-default" name="default_project"><option value="">No server default</option>${state.projects.map(project => `<option value="${h(project.project_id)}" ${settings.default_project === project.project_id ? "selected" : ""}>${h(project.name)} · ${h(project.project_id)}</option>`).join("")}</select></div><div class="field"><label for="runtime-update-interval">AI update checks</label><select id="runtime-update-interval" name="update_interval_seconds">${[[0,"Off"],[60,"Every minute (default)"],[300,"Every 5 minutes"],[600,"Every 10 minutes"],[1800,"Every 30 minutes"],[3600,"Every hour"]].map(([seconds,label]) => `<option value="${seconds}" ${Number(settings.update_interval_seconds) === seconds ? "selected" : ""}>${label}</option>`).join("")}</select></div><div class="field"><label for="runtime-verbose">Request logging</label><select id="runtime-verbose" name="verbose"><option value="false" ${!settings.verbose ? "selected" : ""}>Quiet</option><option value="true" ${settings.verbose ? "selected" : ""}>Verbose</option></select></div></div><div class="form-actions"><button class="button primary" type="submit">Save watcher settings</button></div></form><div class="notice section-gap"><span>↗</span><div><strong>Connection changes are local to each terminal.</strong><br>Use that terminal's built-in connection settings. This panel never tells a human or AI to paste shell commands.</div></div></div></section>
            <section class="card"><div class="card-head"><h2>Download all workspace data</h2></div><div class="card-body"><p class="muted">Download a deterministic snapshot of the selected workspace, including the ledger and full logs. Each download is a private human backup, not the agent sync mirror. Authentication secrets are excluded; if preparation fails, no empty placeholder file is saved.</p><div class="form-actions" style="justify-content:flex-start"><button class="button primary" type="button" data-action="download-export" data-format="zip" ${state.projectId ? "" : "disabled"}>ZIP</button><button class="button" type="button" data-action="download-export" data-format="json" ${state.projectId ? "" : "disabled"}>Full JSON</button><button class="button" type="button" data-action="download-export" data-format="ledger.ndjson" ${state.projectId ? "" : "disabled"}>Ledger NDJSON</button><button class="button" data-action="download-export" data-format="full-log.txt" ${state.projectId ? "" : "disabled"}>Full log</button></div></div></section>
          </div>`;
      }

      async function openTaskPlan(taskId, version = null) {
        state.taskPlan = {
          taskId, data: null, error: "", loading: true,
          edit: false, selectedVersion: version
        };
        render({ force: true });
        try {
          const suffix = version == null ? "" : `?version=${encodeURIComponent(version)}`;
          state.taskPlan.data = await api(pathFor(`/tasks/${encodeURIComponent(taskId)}/plan${suffix}`));
          state.taskPlan.edit = !state.taskPlan.data?.plan;
        } catch (error) {
          state.taskPlan.error = error.message;
        } finally {
          state.taskPlan.loading = false;
          render({ force: true });
        }
      }

      async function mutate(label, operation) {
        busy(true);
        try {
          const result = await operation();
          toast(label);
          await loadProjectData({ quiet: true });
          return result;
        } catch (error) {
          toast(error.message, "error");
          error.attaccaShown = true;
          throw error;
        } finally { busy(false); }
      }

      async function selectProject(projectId, roomConversation = "local") {
        state.projectId = projectId;
        state.roomConversation = roomConversation;
        resetFeed("room");
        resetFeed("activity");
        storageSet("attacca.admin.project", projectId);
        state.data = {};
        state.searchQuery = "";
        state.searchResults = null;
        state.taskPlan = { taskId: "", data: null, error: "", loading: false, edit: false, selectedVersion: null };
        await loadProjectData();
      }

      document.addEventListener("click", async event => {
        const viewButton = event.target.closest("[data-view]");
        if (viewButton) {
          state.view = viewButton.dataset.view;
          history.replaceState(null, "", `#${state.view}`);
          render();
          content.focus({ preventScroll: true });
          return;
        }
        const button = event.target.closest("[data-action]");
        if (!button || button.disabled) return;
        const action = button.dataset.action;
        try {
          if (action === "auth-logout") {
            await api("/v1/auth/logout", { method: "POST", body: {} });
            state.auth = null;
            state.credentialAccess = null;
            state.oneTimeCredential = null;
            state.activationArmedVersion = null;
            state.authTokens = [];
            state.projects = [];
            state.workspaceAgents = {};
            state.workspaceAgentErrors = {};
            state.data = {};
            await bootstrap();
            toast("Signed out");
          }
          if (action === "revoke-auth-token") {
            if (!confirm("Revoke this legacy key? Any client still using it must complete a new terminal or service enrollment.")) return;
            await api(`/v1/auth/tokens/${encodeURIComponent(button.dataset.token)}`, { method: "DELETE", body: {} });
            state.authTokens = (await api("/v1/auth/tokens")).tokens || [];
            render({ force: true });
            toast("Legacy key revoked");
          }
          if (action === "copy-one-time-secret") {
            if (!state.oneTimeCredential?.secret) throw new Error("The one-time credential is no longer available.");
            await navigator.clipboard.writeText(state.oneTimeCredential.secret);
            toast(state.oneTimeCredential.kind === "invitation" ? "Invitation token copied" : "Service credential copied");
          }
          if (action === "copy-one-time-link") {
            if (state.oneTimeCredential?.kind !== "invitation" || !state.oneTimeCredential.link) throw new Error("The one-time invitation link is no longer available.");
            await navigator.clipboard.writeText(state.oneTimeCredential.link);
            toast("Invitation acceptance link copied");
          }
          if (action === "dismiss-one-time-credential") {
            state.oneTimeCredential = null;
            render({ force: true });
          }
          if (action === "dismiss-invitation-acceptance") {
            state.pendingInvitationToken = "";
            state.invitationAcceptanceError = "";
            await bootstrap();
          }
          if (action === "deny-terminal-enrollment") {
            if (state.credentialAccess?.capabilities?.terminal_enrollment !== true) throw new Error("Terminal enrollment management is not enabled on this server.");
            if (state.auth?.user?.is_admin !== true) throw new Error("Administrator access is required to deny another terminal request.");
            if (!button.dataset.code) throw new Error("The pending enrollment has no approval code.");
            if (!confirm("Deny this terminal enrollment? No long-lived credential will be issued.")) return;
            await api(`/v1/auth/terminal-enrollments/${encodeURIComponent(button.dataset.code)}/deny`, { method: "POST", body: {} });
            if (state.targetedEnrollmentCode === button.dataset.code) state.targetedEnrollmentCode = "";
            state.credentialAccess = await loadCredentialAccess();
            render({ force: true });
            toast("Terminal enrollment denied");
          }
          if (action === "revoke-terminal") {
            if (state.credentialAccess?.capabilities?.terminal_enrollment !== true) throw new Error("Terminal credential management is not enabled on this server.");
            if (!confirm("Revoke this human-owned terminal credential? Its exact AI actor bindings are not changed.")) return;
            await api(`/v1/auth/terminals/${encodeURIComponent(button.dataset.token)}`, { method: "DELETE", body: {} });
            state.credentialAccess = await loadCredentialAccess();
            state.activationArmedVersion = null;
            render({ force: true });
            toast("Terminal credential revoked");
          }
          if (action === "revoke-service-key") {
            if (state.credentialAccess?.capabilities?.service_keys !== true) throw new Error("Service-key management is not enabled on this server.");
            if (!confirm("Revoke this service key? Its recorded human owner and exact actor bindings remain in audit history.")) return;
            await api(`/v1/auth/service-keys/${encodeURIComponent(button.dataset.key)}`, { method: "DELETE", body: {} });
            state.credentialAccess = await loadCredentialAccess();
            state.activationArmedVersion = null;
            render({ force: true });
            toast("Service key revoked");
          }
          if (action === "revoke-invitation") {
            if (state.credentialAccess?.capabilities?.invitations !== true) throw new Error("Human invitations are not enabled on this server.");
            if (state.auth?.user?.is_admin !== true) throw new Error("Administrator access is required to revoke an invitation.");
            if (!button.dataset.invitation) throw new Error("The invitation has no identifier.");
            if (!confirm("Revoke this unused invitation? Its one-time token will stop working.")) return;
            await api(`/v1/auth/invitations/${encodeURIComponent(button.dataset.invitation)}`, { method: "DELETE", body: {} });
            state.credentialAccess = await loadCredentialAccess();
            render({ force: true });
            toast("Invitation revoked");
          }
          if (action === "arm-auth-activation") {
            const access = state.credentialAccess || emptyCredentialAccess();
            const eligibility = activationEligibility(access, state.auth?.user || {});
            if (!eligibility.allowed) throw new Error(eligibility.reasons[0] || "Activation readiness has not passed.");
            const version = access.compatibility?.readiness_version;
            if (version === null || version === undefined) throw new Error("Activation readiness has no immutable version.");
            if (!confirm("Stage 1 of 2: confirm that the active-client migration scope, every exclusion reason, and both QA evidence passes have been reviewed. This only arms the current readiness version; it does not activate authentication.")) return;
            state.activationArmedVersion = version;
            render({ force: true });
            toast("Current readiness version armed for explicit activation");
          }
          if (action === "activate-authentication") {
            const access = state.credentialAccess || emptyCredentialAccess();
            const eligibility = activationEligibility(access, state.auth?.user || {});
            const version = access.compatibility?.readiness_version;
            const armed = state.activationArmedVersion !== null && String(state.activationArmedVersion) === String(version);
            if (!eligibility.allowed || !armed) throw new Error("Complete the separate owner review before activation.");
            if (!confirm("Stage 2 of 2: activate protected mode now? This is the explicit activation action; it is never performed by readiness checks, enrollment, refresh, or AI activity.")) return;
            await api("/v1/auth/activation", { method: "POST", body: { confirmed: true, expected_readiness_version: version } });
            state.activationArmedVersion = null;
            state.auth = await api("/v1/auth/status");
            state.credentialAccess = await loadCredentialAccess();
            render({ force: true });
            toast("Protected mode activated explicitly");
          }
          if (action === "select-project") await selectProject(button.dataset.project);
          if (action === "view-task-plan") await openTaskPlan(button.dataset.task);
          if (action === "close-task-plan") {
            state.taskPlan = { taskId: "", data: null, error: "", loading: false, edit: false, selectedVersion: null };
            render({ force: true });
          }
          if (action === "edit-task-plan") {
            state.taskPlan.edit = true;
            render({ force: true });
          }
          if (action === "cancel-plan-edit") {
            state.taskPlan.edit = false;
            render({ force: true });
          }
          if (action === "submit-task-plan") {
            await mutate(`${button.dataset.task} plan submitted`, () => api(pathFor(`/tasks/${encodeURIComponent(button.dataset.task)}/plan/submit`), { method: "POST", body: { expected_version: Number(button.dataset.version) } }));
          }
          if (action === "approve-task-plan") {
            const target = button.dataset.section ? `section ${button.dataset.section}` : "the entire plan";
            const note = prompt(`Optional approval note for ${target}:`, "Reviewed and approved.");
            if (note === null) return;
            await mutate(`${button.dataset.task} plan approved`, () => api(pathFor(`/tasks/${encodeURIComponent(button.dataset.task)}/plan/review`), { method: "POST", body: { expected_version: Number(button.dataset.version), action: "approve", section_id: button.dataset.section || null, note: note.trim() || null } }));
          }
          if (action === "suggest-task-plan") {
            const target = button.dataset.section ? `section ${button.dataset.section}` : "the overall plan";
            const note = prompt(`Concrete edit suggestion for ${target}:`, "");
            if (note === null) return;
            if (!note.trim()) throw new Error("An edit suggestion needs a concrete note.");
            await mutate(`${button.dataset.task} edit suggested`, () => api(pathFor(`/tasks/${encodeURIComponent(button.dataset.task)}/plan/review`), { method: "POST", body: { expected_version: Number(button.dataset.version), action: "suggest_edit", section_id: button.dataset.section || null, note: note.trim() } }));
          }
          if (action === "comment-task-plan") {
            const target = button.dataset.section ? `section ${button.dataset.section}` : "the overall plan";
            const note = prompt(`Comment on ${target}:`, "");
            if (note === null) return;
            if (!note.trim()) throw new Error("A plan comment cannot be empty.");
            await mutate(`${button.dataset.task} plan comment added`, () => api(pathFor(`/tasks/${encodeURIComponent(button.dataset.task)}/plan/review`), { method: "POST", body: { expected_version: Number(button.dataset.version), action: "comment", section_id: button.dataset.section || null, note: note.trim() } }));
          }
          if (action === "claim-task") {
            const task = (state.data.tasks?.tasks || []).find(item => item.task_id === button.dataset.task);
            await mutate(`${button.dataset.task} claimed`, () => api(pathFor(`/tasks/${encodeURIComponent(button.dataset.task)}/claim`), { method: "POST", body: { expected_scope: task?.expected_scope || [], lease_minutes: 60 } }));
          }
          if (action === "release-task") {
            const reason = prompt("Why are you releasing this task?", "Returning it to the shared queue.");
            if (reason === null) return;
            await mutate(`${button.dataset.task} released`, () => api(pathFor(`/tasks/${encodeURIComponent(button.dataset.task)}/release`), { method: "POST", body: { reason } }));
          }
          if (action === "resolve-decision") {
            const rationale = prompt(`Rationale for marking ${button.dataset.decision} ${button.dataset.resolution}:`, "");
            if (rationale === null) return;
            await mutate(`${button.dataset.decision} ${button.dataset.resolution}`, () => api(pathFor(`/decisions/${encodeURIComponent(button.dataset.decision)}/resolve`), { method: "POST", body: { resolution: button.dataset.resolution, rationale } }));
          }
          if (action === "verify-ledger") {
            state.data.verify = await mutate("Ledger verified", () => api(pathFor("/verify")));
            render();
          }
          if (action === "mark-inbox-read") {
            await mutate("Inbox marked read", () => api(pathFor("/inbox?mark_read=1&limit=100")));
          }
          if (action === "download-export") {
            const originalLabel = button.textContent;
            button.disabled = true;
            button.textContent = "Preparing…";
            busy(true);
            try {
              const filename = await downloadProjectExport(button.dataset.format);
              toast(`${filename} downloaded`);
            } finally {
              busy(false);
              button.disabled = false;
              button.textContent = originalLabel;
            }
          }
          if (action === "remove-bridge") {
            if (!confirm(`Delete the workspace relationship with ${button.dataset.project}? This disconnects the inter-project room entirely. To change who can participate while keeping the relationship, Cancel and use Save participation.`)) return;
            await mutate(`Relationship with ${button.dataset.project} deleted`, () => api(pathFor(`/bridges/${encodeURIComponent(button.dataset.project)}`), { method: "DELETE" }));
          }
          if (action === "open-connected-room") {
            state.roomConversation = button.dataset.project;
            resetFeed("room");
            state.view = "room";
            history.replaceState(null, "", "#room");
            render({ force: true, feedTransition: "room" });
            content.focus({ preventScroll: true });
          }
          if (action === "swap-room-workspace") {
            await selectProject(button.dataset.project,
                                button.dataset.conversation || "local");
          }
          if (action === "review-room-feed") {
            $("#room-conversation-feed")?.scrollIntoView({ behavior: "smooth", block: "start" });
          }
          if (action === "room-older") navigateFeed("room", -1);
          if (action === "room-newer") navigateFeed("room", 1);
          if (action === "room-newest") navigateFeed("room", "newest");
          if (action === "activity-older") navigateFeed("activity", -1);
          if (action === "activity-newer") navigateFeed("activity", 1);
          if (action === "activity-newest") navigateFeed("activity", "newest");
          if (action === "toggle-rule") {
            const enabled = button.dataset.enabled !== "true";
            await mutate(`${button.dataset.rule} ${enabled ? "enabled" : "disabled"}`, () => api(pathFor(`/rules/${encodeURIComponent(button.dataset.rule)}`), { method: "PUT", body: { enabled, expected_version: Number(button.dataset.version) } }));
          }
        } catch (error) {
          if (!error.attaccaShown) toast(error.message, "error");
        }
      });

      document.addEventListener("change", async event => {
        try {
          if (event.target.id === "project-select" && event.target.value) await selectProject(event.target.value);
          if (event.target.id === "room-workspace" && event.target.value) {
            const previousSource = state.projectId;
            const nextSource = event.target.value;
            const nextConversation = state.roomConversation !== "local" && state.roomConversation === nextSource
              ? previousSource
              : "local";
            await selectProject(nextSource, nextConversation);
          }
          if (event.target.id === "room-conversation") {
            state.roomConversation = event.target.value;
            resetFeed("room");
            await loadProjectData({ quiet: true });
          }
          if (event.target.matches("[data-participation-select]")) {
            const form = event.target.closest("form");
            const side = event.target.dataset.participationSide;
            const field = form?.querySelector(`[data-selected-agents-side="${side}"]`);
            const input = field?.querySelector("input");
            const selectedAgents = event.target.value === "selected_agents";
            if (field) field.hidden = !selectedAgents;
            if (input) {
              input.disabled = !selectedAgents;
              input.required = selectedAgents;
              if (selectedAgents) input.focus();
            }
          }
          if (event.target.matches("[data-agent-pick]")) {
            const form = event.target.closest("form");
            const isNew = event.target.value === "__new__";
            form.querySelectorAll("[data-new-actor]").forEach(el => { el.hidden = !isNew; });
            const newId = form.querySelector('[name="agent_id_new"]');
            if (newId) { newId.required = isNew; if (isNew) newId.focus(); }
            if (!isNew) {
              const agent = (state.data.agents?.agents || []).find(a => a.agent_id === event.target.value);
              if (agent) {
                const roleSel = form.querySelector('[name="role"]');
                if (roleSel && agent.role) roleSel.value = agent.role;
                const nameInput = form.querySelector('[name="display_name"]');
                if (nameInput) nameInput.value = agent.display_name || "";
              }
            }
          }
          if (event.target.id === "task-filter") { state.taskFilter = event.target.value; render(); }
          if (event.target.matches("[data-plan-version]") && event.target.value) {
            await openTaskPlan(
              event.target.dataset.planVersion,
              Number(event.target.value));
          }
          if (event.target.matches("[data-status-select]") && event.target.value) {
            const taskId = event.target.dataset.statusSelect;
            const status = event.target.value;
            const reason = prompt(`Reason for setting ${taskId} to ${status}:`, "Updated in the web panel.");
            if (reason === null) { event.target.value = ""; return; }
            try { await mutate(`${taskId} moved to ${status}`, () => api(pathFor(`/tasks/${encodeURIComponent(taskId)}/status`), { method: "POST", body: { status, reason } })); }
            catch (_) { event.target.value = ""; }
          }
        } catch (error) {
          busy(false);
          toast(error.message, "error");
        }
      });

      document.addEventListener("input", event => {
        if (event.target.id === "task-search") {
          state.taskSearch = event.target.value;
          const cursor = event.target.selectionStart;
          render();
          const next = $("#task-search");
          next?.focus(); next?.setSelectionRange(cursor, cursor);
        }
        if (event.target.id === "activity-search") {
          state.activityFilter = event.target.value;
          const cursor = event.target.selectionStart;
          resetFeed("activity");
          render({ force: true, feedTransition: "activity" });
          const next = $("#activity-search");
          next?.focus(); next?.setSelectionRange(cursor, cursor);
        }
        if (event.target.id === "rule-search") {
          state.ruleFilter = event.target.value;
          const cursor = event.target.selectionStart;
          render();
          const next = $("#rule-search");
          next?.focus(); next?.setSelectionRange(cursor, cursor);
        }
      });

      document.addEventListener("scroll", event => {
        const feed = event.target?.id === "room-feed" ? event.target
          : event.target?.id === "activity-feed" ? event.target : null;
        if (!feed) return;
        const kind = feed.id === "room-feed" ? "room" : "activity";
        const nearNewest = feedNearNewest(kind, feed);
        state[`${kind}Feed`].followNewest = nearNewest;
        if (nearNewest && state[`${kind}Feed`].newCount) {
          state[`${kind}Feed`].newCount = 0;
          const indicator = $(`[data-action="${kind}-newest"]`);
          if (indicator) indicator.hidden = true;
        }
      }, true);

      document.addEventListener("submit", async event => {
        const form = event.target.closest("form[data-form]");
        if (!form) return;
        event.preventDefault();
        const formData = new FormData(form);
        const values = Object.fromEntries(formData);
        const kind = form.dataset.form;
        const submit = form.querySelector("button[type=submit]");
        if (submit) submit.disabled = true;
        try {
          if (kind === "auth-bootstrap") {
            state.auth = await api("/v1/auth/bootstrap", { method: "POST", body: { username: values.username.trim(), display_name: values.display_name.trim(), password: values.password } });
            form.reset();
            await bootstrap();
            toast("Administrator created; compatibility mode is unchanged");
          }
          if (kind === "auth-login") {
            state.auth = await api("/v1/auth/login", { method: "POST", body: { username: values.username.trim(), password: values.password } });
            state.invitationAcceptanceError = "";
            form.reset();
            await bootstrap();
            toast("Signed in");
          }
          if (kind === "accept-human-invitation") {
            const invitationToken = state.pendingInvitationToken;
            if (!invitationToken) throw new Error("The one-time invitation token is no longer available.");
            const username = values.username.trim();
            const password = values.password;
            try {
              const accepted = await api("/v1/auth/invitations/accept", { method: "POST", body: {
                invitation_token: invitationToken,
                username, password,
                display_name: values.display_name?.trim() || null
              } });
              if (accepted.accepted !== true || accepted.login_required !== true || accepted.login_endpoint !== "/v1/auth/login") {
                throw new Error("The server did not return the expected invitation login handoff.");
              }
              state.pendingInvitationToken = "";
              state.invitationAcceptanceError = "";
              state.auth = await api(accepted.login_endpoint, { method: "POST", body: { username, password } });
              form.reset();
              await bootstrap();
              toast("Invitation accepted; signed in as your own human account");
            } catch (error) {
              state.invitationAcceptanceError = error.message || String(error);
              renderAuth();
              throw error;
            }
          }
          if (kind === "approve-terminal-enrollment") {
            if (state.credentialAccess?.capabilities?.terminal_enrollment !== true) throw new Error("Terminal enrollment approval is not enabled on this server.");
            const code = form.dataset.code;
            if (!code) throw new Error("The pending terminal enrollment has no approval code.");
            const projectMemberships = formData.getAll("project_memberships").map(String);
            if (!projectMemberships.length) throw new Error("Select at least one workspace membership for this terminal.");
            const actorBindings = formData.getAll("actor_bindings").map(value => {
              try { return JSON.parse(String(value)); }
              catch (_) { throw new Error("An AI actor binding is malformed; refresh before approving."); }
            });
            const selectedMemberships = new Set(projectMemberships);
            const knownBindings = new Set(Object.entries(state.workspaceAgents || {}).flatMap(([projectId, records]) =>
              records.map(agent => `${projectId}\u0000${agent.agent_id}`)));
            actorBindings.forEach(binding => {
              if (!selectedMemberships.has(binding.project_id)) throw new Error(`AI actor ${binding.actor_id} belongs to ${binding.project_id}, which is not an approved terminal membership.`);
              if (!knownBindings.has(`${binding.project_id}\u0000${binding.actor_id}`)) throw new Error(`AI actor ${binding.actor_id} is not registered in workspace ${binding.project_id}.`);
            });
            const body = { project_memberships: projectMemberships, actor_bindings: actorBindings };
            if (values.expires_at) body.expires_at = new Date(values.expires_at).toISOString();
            await api(`/v1/auth/terminal-enrollments/${encodeURIComponent(code)}/approve`, { method: "POST", body });
            if (state.targetedEnrollmentCode === code) state.targetedEnrollmentCode = "";
            state.activationArmedVersion = null;
            state.credentialAccess = await loadCredentialAccess();
            render({ force: true });
            toast("Terminal enrollment approved; the credential is delivered only to that terminal");
          }
          if (kind === "save-migration-scope") {
            if (state.credentialAccess?.capabilities?.migration_scope !== true) throw new Error("Migration-scope management is not enabled on this server.");
            if (state.auth?.user?.is_owner !== true) throw new Error("Only the server owner may change migration scope.");
            const requiredClients = [];
            const exclusions = [];
            $$('[data-migration-target]', form).forEach(row => {
              const checkbox = $('[name="required_clients"]', row);
              const reasonInput = $('[data-exclusion-for]', row);
              const client = {
                project_id: checkbox?.dataset.project || "",
                actor_id: checkbox?.dataset.actor || "",
                device_id: checkbox?.dataset.device || ""
              };
              if (!client.project_id || !client.actor_id || !client.device_id) throw new Error("A migration target is missing its exact workspace, actor, or device identity.");
              if (checkbox.checked) requiredClients.push(client);
              else {
                const reason = reasonInput?.value?.trim() || "";
                if (!reason) throw new Error(`Explain why excluded client ${client.device_id} is not required for activation.`);
                exclusions.push({ ...client, reason });
              }
            });
            await api("/v1/auth/migration-scope", { method: "POST", body: {
              expected_readiness_version: state.credentialAccess?.compatibility?.readiness_version,
              required_clients: requiredClients, exclusions
            } });
            state.activationArmedVersion = null;
            state.credentialAccess = await loadCredentialAccess();
            render({ force: true });
            toast("Active-client migration scope saved with explicit exclusions");
          }
          if (kind === "create-service-key") {
            if (state.credentialAccess?.capabilities?.service_keys !== true) throw new Error("Service-key enrollment is not enabled on this server.");
            const projectMemberships = formData.getAll("project_memberships").map(String);
            if (!projectMemberships.length) throw new Error("Select at least one workspace for the service key.");
            const actorBindings = formData.getAll("actor_bindings").map(value => {
              try { return JSON.parse(String(value)); }
              catch (_) { throw new Error("An allowed AI actor binding is malformed; refresh and retry."); }
            });
            const selectedWorkspaces = new Set(projectMemberships);
            const knownBindings = new Set(Object.entries(state.workspaceAgents || {}).flatMap(([projectId, records]) =>
              records.map(agent => `${projectId}\u0000${agent.agent_id}`)));
            actorBindings.forEach(binding => {
              if (!selectedWorkspaces.has(binding.project_id)) throw new Error(`Allowed AI actor ${binding.actor_id} is outside the selected service-key workspace scope.`);
              if (!knownBindings.has(`${binding.project_id}\u0000${binding.actor_id}`)) throw new Error(`Allowed AI actor ${binding.actor_id} is not registered in workspace ${binding.project_id}.`);
            });
            const body = {
              label: values.label.trim(),
              project_memberships: projectMemberships, actor_bindings
            };
            if (values.expires_at) body.expires_at = new Date(values.expires_at).toISOString();
            const result = await api("/v1/auth/service-keys", { method: "POST", body });
            if (typeof result.token !== "string" || !result.token.startsWith("atsvc_")) throw new Error("The server created a service key without returning its one-time credential.");
            state.oneTimeCredential = {
              kind: "service", secret: result.token,
              label: result.record?.label || body.label,
              expires_at: result.record?.expires_at || null
            };
            if (result.record && typeof result.record === "object") {
              const access = state.credentialAccess || emptyCredentialAccess();
              state.credentialAccess = {
                ...access,
                service_keys: [result.record, ...(access.service_keys || []).filter(
                  record => record.token_id !== result.record.token_id)]
              };
            }
            form.reset();
            render({ force: true });
            toast("Service key created; copy the one-time credential now");
          }
          if (kind === "invite-human") {
            if (state.credentialAccess?.capabilities?.invitations !== true) throw new Error("Human invitations are not enabled on this server.");
            if (state.auth?.user?.is_admin !== true) throw new Error("Administrator access is required to create a human invitation.");
            const projectMemberships = formData.getAll("project_memberships").map(String);
            if (!projectMemberships.length) throw new Error("Select at least one workspace for the invited human.");
            const isAdmin = formData.has("is_admin");
            if (isAdmin && state.auth?.user?.is_owner !== true) throw new Error("Only the server owner may invite an administrator.");
            const body = {
              label: values.label.trim(),
              project_memberships: projectMemberships,
              is_admin: isAdmin
            };
            if (values.expires_at) body.expires_at = new Date(values.expires_at).toISOString();
            const result = await api("/v1/auth/invitations", { method: "POST", body });
            if (typeof result.invitation_token !== "string" || !result.invitation_token.startsWith("ati_")) throw new Error("The server created an invitation without returning its one-time token.");
            const link = invitationAcceptanceLink(result.verification_uri, result.invitation_token);
            if (!link) throw new Error("The invitation response could not be converted into a safe acceptance link.");
            state.oneTimeCredential = {
              kind: "invitation", secret: result.invitation_token, link,
              label: result.record?.label || body.label,
              expires_at: result.record?.expires_at || null
            };
            if (result.record && typeof result.record === "object") {
              const access = state.credentialAccess || emptyCredentialAccess();
              state.credentialAccess = {
                ...access,
                invitations: [result.record, ...(access.invitations || []).filter(
                  record => record.invitation_id !== result.record.invitation_id)]
              };
            }
            form.reset();
            render({ force: true });
            toast("Human invitation created; copy its one-time acceptance link now");
          }
          if (kind === "save-panel-behavior") {
            state.prefs = { ...state.prefs, autoRefresh: values.autoRefresh === "true", refreshSeconds: Math.max(5, Math.min(300, Number(values.refreshSeconds) || 15)) };
            savePrefs();
            render({ force: true });
            toast("Browser settings saved");
          }
          if (kind === "create-workspace") {
            const body = { name: values.name };
            if (values.project_id) body.project_id = values.project_id;
            if (values.repository_fingerprint) body.repository_fingerprint = values.repository_fingerprint;
            busy(true);
            const result = await api("/v1/projects", { method: "POST", body });
            await loadProjects();
            toast(result.already_existed ? "Workspace already existed; opened it" : "Workspace created");
            await selectProject(result.project_id);
            form.reset();
          }
          if (kind === "create-task") {
            await mutate("Task created", () => api(pathFor("/tasks"), { method: "POST", body: { title: values.title, description: values.description || null, expected_scope: list(values.expected_scope), dependencies: list(values.dependencies), risk_level: values.risk_level, plan_required: values.plan_required === "true" } }));
            form.reset();
          }
          if (kind === "set-task-plan") {
            const body = {
              title: values.title,
              overview: values.overview || "",
              sections: parsePlanSectionsMarkdown(values.sections_markdown),
              submit_for_review: values.submit_for_review === "true"
            };
            if (values.expected_version !== undefined && values.expected_version !== "") body.expected_version = Number(values.expected_version);
            await mutate(`${form.dataset.task} plan saved`, () => api(pathFor(`/tasks/${encodeURIComponent(form.dataset.task)}/plan`), { method: "PUT", body }));
            state.taskPlan.edit = false;
            render({ force: true });
          }
          if (kind === "report-task") {
            let evidence = [];
            if (values.evidence.trim()) {
              evidence = JSON.parse(values.evidence);
              if (!Array.isArray(evidence) || !evidence.every(item => item && typeof item === "object" && !Array.isArray(item))) throw new Error("Evidence must be a JSON array of objects.");
            }
            await mutate(`${form.dataset.task} reported`, () => api(pathFor(`/tasks/${encodeURIComponent(form.dataset.task)}/report`), { method: "POST", body: { summary: values.summary, requested_state: values.requested_state, evidence } }));
          }
          if (kind === "send-room") {
            const body = { body: values.body, msg_type: values.msg_type };
            if (values.task_id) body.task_id = values.task_id;
            if (values.mentions) body.mentions = list(values.mentions);
            if (values.reply_to) body.reply_to = values.reply_to;
            body.target_project = values.target_project || state.projectId;
            await mutate("Message sent", () => api(pathFor("/room"), { method: "POST", body }));
            form.reset();
          }
          if (kind === "propose-decision") {
            await mutate("Decision proposed", () => api(pathFor("/decisions"), { method: "POST", body: { title: values.title, detail: values.detail || null, rationale: values.rationale || null } }));
            form.reset();
          }
          if (kind === "create-rule") {
            await mutate("Project rule created", () => api(pathFor("/rules"), { method: "POST", body: { title: values.title, body: values.body, scope: values.scope, priority: Number(values.priority) } }));
            form.reset();
          }
          if (kind === "update-rule") {
            await mutate(`${form.dataset.rule} updated`, () => api(pathFor(`/rules/${encodeURIComponent(form.dataset.rule)}`), { method: "PUT", body: { title: values.title, body: values.body, scope: values.scope, priority: Number(values.priority), expected_version: Number(values.expected_version) } }));
          }
          if (kind === "save-cloud-context") {
            await mutate("Cloud context saved", () => api(pathFor("/cloud-context"), { method: "PUT", body: { content: values.content || "", expected_version: Number(values.expected_version) } }));
          }
          if (kind === "update-handoff") {
            const body = { expected_context_version: state.data.handoff?.context_version };
            HANDOFF_FIELDS.forEach(field => { body[field] = values[field] || ""; });
            await mutate("Handoff updated", () => api(pathFor("/handoff"), { method: "PUT", body }));
          }
          if (kind === "search-project") {
            state.searchQuery = values.query.trim();
            state.searchResults = await api(pathFor(`/search?q=${encodeURIComponent(state.searchQuery)}&limit=50`));
            render();
            toast(`${state.searchResults.total_hits} project-memory matches`);
          }
          if (kind === "append-event") {
            let payload;
            try { payload = JSON.parse(values.payload); }
            catch (_) { throw new Error("Payload must be valid JSON."); }
            if (!payload || Array.isArray(payload) || typeof payload !== "object") throw new Error("Payload must be a JSON object.");
            await mutate("Event appended", () => api(pathFor("/events"), { method: "POST", body: { event_type: values.event_type, payload, task_id: values.task_id || null } }));
            form.reset();
          }
          if (kind === "save-runtime") {
            state.serverSettings = await api("/v1/settings", { method: "PUT", body: { default_project: values.default_project || null, verbose: values.verbose === "true", update_interval_seconds: Number(values.update_interval_seconds) } });
            toast("Server runtime settings applied");
            render();
          }
          if (kind === "set-lead") {
            await mutate("Lead director updated", () => api(pathFor("/lead"), { method: "PUT", body: { agent_id: values.agent_id || null } }));
          }
          if (kind === "add-bridge") {
            const body = {
              other_project: values.other_project,
              participation: values.participation,
              selected_agents: values.participation === "selected_agents" ? list(values.selected_agents) : [],
              peer_participation: values.peer_participation,
              peer_selected_agents: values.peer_participation === "selected_agents" ? list(values.peer_selected_agents) : []
            };
            const principal = values.principal_side === "other" ? values.other_project : state.projectId;
            if (values.relation === "master") body.boss = principal;
            if (values.relation === "advisor") body.advisor = principal;
            await mutate(`Bridge to ${values.other_project} created`, () => api(pathFor("/bridges"), { method: "POST", body }));
          }
          if (kind === "update-bridge-participation") {
            const body = {
              participation: values.participation,
              selected_agents: values.participation === "selected_agents" ? list(values.selected_agents) : [],
              peer_participation: values.peer_participation,
              peer_selected_agents: values.peer_participation === "selected_agents" ? list(values.peer_selected_agents) : []
            };
            await mutate(`Participation for ${form.dataset.project} updated`, () => api(pathFor(`/bridges/${encodeURIComponent(form.dataset.project)}`), { method: "PUT", body }));
          }
          if (kind === "register-agent") {
            const agentId = values.agent_id === "__new__" ? (values.agent_id_new || "").trim() : values.agent_id;
            if (!agentId) throw new Error("Pick an AI agent, or choose \"Register a new actor\" and enter its canonical ID.");
            await mutate("AI role saved", () => api(pathFor("/agents"), { method: "POST", body: { agent_id: agentId, display_name: values.display_name || null, role: values.role || null, runtime: values.runtime || null } }));
            form.reset();
          }
        } catch (error) {
          toast(error.message, "error");
        } finally {
          busy(false);
          if (submit) submit.disabled = false;
        }
      });

      $("#refresh-button").addEventListener("click", async () => {
        try {
          busy(true);
          await bootstrap();
          toast("Control room refreshed");
        } catch (error) { toast(error.message, "error"); }
        finally { busy(false); }
      });

      window.addEventListener("hashchange", () => {
        const invitationToken = consumeInvitationTokenFromLocation();
        if (invitationToken) {
          state.pendingInvitationToken = invitationToken;
          state.invitationAcceptanceError = "";
          state.view = "settings";
          renderAuth();
          return;
        }
        const view = viewFromLocationHash();
        if (VIEWS.includes(view)) { state.view = view; render(); }
      });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && state.prefs.autoRefresh && state.projectId) loadProjectData({ quiet: true });
      });

      bootstrap().catch(error => {
        state.loading = false;
        try { busy(false); } catch (_) { /* the failure boundary must render */ }
        try { updateChrome(); } catch (_) { /* retain the primary error */ }
        content.innerHTML = `<div class="page-head"><div><div class="eyebrow">Control room error</div><h1>Attacca could not finish loading</h1><p>The server responded, but the browser stopped while starting the panel.</p></div></div><div class="notice error"><span>!</span><div><strong>${h(error?.message || error || "Unknown browser error")}</strong><br>Hard-refresh this page. If it repeats, copy this exact message so the failing browser feature can be identified.</div></div>`;
      });
    })();
  </script>
</body>
</html>
