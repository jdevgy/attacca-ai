        clearInterval(state.poller);
        if (!state.prefs.autoRefresh) return;
        const delay = Math.max(5, Math.min(300, Number(state.prefs.refreshSeconds) || 15)) * 1000;
        state.poller = setInterval(() => {
          if (!state.projectId || document.hidden || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) return;
          loadProjectData({ quiet: true });
        }, delay);
      }

      function pageHead(eyebrow, title, description, actions = "") {
        return `<div class="page-head"><div><div class="eyebrow">${h(eyebrow)}</div><h1>${h(title)}</h1><p>${h(description)}</p></div>${actions ? `<div class="page-actions">${actions}</div>` : ""}</div>`;
      }

      function allErrors() { return Object.entries(state.errors).map(([key, message]) => `${key}: ${message}`).join(" · "); }

      function applyCredentialCapabilityGates() {
        const capabilities = state.credentialAccess?.capabilities || {};
        const serviceForm = $('form[data-form="create-service-key"]', content);
        if (serviceForm) {
          const actorField = $$(".field", serviceForm).find(field =>
            field.querySelector("label")?.textContent?.includes("Exact allowed AI actors"));
          const cluster = actorField?.querySelector(".cluster");
          if (cluster) {
            cluster.replaceChildren();
            const directory = state.projects.flatMap(project =>
              (state.workspaceAgents?.[project.project_id] || []).map(agent => ({ project_id: project.project_id, agent })));
            if (!directory.length) {
              const unavailable = document.createElement("span");
              unavailable.className = "muted";
              unavailable.textContent = "No registered actors are available in the selected workspace memberships.";
              cluster.append(unavailable);
            }
            directory.forEach(({ project_id: projectId, agent }) => {
              const label = document.createElement("label");
              label.className = "chip";
              const input = document.createElement("input");
              input.type = "checkbox";
              input.name = "actor_bindings";
              input.value = JSON.stringify({ project_id: projectId, actor_id: agent.agent_id });
              label.append(input, document.createTextNode(` ${projectId} · ${agent.agent_id}`));
              cluster.append(label);
            });
          }
        }
        const gates = [
          ['form[data-form="approve-terminal-enrollment"]', "terminal_enrollment", "Terminal approval is unavailable until terminal enrollment is enabled."],
          ['form[data-form="save-migration-scope"]', "migration_scope", "Migration-scope editing is not enabled by this server."],
          ['form[data-form="create-service-key"]', "service_keys", "Service-key enrollment is not enabled yet; no unusable key can be created from this panel."],
          ['form[data-form="invite-human"]', "invitations", "Human invitations are not enabled yet. This panel will not create a credential that impersonates another person."]
        ];
        gates.forEach(([selector, capability, message]) => {
          $$(selector, content).forEach(form => {
            if (capabilities[capability] === true) return;
            form.hidden = true;
            const notice = document.createElement("div");
            notice.className = "notice section-gap";
            notice.dataset.capabilityNotice = capability;
            const icon = document.createElement("span");
            icon.textContent = "i";
            const body = document.createElement("div");
            const strong = document.createElement("strong");
            strong.textContent = "Unavailable in this server build.";
            body.append(strong, document.createElement("br"), document.createTextNode(message));
            notice.append(icon, body);
            form.before(notice);
          });
        });
        if (capabilities.terminal_enrollment !== true) {
          $$('[data-action="deny-terminal-enrollment"], [data-action="revoke-terminal"]', content)
            .forEach(button => { button.disabled = true; button.title = "Terminal credential management is unavailable."; });
        }
        if (capabilities.service_keys !== true) {
          $$('[data-action="revoke-service-key"]', content)
            .forEach(button => { button.disabled = true; button.title = "Service-key management is unavailable."; });
        }
        if (capabilities.invitations !== true) {
          $$('[data-action="revoke-invitation"]', content)
            .forEach(button => { button.disabled = true; button.title = "Human invitation management is unavailable."; });
        }
        const targetCode = state.targetedEnrollmentCode;
        if (targetCode) {
          const matches = $$('[data-enrollment-code]', content)
            .filter(panel => panel.dataset.enrollmentCode === targetCode);
          if (matches.length === 1) {
            const panel = matches[0];
            panel?.classList.add("targeted");
            if (panel) panel.dataset.targetedEnrollment = "true";
            if (panel?.parentElement) panel.parentElement.prepend(panel);
            const cluster = panel?.querySelector(".cluster");
            if (cluster) {
              const badge = document.createElement("span");
              badge.className = "badge accepted";
              badge.textContent = "opened from this terminal";
              cluster.append(badge);
            }
          } else state.targetedEnrollmentCode = "";
        }
        const directoryErrors = Object.entries(state.workspaceAgentErrors || {});
        if (directoryErrors.length) {
          const terminalForm = $('form[data-form="approve-terminal-enrollment"]', content);
          const notice = document.createElement("div");
          notice.className = "notice error section-gap";
          notice.textContent = `Actor inventory could not be loaded for: ${directoryErrors.map(([projectId]) => projectId).join(", ")}. Enrollment approval cannot silently bind actors from those workspaces.`;
          terminalForm?.closest(".bridge-panel")?.before(notice);
        }
      }

      function render({ force = false, feedTransition = null } = {}) {
        const viewport = captureFeedViewport();
        const context = { viewport, feedTransition, feedResetApplied: null };
        state.renderContext = context;
        updateChrome();
        if (!state.auth?.authenticated) {
          renderAuth();
          state.renderContext = null;
          return true;
        }
        if (!state.projectId && state.view !== "workspaces" && state.view !== "settings") state.view = "workspaces";
        const renderer = {
          overview: renderOverview,
          workspaces: renderWorkspaces,
          tasks: renderTasks,
          room: renderRoom,
          rules: renderRules,
          context: renderCloudContext,
          network: renderNetwork,
          decisions: renderDecisions,
          handoff: renderHandoff,
          activity: renderActivity,
          settings: renderAuthenticatedSettings
        }[state.view];
        try {
          const html = renderer();
          const key = `${state.projectId || "none"}:${state.view}`;
          if (!shouldReplaceRender(state.renderedKey, state.renderedHtml, key, html, force)) return false;
          content.innerHTML = html;
          if (state.view === "settings") applyCredentialCapabilityGates();
          state.renderedKey = key;
          state.renderedHtml = html;
          updateChrome();
          restoreFeedViewport(viewport, feedTransition, context.feedResetApplied);
          return true;
        } finally {
          state.renderContext = null;
        }
      }

      function renderOverview() {
        const project = currentProject() || {};
        const tasks = state.data.tasks?.tasks || [];
        const decisions = state.data.decisions?.decisions || [];
        const agents = state.data.agents?.agents || [];
        const handoff = state.data.handoff || {};
        const status = state.data.status || {};
        const counts = status.counts || {};
        const openTasks = tasks.filter(task => !["done", "cancelled"].includes(task.status));
        const claimed = tasks.filter(task => task.status === "claimed").length;
        const proposed = decisions.filter(decision => decision.status === "proposed").length;
        const recent = (state.data.log?.log || []).slice(-7).reverse();
        const verify = state.data.verify;
        const freshness = state.data.freshness;
        return pageHead("Project pulse", project.name || project.project_id, "One screen for the current state, active work, and what changed.", `<button class="button" data-view="room">Message room</button><button class="button primary" data-view="tasks">Create task</button>`) +
          (allErrors() ? errorNotice(allErrors()) : "") +
          `<div class="grid metrics">
            <section class="card metric"><div class="label">Ledger events</div><div class="value">${Number(counts.events ?? project.events ?? state.data.events?.events?.length ?? 0).toLocaleString()}</div><div class="sub">${verify?.ok ? "Chain verified" : verify ? "Verification needs attention" : "Verification unavailable"}</div></section>
            <section class="card metric"><div class="label">Open tasks</div><div class="value">${h(counts.open_tasks ?? openTasks.length)}</div><div class="sub">${h(counts.claimed_tasks ?? claimed)} currently claimed</div></section>
            <section class="card metric"><div class="label">Open decisions</div><div class="value">${h(counts.open_decisions ?? proposed)}</div><div class="sub">${decisions.length} total records</div></section>
            <section class="card metric"><div class="label">Known workers</div><div class="value">${h(counts.agents ?? agents.length)}</div><div class="sub">Context version ${h(status.context_version ?? handoff.context_version ?? project.context_version ?? "—")}</div></section>
          </div>
          <div class="card handoff-hero section-gap">
            <div class="cluster"><span class="badge accepted">Current handoff</span><span class="faint small">Updated ${h(relativeTime(handoff.handoff_updated_at))} by ${h(actorDisplay(handoff.handoff_updated_by || "nobody yet"))}</span></div>
            <div class="handoff-objective">${h(handoff.handoff?.objective || "No objective has been written yet.")}</div>
            <div class="form-actions"><button class="button small" data-view="handoff">Open handoff</button></div>
          </div>
          <div class="grid main-side section-gap">
            <section class="card"><div class="card-head"><h2>Active work</h2><button class="button quiet small" data-view="tasks">View board</button></div><div class="card-body">
              ${openTasks.length ? `<div class="list">${openTasks.slice(0, 7).map(task => `<div class="list-row"><div><div class="list-title">${h(task.task_id)} · ${h(task.title)}</div><div class="list-meta"><span>${h(taskClaimantText(task))}</span><span>${h(task.expected_scope?.length ? `${task.expected_scope.length} scoped path${task.expected_scope.length === 1 ? "" : "s"}` : "scope not set")}</span></div></div><div>${statusBadge(task.status)}</div></div>`).join("")}</div>` : empty("The board is clear", "Create a task when there is work to coordinate.", `<button class="button small primary" data-view="tasks">Create task</button>`) }
            </div></section>
            <section class="card"><div class="card-head"><h2>Recent activity</h2><button class="button quiet small" data-view="activity">Full ledger</button></div><div class="card-body">
              ${recent.length ? `<div class="timeline">${recent.map(line => `<div class="timeline-row"><div class="timeline-line">${h(line)}</div></div>`).join("")}</div>` : empty("No activity yet", "Events will appear as people and agents work.")}
            </div></section>
          </div>
          <div class="grid two section-gap">
            <section class="card"><div class="card-head"><h2>Workers</h2><button class="button quiet small" data-view="settings">Register worker</button></div><div class="card-body">
              ${agents.length ? `<div class="list">${agents.map(agent => `<div class="list-row"><div><div class="list-title">${h(agent.display_name || actorDisplay(agent.agent_id))}</div><div class="list-meta"><span title="${h(agent.agent_id)}">${h(actorDisplay(agent.agent_id))}</span>${ownerChip(agent.owner)}<span>${h(agent.role || "role not set")}</span><span>${h(agent.runtime || "runtime not set")}</span></div></div><div class="faint small">${h(relativeTime(agent.last_seen_at))}</div></div>`).join("")}</div>` : empty("No workers registered", "Workers appear here after they register with this workspace.")}
            </div></section>
            <section class="card"><div class="card-head"><h2>Continuity</h2></div><div class="card-body stack">
              <div class="list-row"><div><div class="list-title">Git branch</div><div class="list-meta"><span>Current server-side checkout</span></div></div><code>${h(handoff.git?.branch || "—")}</code></div>
              <div class="list-row"><div><div class="list-title">Git revision</div><div class="list-meta"><span>Last observed HEAD</span></div></div><code>${h((handoff.git?.head || "—").slice(0, 10))}</code></div>
              <div class="list-row"><div><div class="list-title">Ledger integrity</div><div class="list-meta"><span>${h(verify?.events ?? 0)} checked events</span></div></div>${statusBadge(verify?.ok ? "ok" : "error")}</div>
              <div class="list-row"><div><div class="list-title">Panel briefing</div><div class="list-meta"><span>Context v${h(freshness?.current_context_version ?? status.context_version ?? "—")}</span></div></div>${statusBadge(freshness?.stale === false ? "fresh" : freshness?.stale ? "stale" : "unknown")}</div>
            </div></section>
          </div>`;
      }

      function renderWorkspaces() {
        return pageHead("Server workspaces", "Workspaces", "Create a logical project or switch which one this panel manages.") +
          `<div class="grid main-side">
            <section><div class="grid two">
              ${state.projects.length ? state.projects.map(project => `<article class="card workspace-card ${project.project_id === state.projectId ? "selected" : ""}">
                <div class="workspace-top"><div><div class="cluster"><h2 class="workspace-title">${h(project.name || project.project_id)}</h2>${project.project_id === state.projectId ? `<span class="badge accepted">Selected</span>` : ""}</div><div class="faint mono small" style="margin-top:5px">${h(project.project_id)}</div></div><button class="button small ${project.project_id === state.projectId ? "quiet" : ""}" data-action="select-project" data-project="${h(project.project_id)}" ${project.project_id === state.projectId ? "disabled" : ""}>${project.project_id === state.projectId ? "Active" : "Open"}</button></div>
                <div class="workspace-stats"><div class="workspace-stat"><strong>${Number(project.events || 0).toLocaleString()}</strong><span>Events</span></div><div class="workspace-stat"><strong>${Number(project.open_tasks || 0).toLocaleString()}</strong><span>Open tasks</span></div></div>
                <div class="list-meta"><span>Context v${h(project.context_version)}</span><span>Created ${h(fmtTime(project.created_at))}</span></div>
                ${project.repository_fingerprint ? `<div class="truncate faint mono small" title="${h(project.repository_fingerprint)}" style="margin-top:10px">${h(project.repository_fingerprint)}</div>` : `<div class="faint small" style="margin-top:10px">No Git identity recorded</div>`}
              </article>`).join("") : `<div class="card" style="grid-column:1/-1">${empty("No workspaces yet", "Create the first workspace using the form.")}</div>`}
            </div></section>
            <aside class="card"><div class="card-head"><h2>Create workspace</h2></div><div class="card-body">
              <form data-form="create-workspace">
                <div class="field"><label for="workspace-name">Name</label><input id="workspace-name" name="name" required placeholder="Acme storefront"><span class="help">The human-readable project name.</span></div>
                <div class="field section-gap"><label for="workspace-id">Workspace ID <span class="faint">optional</span></label><input id="workspace-id" name="project_id" placeholder="acme-storefront" pattern="[A-Za-z0-9._-]+"><span class="help">Leave blank to generate it from the name.</span></div>
                <div class="field section-gap"><label for="workspace-fingerprint">Git fingerprint <span class="faint">optional</span></label><input id="workspace-fingerprint" name="repository_fingerprint" placeholder="sha256:…"><span class="help">Use the canonical remote fingerprint when connecting clones.</span></div>
                <div class="form-actions"><button class="button primary" type="submit">Create workspace</button></div>
              </form>
              <div class="notice section-gap"><span>i</span><div><strong>Prototype boundary</strong><br>The current REST API creates and selects workspaces. Rename, archive, delete, and remote-path attachment are not exposed yet.</div></div>
            </div></aside>
          </div>`;
      }

      function renderTasks() {
        const tasks = state.data.tasks?.tasks || [];
        const query = state.taskSearch.toLowerCase();
        const filtered = tasks.filter(task => {
          const matchesFilter = state.taskFilter === "all" || (state.taskFilter === "active" ? !["done", "cancelled"].includes(task.status) : task.status === state.taskFilter);
          const haystack = `${task.task_id} ${task.title} ${task.description || ""} ${(task.expected_scope || []).join(" ")}`.toLowerCase();
          return matchesFilter && (!query || haystack.includes(query));
        });
        return pageHead("Shared task board", "Tasks", "Claim work explicitly, coordinate overlapping paths, and attach evidence when reporting.") +
          (state.errors.tasks ? errorNotice(state.errors.tasks) : "") +
          `<div class="grid main-side">
            <section>
              <div class="filterbar"><input id="task-search" type="search" value="${h(state.taskSearch)}" placeholder="Search tasks…" aria-label="Search tasks"><select id="task-filter" aria-label="Filter task status">${["active","all","queued","claimed","blocked","review","done","cancelled"].map(option => `<option value="${option}" ${option === state.taskFilter ? "selected" : ""}>${option[0].toUpperCase() + option.slice(1)}</option>`).join("")}</select><span class="faint small">${filtered.length} of ${tasks.length}</span></div>
              <div class="stack">${filtered.length ? filtered.map(renderTaskCard).join("") : `<div class="card">${empty("No matching tasks", "Change the filter or create a new task.")}</div>`}</div>
            </section>
            <aside class="card"><div class="card-head"><h2>Create task</h2></div><div class="card-body">
              <form data-form="create-task">
                <div class="field"><label for="task-title">Title</label><input id="task-title" name="title" required placeholder="Add onboarding walkthrough"></div>
                <div class="field section-gap"><label for="task-description">Description</label><textarea id="task-description" name="description" placeholder="What needs to be true when this is done?"></textarea></div>
                <div class="field section-gap"><label for="task-scope">Expected paths</label><input id="task-scope" name="expected_scope" placeholder="src/**, tests/**"><span class="help">Comma-separated paths power overlap warnings.</span></div>
                <div class="field section-gap"><label for="task-dependencies">Dependencies</label><input id="task-dependencies" name="dependencies" placeholder="T-1, T-4"></div>
                <div class="field section-gap"><label for="task-risk">Risk</label><select id="task-risk" name="risk_level"><option>low</option><option selected>medium</option><option>high</option></select></div>
                <div class="field section-gap"><label for="task-plan-required">Detailed plan</label><select id="task-plan-required" name="plan_required"><option value="false" selected>Optional / not yet required</option><option value="true">Required for this large task</option></select><span class="help">A plan has immutable revisions, section review, approvals, and attributed edit suggestions.</span></div>
                <div class="form-actions"><button class="button primary" type="submit">Create task</button></div>
              </form>
            </div></aside>
          </div>`;
      }

      function renderTaskCard(task) {
        const canClaim = ["queued", "blocked", "review"].includes(task.status) || (task.status === "claimed" && task.claimed_by === state.prefs.actor);
        const canReport = !["done", "cancelled"].includes(task.status) && (task.status !== "claimed" || task.claimed_by === state.prefs.actor || task.lease_expired);
        const planReady = !task.plan_required || task.plan?.status === "approved";
        const scope = task.expected_scope || [];
        const attribution = task.attribution || {};
        const claimantText = taskClaimantText(task);
        return `<article class="card task-card">
          <div class="task-top"><div><div class="cluster"><span class="mono muted">${h(task.task_id)}</span>${statusBadge(task.status)}${statusBadge(task.risk_level)}${task.plan ? statusBadge(task.plan.status) : task.plan_required ? `<span class="badge draft">plan required</span>` : ""}</div><h2 class="task-title" style="margin-top:10px">${h(task.title)}</h2></div><div class="faint small">${h(relativeTime(task.updated_at))}</div></div>
          ${task.description ? `<p class="task-description">${h(task.description)}</p>` : ""}
          <div class="task-meta">${scope.map(item => `<span class="chip">${h(item)}</span>`).join("") || `<span class="faint small">No expected paths</span>`}</div>
          <div class="list-meta"><span>Claimant: ${h(claimantText)}</span>${task.lease_until ? `<span>Lease ${h(relativeTime(task.lease_until))}</span>` : ""}${task.dependencies?.length ? `<span>Depends on ${h(task.dependencies.join(", "))}</span>` : ""}</div>
          <div class="list-meta attribution-line">${actionAttribution("Created", attribution.created)}${actionAttribution("Claimed", attribution.claimed)}${actionAttribution("Resolved", attribution.resolved)}</div>
          ${!planReady ? `<div class="notice section-gap"><span>!</span><div><strong>Approval gate active.</strong><br>This required plan is ${h(task.plan?.status || "missing")}. The task may be blocked or returned to queue, but cannot move to review or done until the latest plan is approved.</div></div>` : ""}
          ${task.last_report ? `<details class="section-gap"><summary class="muted small">Latest report</summary><div class="notice section-gap"><div><strong>${h(task.last_report.summary)}</strong><br>${h(attributionText(task.last_report.reported_by, task.last_report.reported_actor_type, task.last_report.reported_owner, attribution.reported?.attribution))} · ${h(fmtTime(task.last_report.reported_at))}</div></div></details>` : ""}
          <div class="task-actions">
            <button class="button small ${task.plan ? "primary" : ""}" type="button" data-action="view-task-plan" data-task="${h(task.task_id)}">${task.plan ? "View plan →" : "Add plan →"}</button>
            ${canClaim ? `<button class="button small" data-action="claim-task" data-task="${h(task.task_id)}">${task.status === "claimed" ? "Renew claim" : "Claim"}</button>` : ""}
            ${task.status === "claimed" && task.claimed_by === state.prefs.actor ? `<button class="button quiet small" data-action="release-task" data-task="${h(task.task_id)}">Release</button>` : ""}
            ${canReport ? `<details style="flex:1 1 100%"><summary class="button small" style="display:inline-flex;align-items:center">Report result</summary><form data-form="report-task" data-task="${h(task.task_id)}" class="section-gap"><div class="form-grid"><div class="field wide"><label>Summary</label><textarea name="summary" required placeholder="What changed and what remains?"></textarea></div><div class="field"><label>Resulting state</label><select name="requested_state"><option value="review" ${planReady ? "selected" : "disabled"}>review${planReady ? "" : " · needs approved plan"}</option><option value="done" ${planReady ? "" : "disabled"}>done${planReady ? "" : " · needs approved plan"}</option><option value="blocked" ${planReady ? "" : "selected"}>blocked</option><option value="queued">queued</option></select></div><div class="field"><label>Evidence JSON</label><input name="evidence" placeholder='[{"kind":"test","result":"pass"}]'></div></div><div class="form-actions"><button class="button primary small" type="submit">Submit report</button></div></form></details>` : ""}
            ${!["claimed"].includes(task.status) ? `<select aria-label="Set status for ${h(task.task_id)}" data-status-select="${h(task.task_id)}" style="width:auto;min-height:32px;padding:4px 30px 4px 8px"><option value="">Set status…</option>${["queued","blocked","review","done","cancelled"].filter(status => status !== task.status).map(status => `<option value="${status}" ${!planReady && ["review","done"].includes(status) ? "disabled" : ""}>${status}${!planReady && ["review","done"].includes(status) ? " · needs approved plan" : ""}</option>`).join("")}</select>` : ""}
          </div>
          ${state.taskPlan.taskId === task.task_id ? renderTaskPlanPanel(task) : ""}
        </article>`;
      }

      function renderTaskPlanEditor(task, plan = null) {
        const expected = plan?.version;
        const submitDefault = !plan || plan.status !== "draft";
        return `<form data-form="set-task-plan" data-task="${h(task.task_id)}" class="plan-editor section-gap">
          ${expected == null ? "" : `<input type="hidden" name="expected_version" value="${h(expected)}">`}
          <div class="form-grid">
            <div class="field wide"><label>Plan title</label><input name="title" required value="${h(plan?.title || `${task.title} — delivery plan`)}" placeholder="Detailed delivery plan"></div>
            <div class="field wide"><label>Overview</label><textarea name="overview" placeholder="Purpose, constraints, dependencies, risks, and what success looks like.">${h(plan?.overview || "")}</textarea></div>
            <div class="field wide"><label>Detailed sections</label><textarea name="sections_markdown" required placeholder="## Scope [scope]\nDetailed scope…\n\n## Implementation [implementation]\nDetailed sequence…">${h(planSectionsToMarkdown(plan?.sections || []))}</textarea><span class="help">Start every long section with <code>## Heading [stable-id]</code>. Keep the bracketed ID stable across revisions so feedback remains addressable.</span></div>
            <div class="field"><label>After saving</label><select name="submit_for_review"><option value="false" ${submitDefault ? "" : "selected"}>Keep as draft</option><option value="true" ${submitDefault ? "selected" : ""}>Submit for review</option></select></div>
          </div>
          <div class="form-actions"><button class="button quiet small" type="button" data-action="cancel-plan-edit" data-task="${h(task.task_id)}">Cancel</button><button class="button primary small" type="submit">${plan ? "Create revision" : "Create plan"}</button></div>
        </form>`;
      }

      function renderTaskPlanPanel(task) {
        const selected = state.taskPlan;
        if (selected.loading) return `<section class="task-plan-panel"><div class="muted">Loading full plan…</div></section>`;
        if (selected.error) return `<section class="task-plan-panel"><div class="notice error"><span>!</span><div><strong>Plan could not load</strong><br>${h(selected.error)}</div></div><div class="form-actions"><button class="button quiet small" type="button" data-action="close-task-plan">Close</button><button class="button small" type="button" data-action="view-task-plan" data-task="${h(task.task_id)}">Retry</button></div></section>`;
        const payload = selected.data || { plan: null, revisions: [] };
        const plan = payload.plan;
        if (!plan) return `<section class="task-plan-panel"><div class="task-plan-head"><div><div class="eyebrow">Detailed task plan</div><h3>No plan yet</h3><p class="muted small">Use a structured plan for large work, then submit it for human or Director approval and section-level suggestions.</p></div><button class="button quiet small" type="button" data-action="close-task-plan">Close</button></div>${canEditTaskPlan(task) ? renderTaskPlanEditor(task) : `<div class="notice error section-gap"><span>i</span><div><strong>Read-only for this identity.</strong><br>A human, registered Director, or the active task claimant can create the plan.</div></div>`}</section>`;
        const revisions = payload.revisions || [];
        const latestVersion = revisions.reduce((latest, item) => Math.max(latest, Number(item.version) || 0), Number(plan.version) || 0);
        const historical = Number(plan.version) !== latestVersion;
        const editable = canEditTaskPlan(task) && !historical;
        const approvable = canApproveTaskPlan() && !historical && plan.status === "in_review";
        const feedbackOpen = !historical && plan.status === "in_review";
        const actionButtons = historical ? "" : `<div class="cluster">
          ${plan.status === "draft" && editable ? `<button class="button primary small" type="button" data-action="submit-task-plan" data-task="${h(task.task_id)}" data-version="${h(plan.version)}">Submit for review</button>` : ""}
          ${approvable ? `<button class="button primary small" type="button" data-action="approve-task-plan" data-task="${h(task.task_id)}" data-version="${h(plan.version)}">Approve entire plan</button>` : ""}
          ${feedbackOpen ? `<button class="button small" type="button" data-action="suggest-task-plan" data-task="${h(task.task_id)}" data-version="${h(plan.version)}">Suggest overall edit</button>` : ""}
          <button class="button quiet small" type="button" data-action="comment-task-plan" data-task="${h(task.task_id)}" data-version="${h(plan.version)}">Comment</button>
          ${editable ? `<button class="button small" type="button" data-action="edit-task-plan" data-task="${h(task.task_id)}">${plan.status === "draft" ? "Revise draft" : "Create new revision"}</button>` : ""}
        </div>`;
        return `<section class="task-plan-panel" aria-label="Detailed plan for ${h(task.task_id)}">
          <div class="task-plan-head"><div><div class="cluster"><span class="eyebrow">Detailed task plan</span>${statusBadge(plan.status)}${historical ? `<span class="badge done">historical</span>` : `<span class="badge accepted">latest</span>`}</div><h3>${h(plan.title)}</h3><div class="list-meta"><span>version ${h(plan.version)}</span><span>${h(plan.sections?.length || 0)} section${plan.sections?.length === 1 ? "" : "s"}</span><span>authored ${h(fmtTime(plan.authored_at))}</span></div></div><div class="cluster"><label class="field small">Revision<select data-plan-version="${h(task.task_id)}" aria-label="Plan revision">${revisions.map(item => `<option value="${h(item.version)}" ${Number(item.version) === Number(plan.version) ? "selected" : ""}>v${h(item.version)} · ${h(item.status)}</option>`).join("")}</select></label><button class="button quiet small" type="button" data-action="close-task-plan">Close</button></div></div>
          ${plan.overview ? `<div class="task-plan-overview">${h(plan.overview)}</div>` : ""}
          ${!canApproveTaskPlan() && feedbackOpen ? `<div class="notice section-gap"><span>i</span><div><strong>Approval is restricted to a human or registered Director.</strong><br>This identity may still leave attributed comments and edit suggestions.</div></div>` : ""}
          <div class="plan-sections">${(plan.sections || []).map((section, index) => `<article class="plan-section"><div class="task-plan-head"><div><div class="eyebrow">Section ${index + 1} · ${h(section.section_id)}</div><h4>${h(section.title)}</h4></div>${feedbackOpen ? `<div class="cluster">${approvable ? `<button class="button primary small" type="button" data-action="approve-task-plan" data-task="${h(task.task_id)}" data-version="${h(plan.version)}" data-section="${h(section.section_id)}">Approve section</button>` : ""}<button class="button small" type="button" data-action="suggest-task-plan" data-task="${h(task.task_id)}" data-version="${h(plan.version)}" data-section="${h(section.section_id)}">Suggest edit</button><button class="button quiet small" type="button" data-action="comment-task-plan" data-task="${h(task.task_id)}" data-version="${h(plan.version)}" data-section="${h(section.section_id)}">Comment</button></div>` : ""}</div><div class="plan-section-body">${h(section.body)}</div></article>`).join("")}</div>
          ${actionButtons}
          ${selected.edit && editable ? renderTaskPlanEditor(task, plan) : ""}
          <div class="plan-review-history"><div class="eyebrow">Plan activity · immutable attribution</div>${(plan.actions || []).length ? plan.actions.map(action => { const detail = action.payload || {}; return `<div class="plan-review-row"><div class="cluster"><strong>${h(planActionLabel(action.event_type))}</strong>${detail.section_id ? `<span class="chip">${h(detail.section_id)}</span>` : ""}<span class="faint small">${h(fmtTime(action.at))}</span></div>${detail.note ? `<div class="prose small section-gap">${h(detail.note)}</div>` : ""}<div class="list-meta">${actionAttribution("By", action)}</div></div>`; }).join("") : `<div class="muted small">No plan actions recorded for this revision.</div>`}</div>
        </section>`;
      }

      function renderRoom() {
        const allMessages = state.data.room?.messages || [];
        const inbox = state.data.inbox || {};
        const inboxMessages = inbox.messages || [];
        const unreadTotal = inboxUnreadTotal(inbox);
        const bridges = state.data.bridges?.bridges || [];
        const project = currentProject() || {};
        const friendlyName = value => {
          const raw = String(value || "Workspace");
          if (!/[-_]/.test(raw)) return raw;
          return raw.replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim().replace(/(^|\s)([a-z])/g, (_, gap, letter) => gap + letter.toUpperCase());
        };
        const projectName = id => friendlyName(state.projects.find(item => item.project_id === id)?.name || id);
        const sourceName = projectName(state.projectId);
        const bridgeIds = new Set(bridges.map(bridge => bridge.with));
        if (state.roomConversation !== "local" && !bridgeIds.has(state.roomConversation)) state.roomConversation = "local";
        const activeBridge = bridges.find(bridge => bridge.with === state.roomConversation) || null;
        const localConversation = !activeBridge;
        const conversationDenied = Boolean(activeBridge && activeBridge.can_participate === false);
        const messages = allMessages.filter(message => {
          if (conversationDenied) return false;
          if (localConversation) return !message.origin_project && !(message.mirrored_to || []).length;
          return message.origin_project === activeBridge.with || (message.mirrored_to || []).includes(activeBridge.with);
        }).sort((left, right) => (Number(left.seq) || 0) - (Number(right.seq) || 0));
        const roomScope = `${state.projectId}:${state.roomConversation}`;
        const roomPage = prepareFeedPage("room", messages, roomScope, ROOM_PAGE_SIZE);
        const pagedMessages = roomPage.rows;
        const conversationTitle = localConversation
          ? `Local workspace room · ${sourceName}`
          : `${sourceName} ↔ ${projectName(activeBridge.with)}`;
        const inboxActorId = state.prefs.actor;
        const inboxActor = attributionText(inboxActorId, state.prefs.actorType, state.prefs.owner);
        const inboxEmptyText = `There are no unread group-room messages for ${inboxActor}. Every participation-visible non-self message appears here; mentions and replies only assign attention.`;
        const feedAction = `<button class="button small" type="button" data-action="review-room-feed">Review conversation feed</button>`;
        return pageHead("Human + AI channel", `${sourceName} room`, "Choose the source workspace, then open its Local room or one named inter-project conversation. These feeds never mix.", `<button class="button" data-view="network">Manage AI Network</button>`) +
          (state.errors.room || state.errors.inbox ? errorNotice([state.errors.room, state.errors.inbox].filter(Boolean).join(" · ")) : "") +
          `<section class="card"><div class="card-body"><div class="form-grid"><div class="field"><label for="room-workspace">Source workspace</label><select id="room-workspace">${state.projects.map(item => `<option value="${h(item.project_id)}" ${item.project_id === state.projectId ? "selected" : ""}>${h(projectName(item.project_id))} · ${h(item.project_id)}</option>`).join("")}</select><span class="help">Every conversation below is read from this workspace's retained room events.</span></div><div class="field"><label for="room-conversation">Conversation</label><select id="room-conversation"><optgroup label="Local"><option value="local" ${localConversation ? "selected" : ""}>Local workspace room · ${h(sourceName)}</option></optgroup>${bridges.length ? `<optgroup label="Inter-project">${bridges.map(bridge => `<option value="${h(bridge.with)}" ${state.roomConversation === bridge.with ? "selected" : ""}>${h(sourceName)} ↔ ${h(projectName(bridge.with))} · ${h(bridge.relation)}${bridge.can_participate === false ? " · access denied" : ""}</option>`).join("")}</optgroup>` : ""}</select><span class="help">Local excludes bridge traffic. Each inter-project choice shows only that workspace pair, including an explicit denied state when this panel identity cannot participate.</span></div></div>${activeBridge ? `<div class="form-actions"><button class="button quiet small" type="button" data-action="swap-room-workspace" data-project="${h(activeBridge.with)}" data-conversation="${h(state.projectId)}">View this pair from ${h(projectName(activeBridge.with))}</button></div>` : ""}<div class="notice ${conversationDenied ? "error" : ""} section-gap"><span>${localConversation ? "L" : conversationDenied ? "!" : "↔"}</span><div><strong>${h(conversationTitle)}</strong><br>${localConversation ? "Local workspace messages only; incoming and outgoing bridge traffic is excluded." : conversationDenied ? `${h(attributionText(state.prefs.actor, state.prefs.actorType, state.prefs.owner))} is denied by ${h(sourceName)}'s ${h(bridgeParticipationLabel(activeBridge.participation))} participation policy. The ${h(activeBridge.relation)} relationship still exists; a human or registered Director can change access in AI Network without deleting it.` : `Inter-project messages retained in ${h(sourceName)} only; unrelated origins and local-only messages are excluded.`}</div></div></div></section>` +
          `<div class="grid main-side section-gap">
            <section class="card" id="room-conversation-feed"><div class="card-head"><div><h2>${h(conversationTitle)}</h2><span class="faint small">${conversationDenied ? `Messages are hidden by ${h(sourceName)}'s participation policy` : `${h(messages.length)} conversation messages from ${h(allMessages.length)} latest retained in ${h(sourceName)}`}</span></div>${unreadTotal ? `<button class="button quiet small" type="button" data-action="mark-inbox-read">Mark group room read · ${h(unreadTotal)} unread</button>` : `<span class="badge fresh">caught up</span>`}<span class="badge ${conversationDenied ? "error" : localConversation ? "fresh" : "accepted"}">${conversationDenied ? "Access denied" : localConversation ? "Local" : "Inter-project"}</span></div><div class="card-body">
              ${conversationDenied ? empty("Conversation access denied", `${attributionText(state.prefs.actor, state.prefs.actorType, state.prefs.owner)} cannot read or send in this inter-project conversation. The relationship remains connected; change its participation policy in AI Network.`) : messages.length ? `${feedToolbar("room", roomPage, `Latest ${allMessages.length} retained room messages loaded`)}<div class="room-feed" id="room-feed" role="log" aria-label="${h(conversationTitle)} message history" aria-live="off" tabindex="0" data-feed-scope="${h(roomScope)}">${pagedMessages.map(message => `<article class="message" data-feed-key="${h(message.seq)}"><div class="message-head"><span class="message-actor" title="Ledger actor: ${h(message.ledger_actor || message.actor)}">${h(attributionText(message.actor, message.actor_type, message.owner, message.attribution))}</span>${statusBadge(message.msg_type)}${message.broadcast_to_everyone ? `<span class="chip">to everyone</span>` : message.addressed_to_you ? `<span class="chip">your attention</span>` : message.group_context ? `<span class="chip">group context</span>` : ""}${message.origin_project ? `<span class="chip">from ${h(projectName(message.origin_project))}</span>` : (message.mirrored_to || []).length ? `<span class="chip">to ${h(message.mirrored_to.map(projectName).join(", "))}</span>` : `<span class="chip">local · ${h(sourceName)}</span>`}${message.authority ? `<span class="badge">${h(message.authority)}</span>` : ""}</div><div class="message-body">${h(message.body)}</div><div class="message-foot"><span>#${h(message.seq)}</span><span>${h(fmtTime(message.at))}</span>${message.task_id ? `<span>${h(message.task_id)}</span>` : ""}${message.mentions?.length ? `<span>expected responder: ${h(message.mentions.map(actorDisplay).join(", "))}</span>` : ""}${message.reply_to ? `<span>reply ${h(String(message.reply_to).slice(0, 16))}</span>` : ""}</div></article>`).join("")}</div>` : empty(localConversation ? "No local workspace messages" : "No retained messages for this workspace pair", localConversation ? "Send the first local-only message." : "Send the first message across this workspace bridge.")}
            </div></section>
            <aside class="card"><div class="card-head"><h2>Send message</h2></div><div class="card-body">
              ${conversationDenied ? `<div class="notice error"><span>!</span><div><strong>Sending is disabled for this identity.</strong><br>Participation is an access policy, not a relationship state. Ask a human or registered Director to update access in AI Network; do not delete the bridge just to grant access.</div></div>` : `<form data-form="send-room">
                <div class="field"><label for="room-body">Message</label><textarea id="room-body" name="body" required placeholder="Tell the project what matters…"></textarea></div>
                <div class="field section-gap"><label for="room-destination">Destination</label><select id="room-destination" name="target_project"><optgroup label="Local"><option value="${h(state.projectId)}" ${localConversation ? "selected" : ""}>Local workspace room · ${h(sourceName)}</option></optgroup>${bridges.length ? `<optgroup label="Inter-project">${bridges.map(bridge => `<option value="${h(bridge.with)}" ${state.roomConversation === bridge.with ? "selected" : ""} ${bridge.can_participate === false ? "disabled" : ""}>${h(sourceName)} ↔ ${h(projectName(bridge.with))} · ${h(bridge.relation)}${bridge.can_participate === false ? " · access denied" : ""}</option>`).join("")}</optgroup>` : ""}</select><span class="help">A bridge destination is retained on both workspace rooms; Local stays only in ${h(sourceName)}. Denied destinations cannot be selected.</span></div>
                <div class="form-grid section-gap"><div class="field"><label for="room-type">Type</label><select id="room-type" name="msg_type">${["chat","directive","claim","handoff","challenge","decision","approval","status","system"].map(type => `<option>${type}</option>`).join("")}</select></div><div class="field"><label for="room-task">Task ID</label><input id="room-task" name="task_id" placeholder="T-13"></div><div class="field"><label for="room-mentions">Mention</label><input id="room-mentions" name="mentions" placeholder="workspace.role.runtime"></div><div class="field"><label for="room-reply">Reply to message</label><select id="room-reply" name="reply_to"><option value="">No reply</option>${messages.filter(message => message.event_id).map(message => `<option value="${h(message.event_id)}">#${h(message.seq)} · ${h(actorDisplay(message.actor))} · ${h(String(message.body || "").slice(0, 34))}</option>`).join("")}</select></div></div>
                <div class="form-actions"><button class="button primary" type="submit">Send to room</button></div>
              </form>`}
              <div class="notice section-gap"><span>i</span><div>Use room messages for coordination. Create a task for owned work and a decision for a durable project choice; chat alone records neither.</div></div>
            </div></aside>
          </div>`;
      }

      function renderDecisions() {
        const decisions = [...(state.data.decisions?.decisions || [])].reverse();
        return pageHead("Durable choices", "Decisions", "Capture the choice, why it exists, and whether the project accepted it.") +
          (state.errors.decisions ? errorNotice(state.errors.decisions) : "") +
          `<div class="grid main-side"><section class="stack">
            ${decisions.length ? decisions.map(decision => `<article class="card decision-card"><div class="decision-top"><div><div class="cluster"><span class="mono muted">${h(decision.decision_id)}</span>${statusBadge(decision.status)}</div><h2 class="decision-title" style="margin-top:10px">${h(decision.title)}</h2></div><span class="faint small">${h(fmtTime(decision.created_at))}</span></div>${decision.detail ? `<p class="decision-detail">${h(decision.detail)}</p>` : ""}${decision.rationale ? `<div class="notice section-gap"><div><strong>Rationale</strong><br><span class="prose">${h(decision.rationale)}</span></div></div>` : ""}${decision.status === "proposed" ? `<div class="task-actions">${["accepted","rejected","superseded"].map(resolution => `<button class="button small ${resolution === "accepted" ? "primary" : resolution === "rejected" ? "danger" : "quiet"}" data-action="resolve-decision" data-decision="${h(decision.decision_id)}" data-resolution="${resolution}">${resolution[0].toUpperCase() + resolution.slice(1)}</button>`).join("")}</div>` : `<div class="list-meta"><span>Resolved by ${h(actorDisplay(decision.resolved_by || "unknown"))}</span><span>${h(fmtTime(decision.resolved_at))}</span></div>`}</article>`).join("") : `<div class="card">${empty("No decisions yet", "Propose the first durable project choice.")}</div>`}
          </section><aside class="card"><div class="card-head"><h2>Propose decision</h2></div><div class="card-body"><form data-form="propose-decision"><div class="field"><label for="decision-title">Title</label><input id="decision-title" name="title" required placeholder="Adopt stable workspace IDs"></div><div class="field section-gap"><label for="decision-detail">Detail</label><textarea id="decision-detail" name="detail" placeholder="What exactly are we choosing?"></textarea></div><div class="field section-gap"><label for="decision-rationale">Rationale</label><textarea id="decision-rationale" name="rationale" placeholder="Why is this the right tradeoff?"></textarea></div><div class="form-actions"><button class="button primary" type="submit">Propose decision</button></div></form></div></aside></div>`;
      }

      function renderHandoff() {
        const response = state.data.handoff || {};
        const handoff = response.handoff || {};
        const agents = state.data.agents?.agents || [];
        const effectiveActor = state.prefs.actor;
        const actorRecord = agents.find(agent => agent.agent_id === effectiveActor);
        const governed = Boolean(response.lead_director || agents.some(agent => agent.role === "director"));
        const canWrite = state.prefs.actorType !== "agent" || !governed || actorRecord?.role === "director";
        const labels = { objective: "Objective", what_changed: "What changed", active_work: "Active work", blockers: "Blockers", risks: "Risks", next_actions: "Next actions", notes: "Notes" };
        return pageHead("Cold-start brief", "Handoff", "Edit the current project brief so the next worker can resume without a rebrief.") +
          (state.errors.handoff ? errorNotice(state.errors.handoff) : "") +
          `<div class="grid main-side"><section class="card"><div class="card-head"><h2>Current handoff · context v${h(response.context_version ?? "—")}</h2><span class="faint small">${h(actorDisplay(response.handoff_updated_by || "not written"))} · ${h(fmtTime(response.handoff_updated_at))}</span></div><div class="card-body">${canWrite ? "" : `<div class="notice error"><span>!</span><div><strong>Director-only handoff.</strong><br>${h(actorDisplay(effectiveActor))} is ${h(actorRecord?.role || "not registered as a Director")}. ${state.prefs.owner ? `Owner ${h(state.prefs.owner)} is separate attribution and does not change the actor ID or role.` : ""} Use tasks and Room / Inbox to report work.</div></div>`}<form data-form="update-handoff" class="${canWrite ? "" : "section-gap"}"><div class="form-grid">${HANDOFF_FIELDS.map((field, index) => `<div class="field ${field === "objective" || field === "notes" ? "wide" : ""}"><label for="handoff-${field}">${h(labels[field])}</label><textarea id="handoff-${field}" name="${field}" ${index === 0 ? "required" : ""} ${canWrite ? "" : "disabled"} placeholder="${field === "blockers" ? "None" : "Write a concise, durable update…"}">${h(handoff[field] || "")}</textarea></div>`).join("")}</div><div class="form-actions"><button class="button primary" type="submit" ${canWrite ? "" : "disabled"}>Update handoff</button></div></form></div></section>
          <aside class="stack"><div class="card pad"><div class="eyebrow">Repository snapshot</div><div class="list section-gap"><div class="list-row"><span class="muted">Branch</span><code>${h(response.git?.branch || "—")}</code></div><div class="list-row"><span class="muted">Revision</span><code>${h(response.git?.head || "—")}</code></div><div class="list-row"><span class="muted">Open tasks</span><strong>${h(response.open_tasks?.length || 0)}</strong></div><div class="list-row"><span class="muted">Live decisions</span><strong>${h(response.decisions?.length || 0)}</strong></div></div></div><div class="notice"><span>i</span><div><strong>Context versioning</strong><br>Updating the handoff advances project context. Workers with older briefs should re-read it before writing.</div></div></aside></div>${(() => { const versions = state.data.handoffHistory?.versions || []; return versions.length > 1 ? `<section class="card section-gap"><div class="card-head"><h2>Handoff history</h2><span class="faint small">${h(versions.length)} versions</span></div><div class="card-body"><div class="list">${versions.map(v => `<details class="list-row" style="display:block"><summary><span class="list-title">v${h(v.version)}</span> <span class="faint small">${h(actorDisplay(v.updated_by || "unknown"))} · ${h(fmtTime(v.updated_at))}</span></summary><div class="message-body section-gap">${HANDOFF_FIELDS.map(f => (v.content && v.content[f]) ? `<div><strong>${h(labels[f])}:</strong> ${h(v.content[f])}</div>` : "").join("")}</div></details>`).join("")}</div></div></section>` : ""; })()}`;
      }

      function renderSearchResults(result) {
        if (!result) return `<div class="muted small section-gap">Search spans events, tasks, decisions, and saved handoffs.</div>`;
        const rows = [
          ...(result.events || []).map(item => ({ kind: "event", id: `#${item.seq}`, text: item.line })),
          ...(result.tasks || []).map(item => ({ kind: "task", id: item.task_id, text: `${item.title} · ${item.status}` })),
          ...(result.decisions || []).map(item => ({ kind: "decision", id: item.decision_id, text: `${item.title} · ${item.status}` })),
          ...(result.handoff_versions || []).map(item => ({ kind: "handoff", id: `v${item.version}`, text: `Updated by ${actorDisplay(item.updated_by)} · ${fmtTime(item.updated_at)}` }))
        ];
        return rows.length ? `<div class="list section-gap">${rows.map(item => `<div class="list-row"><div><div class="cluster">${statusBadge(item.kind)}<span class="mono small">${h(item.id)}</span></div><div class="small section-gap">${h(item.text)}</div></div></div>`).join("")}</div>` : empty("No project matches", `Nothing matched “${result.query}”.`);
      }

      function renderActivity() {
        const events = [...(state.data.events?.events || [])]
          .sort((left, right) => (Number(left.seq) || 0) - (Number(right.seq) || 0));
        const query = state.activityFilter.toLowerCase();
        const filtered = events.filter(event => !query || `${event.seq} ${event.event_type} ${event.actor_id} ${event.operational_actor_id || ""} ${event.owner || ""} ${event.task_id || ""} ${JSON.stringify(event.payload)}`.toLowerCase().includes(query));
        const activityScope = `${state.projectId}:${query}`;
        const activityPage = prepareFeedPage("activity", filtered, activityScope, ACTIVITY_PAGE_SIZE);
        const pagedEvents = [...activityPage.rows].reverse();
        const verify = state.data.verify;
        return pageHead("Append-only record", "Activity & ledger", "Inspect raw events, append a custom event, and verify the local hash chain.", `<button class="button" data-action="verify-ledger">Verify ledger</button>`) +
          `<div class="notice"><span>i</span><div><strong>Attribution is recorded literally.</strong><br>Canonical AI actor IDs are <code>&lt;workspace&gt;.&lt;role&gt;.&lt;runtime&gt;</code> and are displayed as <strong>Workspace · Role · Runtime</strong>. <strong>Run by user</strong> is the separate authenticated human responsible for that AI action. Legacy <code>jack.vscode</code> rows marked human/tool came from the <code>vscode</code> shell account; they are not evidence that the VS Code AI performed that work.</div></div>` +
          (state.errors.events ? errorNotice(state.errors.events) : "") +
          `<div class="grid main-side"><section class="card"><div class="card-head"><h2>${filtered.length} matching events</h2>${verify ? statusBadge(verify.ok ? "ok" : "error") : ""}</div><div class="card-body"><div class="filterbar"><input id="activity-search" type="search" value="${h(state.activityFilter)}" placeholder="Filter by type, actor, task, user, or payload…" aria-label="Filter activity history"><span class="faint small">Up to ${h(ACTIVITY_HISTORY_LIMIT)} events from the latest sequence window</span></div>${filtered.length ? `${feedToolbar("activity", activityPage, `${events.length} events loaded`)}<div class="history-feed" id="activity-feed" role="log" aria-label="Activity event history" aria-live="off" tabindex="0" data-feed-scope="${h(activityScope)}">${pagedEvents.map(event => { const operational = event.operational_actor_id || event.actor_id; return `<details class="event-row" data-feed-key="${h(event.seq)}"><summary><span class="mono faint">#${h(event.seq)}</span><span class="truncate">${statusBadge(event.event_type)}</span><span class="event-actor truncate muted" title="Ledger actor: ${h(event.actor_id)}">${h(attributionText(operational, event.actor_type, event.owner, event.attribution))}</span><span class="faint small">${h(fmtTime(event.created_at, false))}</span></summary><pre class="event-payload">${j(event.payload)}</pre></details>`; }).join("")}</div>` : empty("No matching events", "Change the filter or append a custom event.")}</div></section>
          <aside class="stack"><div class="card"><div class="card-head"><h2>Search project memory</h2>${state.searchResults ? `<span class="badge accepted">${h(state.searchResults.total_hits)} hits</span>` : ""}</div><div class="card-body"><form data-form="search-project"><div class="field"><label for="project-memory-search">Query</label><input id="project-memory-search" type="search" name="query" required value="${h(state.searchQuery)}" placeholder="decision, filename, message…"></div><div class="form-actions"><button class="button primary small" type="submit">Search everything</button></div></form>${renderSearchResults(state.searchResults)}</div></div>

          <div class="card"><div class="card-head"><h2>Append custom event</h2></div><div class="card-body"><form data-form="append-event"><div class="field"><label for="event-type">Event type</label><input id="event-type" name="event_type" required placeholder="prototype.note"></div><div class="field section-gap"><label for="event-payload">Payload JSON object</label><textarea id="event-payload" class="mono" name="payload" required placeholder='{"note":"Panel reviewed"}'>{}</textarea></div><div class="field section-gap"><label for="event-task">Task ID <span class="faint">optional</span></label><input id="event-task" name="task_id" placeholder="T-13"></div><div class="form-actions"><button class="button primary" type="submit">Append event</button></div></form></div></div></aside></div>`;
      }

      function renderCloudContext() {
        const cc = state.data.cloudContext?.cloud_context || { content: "", version: 0, updated_by: null, updated_at: null };
        const canManage = canManageProjectRules();

          (state.errors.cloudContext ? errorNotice(state.errors.cloudContext) : "") +
          `<section class="card section-gap"><div class="card-head"><div><h2>Workspace cloud context</h2><span class="faint small">version ${h(cc.version)}${cc.updated_at ? ` \u00b7 updated ${h(fmtTime(cc.updated_at))}` : ""}${cc.updated_by ? ` \u00b7 by ${h(actorDisplay(cc.updated_by))}` : ""}</span></div>${canManage ? `<span class="badge accepted">management enabled</span>` : `<span class="badge blocked">read only</span>`}</div><div class="card-body">
            ${canManage ? "" : `<div class="notice error"><span>i</span><div><strong>Human or registered Director management only.</strong><br>${h(attributionText(state.prefs.actor, state.prefs.actorType, state.prefs.owner))} may read the cloud context but cannot edit it.</div></div>`}
            <form data-form="save-cloud-context"><input type="hidden" name="expected_version" value="${h(cc.version)}"><div class="field wide"><label for="cloud-context-body">Context document</label><textarea id="cloud-context-body" name="content" rows="18" ${canManage ? "" : "disabled"} placeholder="# Project context every AI should read each turn">${h(cc.content || "")}</textarea></div>${canManage ? `<div class="form-actions"><button class="button primary" type="submit">Save cloud context</button></div>` : ""}</form>
          </div></section>`;

      function renderRules() {
        const rules = state.data.rules?.rules || [];
        const canManageRules = canManageProjectRules();
        const query = state.ruleFilter.trim().toLowerCase();
        const visibleRules = rules.filter(rule => !query ||
          `${rule.rule_id} ${rule.title} ${rule.body} ${rule.scope} ${rule.priority} ${rule.enabled ? "enabled" : "disabled"}`
            .toLowerCase().includes(query));
        const enabledRules = rules.filter(rule => rule.enabled).length;
        const permission = canManageRules ? "Human / Director management enabled" : "Read only for this identity";
        return pageHead(
          "Binding workspace directives",
          "Core Rules",
          "Manage the durable instructions that applicable AIs load automatically in this workspace.",
          `<button class="button" data-view="network">Open AI Network</button>`
        ) +
          `<div class="notice"><span>!</span><div><strong>These rules are server-side startup law.</strong><br>Project Rules / Directives are managed here as Core Rules. Every enabled rule scoped to <code>everyone</code> or an AI's registered role is loaded at startup, resume, and lifecycle refresh. The watcher checks for changes every 60 seconds by default, so home and office checkouts receive the same current directives. They sit above static managed AGENTS instructions; do not edit the managed block by hand.</div></div>` +
          (state.errors.rules ? errorNotice(state.errors.rules) : "") +
          `<section class="card section-gap" id="core-rules-manager"><div class="card-head"><div><h2>Workspace rules</h2><span class="faint small">${h(rules.length)} loaded · ${h(enabledRules)} enabled · ${h(permission)}</span></div>${canManageRules ? `<span class="badge accepted">management enabled</span>` : `<span class="badge blocked">read only</span>`}</div><div class="card-body">
            ${canManageRules ? "" : `<div class="notice error"><span>i</span><div><strong>Human or registered Director management only.</strong><br>${h(attributionText(state.prefs.actor, state.prefs.actorType, state.prefs.owner))} may read applicable enabled rules but cannot create, edit, enable, or disable them.</div></div>`}
            <div class="filterbar ${canManageRules ? "" : "section-gap"}"><input id="rule-search" type="search" value="${h(state.ruleFilter)}" placeholder="Filter by title, body, scope, status, or rule ID…" aria-label="Filter Core Rules"><span class="faint small">${h(visibleRules.length)} shown of ${h(rules.length)}</span></div>
            <div class="grid main-side"><section class="stack" aria-label="Core Rules list">${visibleRules.length ? visibleRules.map(rule => `<article class="bridge-panel" data-rule-card="${h(rule.rule_id)}"><div class="bridge-panel-head"><div><div class="cluster"><span class="mono muted">${h(rule.rule_id)}</span><span class="badge ${rule.enabled ? "accepted" : "done"}">${rule.enabled ? "enabled" : "disabled"}</span><span class="chip">${h(rule.scope)}</span><span class="chip">priority ${h(rule.priority)}</span></div><div class="list-meta"><span>version ${h(rule.version)}</span><span>updated ${h(fmtTime(rule.updated_at))}</span><span>by ${h(actorDisplay(rule.updated_by || "unknown"))}</span>${rule.updated_owner ? ownerChip(rule.updated_owner) : ""}</div></div>${canManageRules ? `<button class="button ${rule.enabled ? "danger" : "primary"} small" type="button" data-action="toggle-rule" data-rule="${h(rule.rule_id)}" data-version="${h(rule.version)}" data-enabled="${rule.enabled ? "true" : "false"}">${rule.enabled ? "Disable rule" : "Enable rule"}</button>` : ""}</div><form data-form="update-rule" data-rule="${h(rule.rule_id)}" class="section-gap"><input type="hidden" name="expected_version" value="${h(rule.version)}"><div class="form-grid"><div class="field"><label>Title</label><input name="title" required value="${h(rule.title)}" ${canManageRules ? "" : "disabled"}></div><div class="field"><label>Scope</label><select name="scope" ${canManageRules ? "" : "disabled"}>${RULE_SCOPES.map(scope => `<option value="${scope}" ${rule.scope === scope ? "selected" : ""}>${h(scope)}</option>`).join("")}</select></div><div class="field"><label>Priority</label><input name="priority" type="number" min="0" max="1000" required value="${h(rule.priority)}" ${canManageRules ? "" : "disabled"}><span class="help">Lower numbers load first.</span></div><div class="field wide"><label>Directive body</label><textarea name="body" required ${canManageRules ? "" : "disabled"}>${h(rule.body)}</textarea></div></div>${canManageRules ? `<div class="form-actions"><button class="button primary small" type="submit">Save rule changes</button></div>` : ""}</form></article>`).join("") : `<div class="bridge-panel">${empty(rules.length ? "No matching Core Rules" : "No Core Rules", rules.length ? "Change or clear the filter." : canManageRules ? "Create the first live workspace directive." : "No enabled rule applies to this panel identity.")}</div>`}</section>
              <aside class="card"><div class="card-head"><h3>Create Core Rule</h3></div><div class="card-body">${canManageRules ? `<form data-form="create-rule"><div class="field"><label for="rule-title">Title</label><input id="rule-title" name="title" required placeholder="Protect the v2 API boundary"></div><div class="field section-gap"><label for="rule-body">Directive body</label><textarea id="rule-body" name="body" required placeholder="State the durable instruction every applicable AI must follow."></textarea></div><div class="form-grid section-gap"><div class="field"><label for="rule-scope">Scope</label><select id="rule-scope" name="scope">${RULE_SCOPES.map(scope => `<option value="${scope}">${h(scope)}</option>`).join("")}</select></div><div class="field"><label for="rule-priority">Priority</label><input id="rule-priority" name="priority" type="number" min="0" max="1000" value="100" required><span class="help">0–1000; lower loads first.</span></div></div><div class="form-actions"><button class="button primary" type="submit">Create Core Rule</button></div></form>` : `<div class="muted">Switch the panel identity to a human or registered Director to manage Core Rules.</div>`}</div></aside>
            </div>
          </div></section>`;
      }

      function renderNetwork() {
        const agents = state.data.agents?.agents || [];
        const directors = agents.filter(agent => agent.role === "director");
        const bridges = state.data.bridges?.bridges || [];
        const status = state.data.status || {};
        const inbox = state.data.inbox?.messages || [];
        const relationshipInbox = inbox.filter(message => message.origin_project || message.authority);
        const otherProjects = state.projects.filter(project => project.project_id !== state.projectId);
        return pageHead("Cross-workspace coordination", "AI Network", "Manage workspace authority relationships and room participation as separate controls.", `<button class="button" data-view="room">Open Room / Inbox</button>`) +
          (state.errors.bridges ? errorNotice(state.errors.bridges) : "") +
          `<div class="notice"><span>i</span><div><strong>Relationship and participation answer different questions.</strong><br>Peer / Master / Advisor defines authority between workspaces. Participation defines which AIs may enter that one inter-project conversation. Changing participation never deletes the relationship; deleting the relationship disconnects the workspace rooms entirely. Roles still follow the workspace, not the app window.</div></div>
          <div class="grid two section-gap">
            <section class="card"><div class="card-head"><h2>Directors & workers</h2><span class="faint small">${agents.length} registered</span></div><div class="card-body">
              <form data-form="set-lead"><div class="field"><label for="lead-agent">Lead Director</label><select id="lead-agent" name="agent_id"><option value="">No lead director</option>${directors.map(agent => `<option value="${h(agent.agent_id)}" ${status.lead_director === agent.agent_id ? "selected" : ""}>${h(agent.display_name || actorDisplay(agent.agent_id))}</option>`).join("")}</select><span class="help">Only registered Directors can lead. The choice persists across Claude, Codex, Kimi, and other clients in this workspace.</span></div><div class="form-actions"><button class="button primary" type="submit">Save lead</button></div></form>
              <div class="list section-gap">${agents.length ? agents.map(agent => `<div class="list-row"><div><div class="list-title">${h(agent.display_name || actorDisplay(agent.agent_id))}</div><div class="list-meta"><span title="${h(agent.agent_id)}">${h(actorDisplay(agent.agent_id))}</span>${ownerChip(agent.owner)}<span>${h(agent.role || "role not assigned")}</span><span>${h(agent.runtime || "runtime unknown")}</span></div></div>${agent.agent_id === status.lead_director ? `<span class="badge accepted">lead</span>` : statusBadge(agent.role || "unassigned")}</div>`).join("") : `<div class="muted">No AIs registered yet. Guided setup asks for the first AI's role and recommends Director.</div>`}</div>
            </div></section>
            <section class="card"><div class="card-head"><h2>Register or change an AI role</h2></div><div class="card-body"><form data-form="register-agent"><div class="form-grid"><div class="field"><label for="agent-pick">AI agent</label><select id="agent-pick" name="agent_id" data-agent-pick>${agents.map(agent => `<option value="${h(agent.agent_id)}">${h(agent.display_name || actorDisplay(agent.agent_id))} · ${h(agent.role || "unassigned")}</option>`).join("")}<option value="__new__">+ Register a new actor…</option></select><span class="help">Pick an existing AI to change its role, or choose "Register a new actor".</span></div><div class="field" data-new-actor ${agents.length ? "hidden" : ""}><label for="agent-id-new">New canonical actor ID</label><input id="agent-id-new" name="agent_id_new" placeholder="analytics-admin.director.codex"><span class="help">&lt;workspace&gt;.&lt;role&gt;.&lt;runtime&gt; — do not add the owner's name.</span></div><div class="field"><label for="agent-name">Display name</label><input id="agent-name" name="display_name" placeholder="Analytics Admin · Director · Codex"></div><div class="field"><label for="agent-role">Role</label><select id="agent-role" name="role"><option value="director">Director · may write handoff</option><option value="advisor">Advisor · no handoff writes</option><option value="worker">Worker · no handoff writes</option></select></div><div class="field" data-new-actor ${agents.length ? "hidden" : ""}><label for="agent-runtime">Runtime</label><input id="agent-runtime" name="runtime" placeholder="codex"></div></div><div class="form-actions"><button class="button primary" type="submit">Save AI role</button></div></form></div></section>
            <section class="card" style="grid-column:1/-1"><div class="card-head"><h2>Connect workspace rooms</h2><span class="faint small">default relationship: master</span></div><div class="card-body"><form data-form="add-bridge"><div class="field"><label for="bridge-project">Connected workspace</label><select id="bridge-project" name="other_project" required ${otherProjects.length ? "" : "disabled"}><option value="">Choose workspace…</option>${otherProjects.map(project => `<option value="${h(project.project_id)}">${h(project.name)} · ${h(project.project_id)}</option>`).join("")}</select></div><div class="bridge-relationship section-gap"><div class="eyebrow">Authority relationship</div><div class="form-grid section-gap"><div class="field"><label for="bridge-relation">Relationship</label><select id="bridge-relation" name="relation"><option value="master">Master / subordinate (default)</option><option value="peer">Peer</option><option value="advisor">Advisor</option></select></div><div class="field"><label for="bridge-principal">Who is master/advisor?</label><select id="bridge-principal" name="principal_side"><option value="other">Connected workspace (default)</option><option value="current">This workspace</option></select></div></div></div><div class="bridge-relationship section-gap"><div class="eyebrow">Initial room participation</div><p class="muted small">Set access atomically when creating the relationship. This policy does not change which workspace is master, advisor, or peer.</p><div class="form-grid section-gap">${bridgeParticipationFields("new", "local", state.projectId)}${bridgeParticipationFields("new", "peer", "Connected workspace")}</div></div><div class="form-actions"><button class="button primary" type="submit" ${otherProjects.length ? "" : "disabled"}>Create relationship</button></div></form><div class="notice section-gap"><span>i</span><div>Master directives are binding; advisor messages are advice; peers are equal. Participation independently limits who may read, send, or mutate the named inter-project conversation.</div></div></div></section>
            <section class="card" style="grid-column:1/-1"><div class="card-head"><h2>Connected rooms</h2><span class="faint small">${bridges.length} relationship${bridges.length === 1 ? "" : "s"}</span></div><div class="card-body">${bridges.length ? bridges.map(bridge => `<article class="bridge-panel"><div class="bridge-panel-head"><div><h3>${h(projectName(state.projectId))} ↔ ${h(projectName(bridge.with))}</h3><div class="list-meta"><span>${h(bridge.relation)} relationship</span>${bridge.principal ? `<span>${h(projectName(bridge.principal))} is ${h(bridge.relation === "master" ? "master" : "advisor")}</span>` : `<span>equal authority</span>`}<span>${h(projectName(state.projectId))}: ${h(bridgeParticipationLabel(bridge.participation))}</span><span>${h(projectName(bridge.with))}: ${h(bridgeParticipationLabel(bridge.peer_participation))}</span></div></div><div class="cluster">${bridge.can_participate === false ? `<span class="badge error">panel identity denied</span>` : bridge.can_participate === true ? `<span class="badge accepted">panel identity allowed</span>` : ""}</div></div><div class="grid two section-gap"><div class="bridge-relationship"><div class="eyebrow">Authority relationship</div><p class="muted small"><strong>${h(identityPart(bridge.relation))}</strong> controls authority only. Delete this relationship only when the workspace rooms should be disconnected.</p><div class="cluster section-gap"><button class="button small" data-action="open-connected-room" data-project="${h(bridge.with)}">View conversation</button><button class="button danger small" data-action="remove-bridge" data-project="${h(bridge.with)}">Delete relationship</button></div></div><div class="bridge-relationship"><div class="eyebrow">Room participation</div><form data-form="update-bridge-participation" data-project="${h(bridge.with)}"><div class="form-grid section-gap">${bridgeParticipationFields(bridge.with, "local", state.projectId, bridge.participation, bridge.allowed_agents)}${bridgeParticipationFields(bridge.with, "peer", bridge.with, bridge.peer_participation, bridge.peer_allowed_agents)}</div><div class="form-actions"><button class="button primary small" type="submit">Save participation</button></div></form><span class="help">Saving here changes access only. It never removes or changes the ${h(bridge.relation)} relationship.</span></div></div></article>`).join("") : `<div class="muted">No connected workspace rooms yet.</div>`}</div></section>
            <section class="card" style="grid-column:1/-1"><div class="card-head"><h2>Relationship inbox evidence</h2><span class="faint small">read-only setup signal</span></div><div class="card-body">${relationshipInbox.length ? `<div class="list">${relationshipInbox.slice(-10).map(message => `<div class="list-row"><div><div class="cluster"><span class="list-title" title="Ledger actor: ${h(message.ledger_actor || message.actor)}">${h(attributionText(message.actor, message.actor_type, message.owner, message.attribution))}</span><span class="chip">from ${h(projectName(message.origin_project || "connected"))}</span>${message.authority ? `<span class="badge">${h(message.authority)}</span>` : ""}</div><div class="message-body">${h(message.body)}</div></div><span class="faint small">#${h(message.seq)}</span></div>`).join("")}</div>` : `<div class="muted">No cross-workspace messages are addressed to panel actor ${h(actorDisplay(state.prefs.actor))}. This says nothing about other actors' inboxes; open Room / Inbox to read every named inter-project conversation.</div>`}</div></section>
          </div>`;
      }

      function credentialOwner(record, account) {
        return record?.human_owner || record?.owner_username || record?.username || record?.owner || account?.username || "not recorded";
      }

      function credentialStatus(record) {
        if (record?.revoked_at) return "revoked";
        if (record?.expires_at && new Date(record.expires_at).valueOf() <= Date.now()) return "expired";
        return "active";
      }

      function renderCredentialMemberships(record) {
        const memberships = credentialMemberships(record);
        return memberships.length
          ? memberships.map(projectId => `<span class="chip">${h(projectName(projectId))} · ${h(projectId)}</span>`).join("")
          : `<span class="chip">no workspace membership</span>`;
      }

      function renderCredentialBindings(record) {
        const bindings = credentialBindings(record);
        return bindings.length
          ? bindings.map(binding => `<span class="chip" title="Exact AI actor binding">${h(binding.actor_id)}${binding.project_id ? ` · ${h(binding.project_id)}` : ""}</span>`).join("")
          : `<span class="chip">no AI actor binding</span>`;
      }

      function renderTerminalRow(terminal, account) {
        const status = credentialStatus(terminal);
        const label = terminal.client_label || terminal.device_label || terminal.label || "Unnamed terminal";
        return `<div class="list-row"><div><div class="cluster"><strong>${h(label)}</strong>${statusBadge(status)}</div><div class="list-meta"><span>Human owner: @${h(credentialOwner(terminal, account))}</span><span>Device ID: ${h(terminal.device_id || "not reported")}</span><span>Last use: ${h(fmtTime(terminal.last_used_at))}</span><span>${terminal.expires_at ? `Expires: ${h(fmtTime(terminal.expires_at))}` : "No expiry"}</span>${terminal.revoked_at ? `<span>Revoked: ${h(fmtTime(terminal.revoked_at))}</span>` : ""}</div><div class="cluster section-gap"><span class="faint small">Workspace membership</span>${renderCredentialMemberships(terminal)}</div><div class="cluster section-gap"><span class="faint small">Separate AI actors</span>${renderCredentialBindings(terminal)}</div></div>${status === "active" ? `<button class="button danger small" type="button" data-action="revoke-terminal" data-token="${h(terminal.token_id || terminal.terminal_id)}">Revoke terminal</button>` : ""}</div>`;
      }

      function renderServiceKeyRow(key, account) {
        const status = credentialStatus(key);
        return `<div class="list-row"><div><div class="cluster"><strong>${h(key.label || "Unnamed service")}</strong>${statusBadge(status)}</div><div class="list-meta"><span>Owned by: @${h(credentialOwner(key, account))}</span><span>Prefix: ${h(key.token_prefix || "unavailable")}…</span><span>Last use: ${h(fmtTime(key.last_used_at))}</span><span>${key.expires_at ? `Expires: ${h(fmtTime(key.expires_at))}` : "No expiry"}</span></div><div class="cluster section-gap"><span class="faint small">Workspace scope</span>${renderCredentialMemberships(key)}</div><div class="cluster section-gap"><span class="faint small">Exact allowed AI actors</span>${renderCredentialBindings(key)}</div></div>${status === "active" ? `<button class="button danger small" type="button" data-action="revoke-service-key" data-key="${h(key.token_id)}">Revoke key</button>` : ""}</div>`;
      }

      function renderInvitationRow(invitation) {
        const status = invitation.revoked_at ? "revoked" : invitation.accepted_at ? "accepted" : invitation.expires_at && new Date(invitation.expires_at).valueOf() <= Date.now() ? "expired" : "pending";
